<title>てがかり仕分け｜副業の明細を、事業候補・要判断・私用候補に</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D2026'/%3E%3Crect x='6' y='9' width='5' height='15' rx='2.5' fill='%237FA6F2'/%3E%3Crect x='13.5' y='6' width='5' height='18' rx='2.5' fill='%23F2B53A'/%3E%3Crect x='21' y='12' width='5' height='12' rx='2.5' fill='%2373C69B'/%3E%3C/svg%3E">
<style>
/* =========================================================================
 * てがかり仕分け  style.css
 *   色は3区分（事業＝青／要判断＝琥珀／私用＝緑）だけに使い、
 *   区分は「色・アイコン・ラベル・位置（左・中央・右）」の4つで見分けられるようにする。
 * ========================================================================= */
:root {
  --bg: #F5F4EF; --surface: #FFFFFF; --sunken: #EFEDE6;
  --ink: #1D2026; --ink-2: #434851; --muted: #636975; --line: #E1DED5; --line-2: #CFCBC0;
  --biz: #1F57C3; --biz-ink: #16409A; --biz-bg: #EAF1FD; --biz-line: #A8C2F0;
  --ask: #965700; --ask-ink: #774400; --ask-bg: #FFF4DC; --ask-line: #EFC56C; --ask-strong: #D99A0B;
  --pvt: #1C7650; --pvt-ink: #155C3D; --pvt-bg: #E5F3EB; --pvt-line: #9CCFB3;
  --primary: #1D2026; --primary-ink: #FFFFFF;
  --focus: #1F57C3;
  --r: 12px; --r-sm: 8px;
  --sh: 0 1px 2px rgba(29, 32, 38, .06), 0 6px 16px rgba(29, 32, 38, .05);
  --sh-lg: 0 10px 40px rgba(29, 32, 38, .18);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, -apple-system, sans-serif;
  --mono: "BIZ UDGothic", "Osaka-Mono", "MS Gothic", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.65; font-feature-settings: "palt" 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- ヘッダー・必須表示・進み具合 ---------- */
.app-header { background: var(--surface); border-bottom: 1px solid var(--line); }
.hd-in { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: .02em; white-space: nowrap; }
.brand-tag { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.hd-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink-2); min-height: 32px; }
.chip-btn:hover { background: var(--sunken); }
.chip-btn svg { width: 15px; height: 15px; }
.chip-btn .n { font-weight: 700; color: var(--ink); }

.notice { background: #EDEFF3; border-bottom: 1px solid #DADDE3; }
.notice-in { max-width: 1240px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #2F343C; line-height: 1.55; }
.notice svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: #4A5260; }

.steps { max-width: 1240px; margin: 0 auto; padding: 14px 20px 0; display: flex; gap: 6px; list-style: none; flex-wrap: wrap; }
.steps li { flex: 1 1 0; min-width: 120px; }
.steps button { width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: 0; border-top: 3px solid var(--line-2); padding: 8px 2px 4px; text-align: left; color: var(--muted); font-size: 13px; }
.steps .no { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--sunken); color: var(--ink-2); flex: none; }
.steps .no svg { width: 14px; height: 14px; }
.steps li.done button { border-top-color: var(--ink-2); color: var(--ink-2); }
.steps li.done .no { background: var(--ink-2); color: #fff; }
.steps li.cur button { border-top-color: var(--ink); color: var(--ink); font-weight: 700; }
.steps li.cur .no { background: var(--ink); color: #fff; }
.steps button:disabled { cursor: default; opacity: .75; }

main { max-width: 1240px; margin: 0 auto; padding: 18px 20px 60px; }
.view h1 { font-size: 24px; line-height: 1.4; margin: 4px 0 6px; letter-spacing: .01em; }
.lead { color: var(--ink-2); margin: 0 0 14px; max-width: 760px; }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); padding: 8px 14px; min-height: 40px; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--sunken); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { background: #343944; }
.btn.primary:disabled, .btn:disabled { background: #D8D5CD; border-color: #D8D5CD; color: #5D626B; cursor: not-allowed; }
.btn.big { min-height: 52px; padding: 10px 22px; font-size: 16px; border-radius: 12px; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn.link { border: 0; background: none; padding: 4px 2px; min-height: 32px; color: var(--biz-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.btn.link:hover { background: none; color: var(--ink); }
.btn.biz { background: var(--biz); border-color: var(--biz); color: #fff; }
.btn.biz:hover { background: var(--biz-ink); }
.btn.pvt { background: var(--pvt); border-color: var(--pvt); color: #fff; }
.btn.pvt:hover { background: var(--pvt-ink); }
.btn.ask { background: var(--ask-bg); border-color: var(--ask-line); color: var(--ask-ink); }

/* ---------- 区分の印（色・アイコン・ラベル） ---------- */
.cat { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 10px 1px 7px; font-size: 12.5px; font-weight: 700; border: 1px solid; white-space: nowrap; line-height: 1.6; }
.cat svg { width: 14px; height: 14px; }
.cat.biz { color: var(--biz-ink); background: var(--biz-bg); border-color: var(--biz-line); }
.cat.ask { color: var(--ask-ink); background: var(--ask-bg); border-color: var(--ask-line); }
.cat.pvt { color: var(--pvt-ink); background: var(--pvt-bg); border-color: var(--pvt-line); }
.final { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.final svg { width: 14px; height: 14px; }
.final.biz { color: var(--biz-ink); }
.final.pvt { color: var(--pvt-ink); }
.final.open { color: var(--muted); font-weight: 600; }

/* ---------- プロフィール ---------- */
.intro-actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 0 0 18px; }
.intro-actions .sep { color: var(--muted); font-size: 13px; }
.pf-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
.pf-form { display: grid; gap: 14px; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; box-shadow: var(--sh); }
.field label.q { display: flex; gap: 10px; align-items: baseline; font-weight: 700; font-size: 15.5px; margin-bottom: 8px; }
.field .qn { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--ink); color: #fff; font-size: 13px; flex: none; transform: translateY(2px); }
.field textarea { width: 100%; border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 9px 11px; background: #FCFCFA; resize: vertical; min-height: 44px; line-height: 1.6; }
.field textarea:focus { outline: 3px solid rgba(31, 87, 195, .25); border-color: var(--biz); outline-offset: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips .lbl { font-size: 12px; color: var(--muted); align-self: center; margin-right: 2px; }
.add-chip { border: 1px dashed var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--ink-2); min-height: 30px; }
.add-chip:hover { border-style: solid; background: var(--sunken); }
/* 右の欄は画面に収め、手がかりの一覧だけを中でスクロールさせて「次へ」を常に見えるようにする */
.pf-read { position: sticky; top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 16px; display: flex; flex-direction: column; max-height: max(360px, calc(100vh - 380px)); }
#clue-panel { overflow: auto; min-height: 60px; flex: 1 1 auto; margin: 0 -6px; padding: 0 6px; }
.pf-next { flex: none; border-top: 1px solid var(--line); padding-top: 12px; }
.pf-read h2 { font-size: 15px; margin: 0 0 2px; }
.pf-read .sub { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
.clue-group { margin: 10px 0 0; }
.clue-group h3 { font-size: 12px; color: var(--muted); margin: 0 0 4px; font-weight: 700; letter-spacing: .04em; }
.clue-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.clue-list li { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: baseline; font-size: 13.5px; padding: 5px 8px; border-radius: 8px; background: #F8F7F3; }
.clue-list .cl { font-weight: 700; white-space: nowrap; }
.clue-list .cq { color: var(--ink-2); font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
.clue-list li.neg { background: #F3F1EC; }
.clue-list li.neg .cl { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-2); }
.clue-empty { font-size: 13px; color: var(--muted); background: #F8F7F3; border-radius: 8px; padding: 10px 12px; margin: 8px 0 0; }
.pf-next { margin-top: 14px; display: grid; gap: 6px; }
.pf-next .btn { width: 100%; }
.pf-next .hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* ---------- 明細の読み込み ---------- */
.drop { display: grid; place-items: center; gap: 8px; text-align: center; border: 2px dashed var(--line-2); border-radius: 16px; background: var(--surface); padding: 44px 20px; transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--biz); background: var(--biz-bg); }
.drop svg { width: 40px; height: 40px; color: var(--ink-2); }
.drop strong { font-size: 17px; }
.drop .or { color: var(--muted); font-size: 13px; }
.fine { color: var(--ink-2); font-size: 13.5px; padding-left: 1.2em; margin: 14px 0; }
.fine li { margin: 2px 0; }
.err { background: #FDECEC; border: 1px solid #F2B8B5; color: #8C1D18; border-radius: 10px; padding: 10px 14px; margin: 12px 0; font-size: 14px; }

/* ---------- 仕分けと確認（ボード） ---------- */
.bd-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 18px; align-items: center; margin-bottom: 12px; }
.bd-title { margin: 0; font-size: 22px; line-height: 1.4; }
.bd-file { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 2px; }
.bd-file .fn { font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: flex; align-items: center; gap: 14px; box-shadow: var(--sh); }
.progress .pg-txt { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.progress .pg-txt b { font-size: 20px; color: var(--ink); }
.pg-bar { width: 160px; height: 10px; background: var(--sunken); border-radius: 99px; overflow: hidden; display: flex; }
.pg-bar span { display: block; height: 100%; }
.pg-bar .b { background: var(--biz); } .pg-bar .p { background: var(--pvt); }

.next { display: flex; align-items: center; gap: 14px; background: var(--ink); color: #fff; border-radius: var(--r); padding: 12px 16px; margin: 0 0 12px; }
.next .nx-ic { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, .14); display: grid; place-items: center; flex: none; }
.next .nx-ic svg { width: 18px; height: 18px; }
.next .nx-t { font-weight: 700; font-size: 15.5px; }
.next .nx-s { font-size: 13px; opacity: .86; }
.next .btn { margin-left: auto; background: #fff; color: var(--ink); border-color: #fff; white-space: nowrap; }
.next .btn:hover { background: #ECEAE3; }
.next.done { background: var(--pvt-ink); }

.qcard { background: var(--surface); border: 1px solid var(--ask-line); border-left: 6px solid var(--ask-strong); border-radius: var(--r); padding: 12px 16px; margin: 0 0 12px; box-shadow: var(--sh); }
.qcard .qh { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ask-ink); font-weight: 700; }
.qcard .qh svg { width: 16px; height: 16px; flex: none; }
.qcard .qq { font-size: 16.5px; font-weight: 700; margin: 4px 0 2px; }
.qcard .qi { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
.qcard .qb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qcard .qb .btn.link { margin-left: auto; }

.clues { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 14px; font-size: 13px; color: var(--ink-2); }
.clues .ttl { font-weight: 700; color: var(--ink); margin-right: 2px; }
.clue { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; min-height: 28px; display: inline-flex; gap: 5px; align-items: center; }
.clue .k { color: var(--muted); font-weight: 700; }
.clue[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.clue[aria-pressed="true"] .k { color: #fff; }
.clue.neg { text-decoration: line-through; }
.clue.zero { border-style: dashed; color: var(--muted); }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin: -4px 0 12px; }
.tool-row .hint { font-size: 12.5px; color: var(--ink-2); }
.toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; min-height: 32px; color: var(--ink-2); }
.toggle[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.toggle svg { width: 14px; height: 14px; }
.rule-tbl { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0 12px; }
.rule-tbl th, .rule-tbl td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.rule-tbl thead th { background: #F4F2EC; }
.rule-tbl td .cat { font-size: 12px; }
.rule-tbl small { display: block; color: var(--ink-2); font-size: 11.5px; margin-top: 2px; }
.ol { padding-left: 1.3em; margin: 4px 0 10px; font-size: 13.5px; }
.ol li { margin: 3px 0; }

.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.lane { background: var(--sunken); border-radius: 14px; padding: 10px; min-width: 0; border-top: 5px solid; }
.lane.biz { border-top-color: var(--biz); }
.lane.ask { border-top-color: var(--ask-strong); background: #F6EFDD; }
.lane.pvt { border-top-color: var(--pvt); }
.lane-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 6px; flex-wrap: wrap; }
.lane-h .li { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.lane-h .li svg { width: 18px; height: 18px; }
.lane.biz .li { background: var(--biz); color: #fff; } .lane.ask .li { background: var(--ask-strong); color: #2B1A00; } .lane.pvt .li { background: var(--pvt); color: #fff; }
.lane-h h2 { margin: 0; font-size: 17px; display: flex; align-items: baseline; gap: 6px; }
.lane-h h2 .n { font-size: 20px; }
.lane-h .ls { font-size: 12.5px; color: var(--ink-2); }
.lane-h .btn { margin-left: auto; }
.lane-d { font-size: 12.5px; color: var(--ink-2); margin: 0 4px 8px; line-height: 1.5; }
.lane-bar { height: 4px; background: rgba(0, 0, 0, .07); border-radius: 9px; margin: 0 4px 10px; overflow: hidden; }
.lane-bar span { display: block; height: 100%; background: var(--ink-2); }
/* button は中身の幅（nowrap の摘要）を最小幅にするため、列からはみ出す。最小幅を 0 にして列の幅に収める */
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; }
.cards > * { min-width: 0; }
.lane-empty { font-size: 13px; color: var(--ink-2); text-align: center; padding: 16px 8px; border: 1px dashed var(--line-2); border-radius: 10px; }

.card { display: block; width: 100%; min-width: 0; max-width: 100%; overflow: hidden; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 8px 12px; position: relative; box-shadow: 0 1px 1px rgba(0, 0, 0, .03); transition: box-shadow .15s, transform .15s, opacity .2s; }
.card:hover { box-shadow: var(--sh); }
.card .c1 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.card .cd { font-size: 12px; color: var(--muted); white-space: nowrap; }
.card .cn { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .ca { font-weight: 700; font-size: 14px; white-space: nowrap; }
.card .ca.in::before { content: "入金 "; font-size: 11px; color: var(--muted); font-weight: 600; }
.card .c2 { display: flex; gap: 6px; align-items: center; margin-top: 3px; min-width: 0; }
.card .ct { font-size: 11.5px; color: var(--ink-2); background: var(--sunken); border-radius: 5px; padding: 0 6px; white-space: nowrap; flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
.card .cw { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card .c3 { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.card .note { font-size: 11px; font-weight: 700; border-radius: 5px; padding: 0 6px; background: #FDECEC; color: #8C1D18; }
.card .note.soft { background: #EEF0F3; color: #3B414B; }
.card .st { margin-left: auto; }
.card[data-state="open"] { border-style: dashed; border-color: var(--line-2); }
.card[data-state="open"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 3px 3px 0; background: var(--line-2); }
.card[data-final="biz"]::before, .card[data-final="pvt"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 10px 0 0 10px; }
.card[data-final="biz"]::before { background: var(--biz); }
.card[data-final="pvt"]::before { background: var(--pvt); }
.card[data-final] { background: #FCFCFB; }
.card.moved { animation: moved 2.4s ease-out 1; }
@keyframes moved { 0% { box-shadow: 0 0 0 4px var(--ask-strong); } 100% { box-shadow: 0 0 0 0 transparent; } }
.lanes.hl .card { opacity: .38; }
.lanes.hl .card.hit { opacity: 1; box-shadow: 0 0 0 2px var(--ink); }

.lane-tabs { display: none; }

/* ---------- 書き出し ---------- */
.ex-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.checks { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }

<script>
/* ---- 00_dict.js ---- */

  '美容室': 'ビヨウシツ', '美容院': 'ビヨウイン', '日用品': 'ニチヨウヒン', '雑貨': 'ザッカ', '玩具': 'ガング',
  '保険': 'ホケン', '損保': 'ソンポ', '自動車': 'ジドウシャ', '駐車場': 'チュウシャジョウ', '給油': 'キュウユ',

/* =========================================================================
 * 10_text.js  文字の正規化と、辞書の言葉の照合
 * ========================================================================= */

/* ひらがな → カタカナ */
TG.toKatakana = function (s) {
  return s.replace(/[ぁ-ゖ]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) + 0x60); });
};

/* 照合用の正規化：NFKC（半角カナ→全角、全角英数→半角、全角スペース→半角）→ カタカナ → 大文字 → 空白をまとめる */
TG.norm = function (s) {
  if (s === null || s === undefined) return '';
  var t = String(s);
  if (t.normalize) t = t.normalize('NFKC');
  t = TG.toKatakana(t).toUpperCase();
  t = t.replace(/[‐-―−－]/g, '-');
  /* 銀行明細のカナは長音を「-」で書くことがある（ｶ-ﾄﾞ → カード） */
  t = t.replace(/([ァ-ヺ])-(?=[ァ-ヺ])/g, '$1ー');
  return t.replace(/\s+/g, ' ').trim();
};

/* 空白・中点・記号を除いた形（「ドラッグ・ハナミズキ」と「ドラッグハナミズキ」を同じに見る） */
TG.compact = function (s) {
  return s.replace(/[\s・･\-_.,，、。'"’`]/g, '');
};

/* 表示用：半角カナなどを読みやすくしたもの（元の文字列は別に保持する） */
TG.readable = function (s) {
  var t = String(s || '');
  if (t.normalize) t = t.normalize('NFKC');
  return t.replace(/\s+/g, ' ').trim();
};

/* 半角カナを含むか（読みを添えるかどうかの判断に使う） */
TG.hasHalfKana = function (s) { return /[｡-ﾟ]/.test(String(s || '')); };

TG.escRe = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };

/* 漢字の言葉 → READING を使ったカナ表記（長い言葉から置き換える） */
TG._readingKeys = null;
TG.readingOf = function (word) {
  if (!TG._readingKeys) TG._readingKeys = Object.keys(TG.READING).sort(function (a, b) { return b.length - a.length; });
  var out = word, changed = false;
  for (var i = 0; i < TG._readingKeys.length; i++) {
    var k = TG._readingKeys[i];
    if (out.indexOf(k) >= 0) { out = out.split(k).join(TG.READING[k]); changed = true; }
  }
  return changed ? out : null;
};

/* 辞書の言葉を照合できる形にする
 *   文字列     → 正規化した形（＋カナ表記）を compact な本文の中から探す
 *   'word'     → 英字の単語として探す（「AI」が「MAIL」に当たらないように）
 *   関数       → fn(spaced, compact) が true/数値(位置) を返せば一致
 */
TG.compileKw = function (list) {
  var out = [];
  (list || []).forEach(function (k) {
    var p, w, mode;
    if (Array.isArray(k)) { p = k[0]; w = (k[1] === undefined ? 1 : k[1]); mode = k[2]; } else { p = k; w = 1; }

/* 文字コード：BOM → UTF-8（厳密）→ Shift_JIS の順に試す */

  if (b.length >= 2 && b[0] === 0xFE && b[1] === 0xFF) return { text: new TextDecoder('utf-16be').decode(b.subarray(2)), encoding: 'UTF-16' };
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(b), encoding: 'UTF-8' }; } catch (e) { /* 次を試す */ }
  try { return { text: new TextDecoder('shift_jis').decode(b), encoding: 'Shift_JIS' }; } catch (e) { /* 次を試す */ }

/* CSVの文法（RFC 4180）：引用符、引用符の中のカンマ・改行、"" のエスケープ、CRLF/LF/CR */

  var rows = [], row = [], field = '', i = 0, n = text.length, inQ = false, quoted = false;
  delim = delim || ',';

    if (inQ) {

        if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"' && field === '' && !quoted) { inQ = true; quoted = true; i++; continue; }
    if (c === delim) { row.push(field); field = ''; quoted = false; i++; continue; }
    if (c === '\r' || c === '\n') {

      i += (c === '\r' && text.charAt(i + 1) === '\n') ? 2 : 1; continue;
    }
    field += c; i++;

};

/* 区切り文字の推定（カンマ・タブ・セミコロン） */

    if (!rows.length) return;

    rows.forEach(function (r) { counts[r.length] = (counts[r.length] || 0) + 1; });

/* 日付：2026/9/1、2026-09-01、2026年9月1日、20260901、R8.9.1、令和8年9月1日、26/09/01、9/1（年なし） */

/* 金額：「3,300」「2,400円」「¥1,980」「-3,300」「△3,300」「▲3,300」「(3,300)」「1980-」、全角数字 */
TG.parseAmount = function (s) {

/* 見出し行を探し、列の役割を決める */
TG.analyzeTable = function (rows) {
  var issues = [];

    if (core >= 2 && (!best || core > best.core)) best = { idx: i, roles: roles, core: core };
    if (best && best.core === 3) break;
  }

  var data = rows.slice(headerIndex + 1).filter(function (r) { return r && r.join('').trim() !== ''; });
  var byContent = TG.inferByContent(data, roles);
  var via = {};
  ['date', 'desc', 'amount', 'out', 'in'].forEach(function (k) { via[k] = roles[k] >= 0 ? 'header' : (byContent[k] >= 0 ? 'content' : 'none'); if (roles[k] < 0 && byContent[k] >= 0) roles[k] = byContent[k]; });
  var width = 0; rows.forEach(function (r) { if (r.length > width) width = r.length; });
  var header0 = headerIndex >= 0 ? rows[headerIndex] : [];

  if (headerIndex >= 0 && roles.desc >= 0) {
    var distinct = function (j) { var s = {}; data.forEach(function (r) { var v = (r[j] || '').trim(); if (v) s[v] = 1; }); return Object.keys(s).length; };
    var cands = (roles.notes || []).filter(function (j) { return TG.headerRoleOf(header0[j]).some(function (c) { return c.role === 'desc' && c.q >= 2; }); });
    var bestJ = roles.desc, bestD = distinct(roles.desc);
    cands.forEach(function (j) { var d = distinct(j); if (d > bestD) { bestD = d; bestJ = j; } });
    if (bestJ !== roles.desc) {
      issues.push('摘要の列は、中身の種類が多い「' + header0[bestJ] + '」にしました（「' + header0[roles.desc] + '」は仕分けの手がかりとして使います）。');

TG.assignHeaderRoles = function (cells) {

      var v = (r[j] || '').trim();
      if (!v) return;
      ne++; len += v.length;
      var pd = TG.parseDate(v), pa = TG.parseAmount(v);
      if (pd && pd.y !== null) dt++; else if (pa && pa.ok) num++; else txt++;
    });
    stats.push({ j: j, ne: ne, dt: ne ? dt / ne : 0, num: ne ? num / ne : 0, txt: ne ? txt / ne : 0, avg: ne ? len / ne : 0 });
  }
  var taken = {};
  ['date', 'desc', 'amount', 'out', 'in', 'balance', 'dir'].forEach(function (k) { if (roles[k] >= 0) taken[roles[k]] = 1; });
  (roles.notes || []).forEach(function (j) { taken[j] = 1; });
  if (roles.date < 0) {
    var d = stats.filter(function (s) { return !taken[s.j] && s.dt >= 0.6; }).sort(function (a, b) { return b.dt - a.dt; })[0];
    if (d) { res.date = d.j; taken[d.j] = 1; }
  }
  if (roles.desc < 0) {
    var t = stats.filter(function (s) { return !taken[s.j] && s.txt >= 0.6; }).sort(function (a, b) { return (b.txt * b.avg) - (a.txt * a.avg); })[0];
    if (t) { res.desc = t.j; taken[t.j] = 1; }
  }
  if (roles.amount < 0 && roles.out < 0 && roles['in'] < 0) {
    var descJ = roles.desc >= 0 ? roles.desc : res.desc;
    var nums = stats.filter(function (s) { return !taken[s.j] && s.num >= 0.6 && s.ne >= sample.length * 0.6; });
    var after = nums.filter(function (s) { return s.j > descJ; });
    var a = (after.length ? after : nums)[0];
    if (a) res.amount = a.j;
  }
  return res;
};

/* 表 → 明細の行（元の文字列 raw と、読み取った値） */
TG.buildRows = function (rows, an, opts) {
  opts = opts || {};
  var r = an.roles, out = [], blank = 0, summary = [];
  var start = an.dataStart !== undefined ? an.dataStart : an.headerIndex + 1;
  var cell = function (row, j) { return (j >= 0 && j < row.length) ? row[j] : ''; };
  var noteCols = (r.notes || []).slice();
  for (var i = start; i < rows.length; i++) {
    var row = rows[i];
    if (!row || row.join('').trim() === '') { blank++; continue; }
    var rawDate = cell(row, r.date), rawDesc = cell(row, r.desc);
    var pd = TG.parseDate(rawDate);
    var isSummary = (!pd) && (TG.SUMMARY_ROW.test(TG.readable(rawDesc)) || TG.SUMMARY_ROW.test(TG.readable(rawDate)) || (!rawDesc.trim() && !rawDate.trim()));
    var item = { line: i + 1, cells: row.slice(), raw: { date: rawDate, desc: rawDesc, amount: '' }, pd: pd, notesText: noteCols.map(function (j) { return cell(row, j); }).filter(function (v) { return v && !/^[0-9.,\-\s]+$/.test(v); }).join(' ') };
    if (an.mode === 'split') {
      var o = cell(row, r.out), n = cell(row, r['in']);
      var po = TG.parseAmount(o), pn = TG.parseAmount(n);
      item.rawOut = o; item.rawIn = n;
      if (po && po.ok && po.value !== 0) { item.amount = Math.abs(po.value); item.dir = po.value < 0 ? 'in' : 'out'; item.raw.amount = o; item.amountDecorated = po.decorated; }
      else if (pn && pn.ok) { item.amount = Math.abs(pn.value); item.dir = pn.value < 0 ? 'out' : 'in'; item.raw.amount = (opts.inSign === 'plain' || /^\s*[-−△▲(]/.test(n)) ? n : ('-' + n.trim()); item.amountDecorated = pn.decorated; item.fromIn = true; }
      else if (po && po.ok) { item.amount = 0; item.dir = 'out'; item.raw.amount = o; }
      else { item.amount = null; item.dir = 'out'; item.raw.amount = o || n; item.amountBad = (o || n) ? (o || n) : '(空欄)'; }
    } else {
      var a = cell(row, r.amount), pa = TG.parseAmount(a);
      item.raw.amount = a;
      if (pa && pa.ok) { item.amountSigned = pa.value; item.amount = Math.abs(pa.value); item.amountDecorated = pa.decorated; }
      else { item.amount = null; item.amountBad = a || '(空欄)'; }
    }
    if (r.dir >= 0) item.dirText = cell(row, r.dir);
    if (isSummary) { summary.push(item); continue; }
    out.push(item);
  }
  /* 単一の金額列：符号の向き（マイナスが多ければ「マイナス＝支払い」）。指定があればそれに従う */
  var posIsOut = true;
  if (an.mode !== 'split') {
    var neg = 0, nz = 0;
    out.forEach(function (it) { if (typeof it.amountSigned === 'number' && it.amountSigned !== 0) { nz++; if (it.amountSigned < 0) neg++; } });
    posIsOut = opts.posIsOut !== undefined ? opts.posIsOut : !(nz > 0 && neg / nz >= 0.6);
    out.forEach(function (it) {
      if (typeof it.amountSigned === 'number') it.dir = (it.amountSigned >= 0) === posIsOut ? 'out' : 'in';
      else it.dir = 'out';
    });
  }
  /* 入出金の区分の列があれば、それを優先する */
  out.forEach(function (it) {
    if (!it.dirText) return;
    var t = TG.norm(it.dirText);
    if (/(入金|預入|ニュウキン|IN|DEPOSIT|CREDIT)/.test(t)) it.dir = 'in';
    else if (/(出金|引出|支払|シュッキン|OUT|WITHDRAW|DEBIT)/.test(t)) it.dir = 'out';
  });
  /* 年のない日付は、ほかの行で多い年を使う */
  var years = {};
  out.forEach(function (it) { if (it.pd && it.pd.y !== null) years[it.pd.y] = (years[it.pd.y] || 0) + 1; });
  var yh = new Date().getFullYear(), yn = 0;
  Object.keys(years).forEach(function (y) { if (years[y] > yn) { yn = years[y]; yh = +y; } });
  out.forEach(function (it, k) { it.date = TG.dateInfo(it.pd, yh); it.idx = k; });
  return { rows: out, blank: blank, summary: summary, posIsOut: posIsOut };
};

/* ファイル（ArrayBuffer）→ 読み込み結果 */
TG.readStatement = function (buf, name, opts) {
  var dec = TG.decode(buf);
  return TG.readText(dec.text, name, dec.encoding, opts);
};

/* 文字列 → 読み込み結果（保存しておいた明細を読み直すときにも使う） */
TG.readText = function (rawText, name, encoding, opts) {
  var dec = { encoding: encoding };
  var text = String(rawText || '').replace(/^﻿/, '');
  var delim = TG.detectDelim(text);
  var table = TG.parseCSV(text, delim);
  var an = TG.analyzeTable(table);
  if (opts && opts.roles) {
    an.roles = opts.roles; an.mode = (an.roles.out >= 0 || an.roles['in'] >= 0) && an.roles.amount < 0 ? 'split' : 'single'; an.confidence = 'user';
    if (opts.headerIndex !== undefined) { an.headerIndex = opts.headerIndex; an.dataStart = opts.headerIndex + 1; }
  }
  var built = TG.buildRows(table, an, opts || {});
  return { name: name, encoding: dec.encoding, delim: delim, table: table, analysis: an, rows: built.rows, blank: built.blank, summary: built.summary, posIsOut: built.posIsOut };
};

/* ---- 30_profile.js ---- */
/* =========================================================================
 * 30_profile.js  プロフィールの読み取り
 *
 * 4つの欄の文章から「手がかり」を取り出す。手がかりには、理由の中でそのまま
 * 引用できるように、本人が書いた言葉（quote）と欄の名前を必ず持たせる。
 * ========================================================================= */

TG.FIELD_NAME = { job: '副業の内容', tools: '使うもの', places: '作業場所', other: 'その他', answer: '追加の質問' };

TG._compiled = false;
TG.compileDict = function () {
  if (TG._compiled) return;
  TG.TYPES.forEach(function (t) { t.kwc = TG.compileKw(t.kw); });
  TG.TYPE_BY_ID = {}; TG.TYPES.forEach(function (t) { TG.TYPE_BY_ID[t.id] = t; });
  TG.SIGNALS.forEach(function (s) { s.kwc = TG.compileKw(s.kw); });
  TG.SIGNAL_BY_ID = {}; TG.SIGNALS.forEach(function (s) { TG.SIGNAL_BY_ID[s.id] = s; });
  TG.TECH_C = TG.compileKw(TG.TECH_HINTS);
  TG._compiled = true;
};

/* 括弧の外にある区切りだけで分ける */
TG.splitTop = function (s, seps) {
  var out = [], buf = '', depth = 0;
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i);
    if ('（(「『【['.indexOf(c) >= 0) depth++;
    if ('）)」』】]'.indexOf(c) >= 0) depth = Math.max(0, depth - 1);
    if (depth === 0 && seps.indexOf(c) >= 0) { if (buf.trim()) out.push(buf.trim()); buf = ''; continue; }
    buf += c;
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
};

/* 欄の文章 → 引用の単位。
 *   箇条の並び（「ノートPC、文章校正ツール、…」）は1項目ずつ、
 *   文（「取材のため、月1〜2回、都内へ電車で移動する」）は1文ずつ（40字まで）。 */
TG.quoteUnits = function (text) {
  var units = [];
  String(text || '').split(/[。\n\r]+/).forEach(function (sentence) {
    sentence = sentence.replace(/^\s*[【\[]?[^：:】\]]{1,12}[】\]]?\s*[：:]\s*/, function (m) { return /(副業|使う|作業|場所|その他|移動|受け取|道具)/.test(m) ? '' : m; }).trim();
    if (!sentence) return;
    var items = TG.splitTop(sentence, '、,，');
    var prose = /[るたすいだ]$|ます$|です$|ない$/.test(sentence.replace(/[）)」]+$/, ''));
    if (items.length >= 2 && !prose) {
      items.forEach(function (it) { units.push(it); });
    } else if (sentence.length <= 40) {
      units.push(sentence);
    } else {
      items.forEach(function (it) { units.push(it); });
    }
  });
  return units;
};

/* 一覧のカードに出す短い引用（20字まで。長い文は、手がかりの言葉を含む区切りだけ） */
TG.quoteShort = function (unit, word) {
  if (unit.length <= 20) return unit;
  var w = TG.compact(TG.norm(word || ''));
  var parts = String(unit).split(/[、,，（）()]/).map(function (p) { return p.trim(); }).filter(Boolean);
  for (var i = 0; i < parts.length; i++) {
    if (w && TG.compact(TG.norm(parts[i])).indexOf(w) >= 0) return parts[i].length <= 20 ? parts[i] : (word || parts[i].slice(0, 18) + '…');
  }
  return unit.slice(0, 18) + '…';
};

/* 手がかりの言葉のあと、同じ区切りの中に否定があるか */
TG.isNegatedAt = function (unit, k) {
  var sp = TG.norm(unit), idx = -1;
  if (k.subs) { for (var i = 0; i < k.subs.length && idx < 0; i++) idx = sp.indexOf(k.subs[i]); }
  else if (k.re) { var m = k.re.exec(sp); if (m) idx = m.index + m[1].length; }
  else if (k.fn) { var r = k.fn(sp, TG.compact(sp)); idx = (typeof r === 'number') ? r : 0; }
  /* 位置は正規化した文字で探し、否定の判定は正規化前（NFKCだけ）の文字で行う（「は」「ない」がカタカナにならないように）。
   * 正規化は1文字ずつの置き換えなので、位置はそのまま使える */
  var rd = TG.readable(unit);
  var tail = idx >= 0 ? rd.slice(idx) : rd;
  /* 同じ区切りの中だけを見る。「車は、あまり使わない」のように「は」で切れていれば次の区切りまで */
  var seg = tail.split(/[、,，。]/), win = seg[0];
  if (/は$/.test(win) && seg.length > 1) win += seg[1];
  return TG.NEGATION.test(win.replace(/\s/g, ''));
};

/* 「XXから（銀行）振込で受け取る」の XX を受け取り元として取り出す */
TG.extractPayers = function (unit) {
  var out = [];
  if (!/(受け取|受取|振込|振り込|入金|支払われ|もらう|貰う|入る)/.test(unit)) return out;
  var re = /([^\s、。,，「」（）()]+?)から/g, m;
  while ((m = re.exec(unit))) {
    var w = m[1].split(/[はをがにでのとも]/).pop();
    if (w && w.length >= 2 && !/^(月|毎月|年|平日|週末|自宅)$/.test(w)) out.push(w);
  }
  return out;
};

/* プロフィール → 手がかりの一覧と、明細の種類ごとのつながり */
TG.parseProfile = function (profile, answers) {
  TG.compileDict();
  profile = profile || {}; answers = answers || {};
  var sigs = [], payers = [], incomeWords = [];
  ['job', 'tools', 'places', 'other'].forEach(function (f) {
    TG.quoteUnits(profile[f]).forEach(function (unit) {
      var forms = TG.textForms(unit), here = [];
      TG.SIGNALS.forEach(function (s) {
        for (var i = 0; i < s.kwc.length; i++) {
          var k = s.kwc[i];
          if (TG.kwHit(k, forms.spaced, forms.compact) < 0) continue;
          var word = k.label || s.label;
          here.push({ id: s.id, label: s.label, group: s.group, field: f, fieldName: TG.FIELD_NAME[f], quote: unit, short: TG.quoteShort(unit, word), neg: TG.isNegatedAt(unit, k), via: 'text', word: word });
          break;
        }
      });
      /* 同じ言葉から、より具体的な手がかりが取れたときは、大まかな手がかりを外す（「電子書籍」の中の「書籍」など） */
      here = here.filter(function (x) { var def = TG.SIGNAL_BY_ID[x.id]; return !(def.suppressedBy && here.some(function (y) { return def.suppressedBy.indexOf(y.id) >= 0; })); });
      here.forEach(function (x) { sigs.push(x); });
      TG.extractPayers(unit).forEach(function (w) { payers.push({ word: w, quote: unit, field: f, fieldName: TG.FIELD_NAME[f] }); });
      ['報酬', '売上', '原稿料', '謝礼', 'ギャラ'].forEach(function (w) { if (unit.indexOf(w) >= 0) incomeWords.push({ word: w, quote: unit, field: f, fieldName: TG.FIELD_NAME[f] }); });
    });
  });
  /* 追加の質問の答え（本文より優先する） */
  TG.TOPICS.forEach(function (tp) {
    var a = answers[tp.id];
    if (a !== 'yes' && a !== 'no') return;
    var s = TG.SIGNAL_BY_ID[tp.signal];
    sigs = sigs.filter(function (x) { return !(x.id === tp.signal && x.via === 'text'); });
    sigs.push({ id: tp.signal, label: s ? s.label : tp.signal, group: s ? s.group : 'tool', field: 'answer', fieldName: TG.FIELD_NAME.answer, quote: tp.q + '→「' + (a === 'yes' ? tp.yes : tp.no) + '」', q: tp.q, ans: (a === 'yes' ? tp.yes : tp.no), neg: a === 'no', via: 'answer', topic: tp.id, answerTypes: tp.types });
  });
  /* 同じ手がかりは最初のものを使う（肯定があれば肯定を優先） */
  var seen = {}, uniq = [];
  sigs.forEach(function (s) {
    var key = s.id;
    if (seen[key] === undefined) { seen[key] = uniq.length; uniq.push(s); }
    else if (uniq[seen[key]].neg && !s.neg && uniq[seen[key]].via === s.via) uniq[seen[key]] = s;
  });
  sigs = uniq;
  /* 種類ごとのつながり */
  var byType = {};
  var add = function (t, kind, s) { (byType[t] = byType[t] || { direct: [], related: [], neg: [] })[kind].push(s); };
  sigs.forEach(function (s) {
    var def = TG.SIGNAL_BY_ID[s.id] || {};
    var direct = (def.direct || []).slice(), related = (def.related || []).slice();
    if (s.answerTypes) s.answerTypes.forEach(function (t) { if (direct.indexOf(t) < 0) direct.push(t); });
    if (s.neg) { direct.forEach(function (t) { add(t, 'neg', s); }); return; }
    direct.forEach(function (t) { add(t, 'direct', s); });
    related.forEach(function (t) { add(t, 'related', s); });
  });
  /* 受け取り元の照合用の言葉（漢字のほかにカナの読みも） */
  var payerForms = [];
  var addPayer = function (w, src, strength) {
    var forms = [TG.compact(TG.norm(w))];
    var r = TG.readingOf(w); if (r) forms.push(TG.compact(TG.norm(r)));
    forms.forEach(function (f) { if (f.length >= 2 && !payerForms.some(function (p) { return p.form === f; })) payerForms.push({ form: f, word: w, src: src, strength: strength }); });
  };
  payers.forEach(function (p) { addPayer(p.word, p, 'strong'); });
  sigs.forEach(function (s) { var def = TG.SIGNAL_BY_ID[s.id]; if (!s.neg && def && def.payer) def.payer.forEach(function (w) { addPayer(w, s, 'strong'); }); });
  incomeWords.forEach(function (p) { addPayer(p.word, p, 'weak'); });
  var activities = {};
  sigs.forEach(function (s) { var def = TG.SIGNAL_BY_ID[s.id]; if (!s.neg && def && def.activity) activities[def.activity] = s; });
  /* 入金の理由で引用する「受け取り方」：受け取りを書いた文 → 受け取り元のある文 → 販売サービスの記述 の順 */
  var pick = function (ids) { return sigs.filter(function (s) { return ids.indexOf(s.id) >= 0 && !s.neg; })[0]; };
  var receive = pick(['receive']) || (payers[0] ? { quote: payers[0].quote, fieldName: payers[0].fieldName } : null) || pick(['app_store', 'platform']);
  var empty = !['job', 'tools', 'places', 'other'].some(function (f) { return String(profile[f] || '').trim(); });
  return { sigs: sigs, byType: byType, payers: payerForms, activities: activities, receive: receive, empty: empty };
};

/* 明細の種類に対する、プロフィールのつながり（直接 > 否定 > 関係しうる > なし） */
TG.linkOf = function (pp, typeId) {
  var b = pp.byType[typeId];
  if (!b) return { link: 'none', sig: null };
  if (b.direct.length) return { link: 'direct', sig: b.direct[0], all: b.direct };
  if (b.neg.length) return { link: 'neg', sig: b.neg[0], all: b.neg };
  if (b.related.length) return { link: 'related', sig: b.related[0], all: b.related };
  return { link: 'none', sig: null };
};

/* 1の欄の職種に合わせた「タップで追加」の候補 */
TG.chipsFor = function (fieldId, profile) {
  var f = TG.FIELDS.filter(function (x) { return x.id === fieldId; })[0];
  var base = f ? f.chips.slice() : [];
  var job = String((profile && profile.job) || '');
  TG.JOB_HINTS.forEach(function (h) {
    if (!h.m.test(job)) return;
    var extra = h[fieldId === 'tools' ? 'tools' : (fieldId === 'other' ? 'other' : '_')] || [];
    base = extra.concat(base.filter(function (c) { return extra.indexOf(c) < 0; }));
  });
  /* 1の欄は、書いたあとは候補を出さない */
  if (fieldId === 'job' && job.trim()) return [];
  /* すでに書いてある言葉と、すでに読み取れている手がかりになる候補は出さない（「AIアシスト」と書いた人に「AIツール」を出さない） */
  var cur = TG.compact(TG.norm((profile && profile[fieldId]) || ''));
  var have = {}; TG.parseProfile(profile, {}).sigs.forEach(function (s) { have[s.id] = 1; });
  return base.filter(function (c) {
    if (cur.indexOf(TG.compact(TG.norm(c))) >= 0) return false;
    var f = TG.textForms(c), ids = [];
    TG.SIGNALS.forEach(function (s) { if (s.kwc.some(function (k) { return TG.kwHit(k, f.spaced, f.compact) >= 0; })) ids.push(s.id); });
    /* プロフィールの読み取りと同じく、大まかな手がかり（ツール・移動など）は具体的な手がかりがあれば外す */
    ids = ids.filter(function (id) { var d = TG.SIGNAL_BY_ID[id]; return !(d.suppressedBy && ids.some(function (y) { return d.suppressedBy.indexOf(y) >= 0; })); });
    return !ids.length || ids.some(function (id) { return !have[id]; });
  }).slice(0, 8);
};

/* 貼り付けたプロフィール文を4つの欄に分ける（ラベルがあれば） */
TG.splitProfileText = function (text) {
  var res = { job: '', tools: '', places: '', other: '' }, cur = null, found = false;
  var map = [
    { re: /^\s*[【\[]?(副業の内容|副業内容|副業|仕事の内容|内容)[】\]]?\s*[：:]/, f: 'job' },
    { re: /^\s*[【\[]?(使うもの|使う物|使っているもの|道具|ツール|使うサービス)[】\]]?\s*[：:]/, f: 'tools' },
    { re: /^\s*[【\[]?(作業場所|場所|作業する場所|働く場所)[】\]]?\s*[：:]/, f: 'places' },
    { re: /^\s*[【\[]?(その他|そのほか|移動|受け取り|備考)[】\]]?\s*[：:]/, f: 'other' }
  ];
  String(text || '').split(/\r?\n/).forEach(function (line) {
    if (/^\s*【[^】]*プロフィール[^】]*】\s*$/.test(line)) return;
    var hit = null;
    for (var i = 0; i < map.length; i++) { if (map[i].re.test(line)) { hit = map[i]; break; } }
    if (hit) { cur = hit.f; found = true; res[cur] += (res[cur] ? '\n' : '') + line.replace(hit.re, '').trim(); return; }
    if (!line.trim()) return;
    var f = cur || 'job';
    res[f] += (res[f] ? '\n' : '') + line.trim();
  });
  return { fields: res, labeled: found };
};

/* ---- 40_classify.js ---- */
/* =========================================================================
 * 40_classify.js  仕分け（判定表と、表より先に見る決まり）と理由の文
 *
 * 判定の順番（設計指示書 3-4）
 *   0 摘要が空欄 → 要判断
 *   1 自分ルール（前に読み込んだ明細での本人の確定）
 *   2 入金：受け取り元がプロフィールと一致 → 事業候補 ／ 利息・給与 → 私用候補 ／ ほか → 要判断
 *     返金：元の明細と同じ区分（元が見つからなければ要判断）
 *   3 ATM・振込・振替 → 要判断
 *   4 摘要に仕事の言葉（取材用 など）→ プロフィールにその活動があれば事業候補、なければ要判断
 *   5 判定表（種類の性質 × プロフィールとのつながり）
 *   6 金額が大きい「どちらにも使う」明細 → 要判断
 * ========================================================================= */

TG.NATURE_LABEL = { work: '仕事向けの種類', dual: '仕事と生活のどちらにも使う種類', life: '生活でよく使う種類', money: 'お金の動き' };

/* 明細の種類を決める（言葉の重みの合計がいちばん大きいもの。同じ文字列に当たった言葉は1回だけ数える） */
TG.detectType = function (forms, dir, opts) {
  TG.compileDict();
  opts = opts || {};
  var best = null;
  TG.TYPES.forEach(function (t) {
    if (opts.noMoney && t.nature === 'money') return;
    if ((t.id === 'income' || t.id === 'salary' || t.id === 'interest') && dir !== 'in') return;
    if (t.id === 'card_bill' && dir !== 'out') return;
    var got = {}, score = 0, hits = [];
    t.kwc.forEach(function (k) {
      var s = TG.kwMatchStr(k, forms.spaced, forms.compact);
      if (!s) return;
      if (got[s] === undefined) { got[s] = k.w; score += k.w; if (k.label) hits.push(k.label); }
      else if (k.w > got[s]) { score += k.w - got[s]; got[s] = k.w; }
    });
    if (score > 0 && (!best || score > best.score)) best = { type: t, score: score, hits: hits, strs: Object.keys(got).filter(function (x) { return x.indexOf('fn:') !== 0; }) };
  });
  if (best && (best.type.id === 'books' || best.type.id === 'ebooks')) {
    var th = TG.TECH_C.filter(function (k) { return TG.kwHit(k, forms.spaced, forms.compact) >= 0; });
    if (th.length) best = { type: TG.TYPE_BY_ID.tech_books, score: best.score, hits: best.hits.concat(th.map(function (k) { return k.label; })), strs: best.strs.concat(th.map(function (k) { return TG.kwMatchStr(k, forms.spaced, forms.compact); }).filter(function (x) { return x; })), from: best.type };
  }
  return best || { type: null, score: 0, hits: [] };
};

/* プロフィールの言葉の引用（理由の中で使う） */
TG.Q = function (sig) {
  if (!sig) return '';
  if (sig.via === 'answer') return '追加の質問への答え（' + sig.quote + '）';
  return sig.fieldName + '「' + sig.quote + '」';
};
TG.QQ = function (sig) { return sig ? (sig.via === 'answer' ? '追加の質問への答え（' + sig.quote + '）' : '「' + sig.quote + '」') : ''; };
/* 追加の質問の答えか */
TG.isAns = function (sig) { return !!sig && sig.via === 'answer'; };
/* 詳しい理由の中の引用（プロフィールの〜／追加の質問への答え（〜）） */
TG.P = function (sig) { return TG.isAns(sig) ? '追加の質問への答え（' + sig.q + '→「' + sig.ans + '」）' : 'プロフィールの' + TG.Q(sig); };
/* 一覧のカード用の短い引用 */
TG.QS = function (sig) { return sig ? (sig.via === 'answer' ? '追加の質問の答え' : '「' + (sig.short || sig.quote) + '」') : ''; };

/* 明細ごとの下ごしらえ */
TG.prepRow = function (row) {
  var text = (row.raw.desc || '') + ' ' + (row.notesText || '');
  var forms = TG.textForms(text);
  var det = TG.detectType(forms, row.dir);
  var base = (det.type && det.type.nature === 'money') ? TG.detectType(forms, row.dir, { noMoney: true }) : det;
  /* 「デジタル書籍 配信 テクノ書院」のように、本の種類＋技術系の言葉から技術書とみたときは、そう読んだことを名前に残す */
  var lbl = det.from ? '技術書・専門書（' + det.from.label + '）' : null;
  var quoted = [], fromNote = false;
  (det.strs || []).map(function (x) { return TG.compact(TG.norm(x)); }).sort(function (a, b) { return b.length - a.length; }).forEach(function (x) {
    if (quoted.length >= 2 || quoted.some(function (q) { return TG.compact(TG.norm(q)).indexOf(x) >= 0; })) return;
    var o = TG.origSpan(row.raw.desc, x); if (!o && row.notesText) { o = TG.origSpan(row.notesText, x); if (o) fromNote = true; }
    if (o) quoted.push(o);
  });
  /* 摘要の中に出てくる順に並べる */
  var src = (row.raw.desc || '') + ' ' + (row.notesText || '');
  quoted.sort(function (a, b) { return src.indexOf(a) - src.indexOf(b); });
  return { type: det.type, hits: det.hits, quoted: quoted, quotedFromNote: fromNote, base: base.type, lbl: lbl, forms: forms, tokens: TG.shopTokens(row.raw.desc), notes: [], pro: [], con: [] };
};

/* 同じ日・同じ店（空白の違いは無視）・同じ金額 */
TG.markDuplicates = function (rows, res) {
  var groups = {};
  rows.forEach(function (row, i) {
    var key = (row.date ? row.date.iso : row.raw.date) + '|' + TG.compact(TG.norm(row.raw.desc)) + '|' + row.amount + '|' + row.dir;
    (groups[key] = groups[key] || []).push(i);
  });
  Object.keys(groups).forEach(function (k) {
    var g = groups[k];
    if (g.length < 2) return;
    g.forEach(function (i) {
      var others = g.filter(function (j) { return j !== i; }).map(function (j) { return j; });
      var spaceOnly = others.some(function (j) { return rows[j].raw.desc !== rows[i].raw.desc; });
      res[i].dup = others;
      res[i].notes.push({ kind: 'dup', text: '同じ日・同じ店・同じ金額の明細がほかに' + others.length + '件あります' + (spaceOnly ? '（摘要は空白の違いだけ）' : '') + '。2回利用したのか、二重の請求かは、カード会社の明細で確かめられます。どちらの行も消さずに残しています。', short: '重複の可能性' });
    });
  });
};

/* 同じ店・同じ金額の支払いが別の月にもある（月額・年額などの定期的な支払い） */
TG.markRecurring = function (rows, res) {
  var groups = {};
  rows.forEach(function (row, i) {
    var r = res[i];
    if (row.dir !== 'out' || !r.tokens.length || !r.type) return;
    var named = /(月額|年額|月会費|年会費|会費|サブスク|定額|プラン|月払)/.test(row.raw.desc);
    if (r.type.nature === 'life' && !named) return;
    var key = r.type.id + '|' + r.tokens.join('|') + '|' + row.amount;
    (groups[key] = groups[key] || []).push(i);
  });
  Object.keys(groups).forEach(function (k) {
    var g = groups[k];
    if (g.length < 2) return;
    var months = {};
    g.forEach(function (i) { if (rows[i].date) months[rows[i].date.ym] = 1; });
    if (Object.keys(months).length < 2) return;
    g.forEach(function (i) {
      var others = g.filter(function (j) { return j !== i; });
      res[i].recurring = others;
      res[i].notes.push({ kind: 'recurring', text: '同じ店・同じ金額の支払いが ' + others.map(function (j) { return rows[j].date ? rows[j].date.label : rows[j].raw.date; }).join('、') + ' にもあります（定期的な支払いのようです）。', short: '定期的な支払い' });
    });
  });
};

/* 自分ルール：前に読み込んだ明細（今の明細以外）での本人の確定 */
TG.ruleMatch = function (r, ctx) {
  if (!ctx || !ctx.rules || !ctx.rules.length || !r.tokens.length) return null;
  var typeId = r.base ? r.base.id : (r.type ? r.type.id : '');
  var hits = ctx.rules.filter(function (e) { return e.datasetId !== ctx.datasetId && e.tokens && TG.sameShop(e.tokens, r.tokens, e.type === typeId); });
  if (!hits.length) return null;
  hits.sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
  return { biz: hits.filter(function (e) { return e.final === 'biz'; }), pvt: hits.filter(function (e) { return e.final === 'pvt'; }), last: hits[0] };
};

/* 「摘要の「ﾔﾁﾝ」から」のように、摘要（元の表記）のどの言葉から種類を読んだかを書く */
TG.readFrom = function (r) { return r.quoted && r.quoted.length ? (r.quotedFromNote ? '摘要・備考の' : '摘要の') + r.quoted.map(function (q) { return '「' + q + '」'; }).join('') + 'から' : '摘要から'; };
TG.set = function (r, cat, rule, short, long) { r.cat = cat; r.rule = rule; r.short = short; r.long = long; };

/* 1件の仕分け（返金の元を探す必要があるものは second=true のときに決める） */
TG.decide = function (row, r, pp, ctx, rows, res, second) {
  var t = r.type, desc = row.raw.desc || '';
  if (!String(desc).trim()) { TG.set(r, 'ask', 'empty', '摘要が空欄です', '摘要が空欄のため、どんな支払いかを読み取れませんでした。確認をお願いします。'); return true; }

  var isRefund = t && t.id === 'refund';
  var inMerchant = row.dir === 'in' && (!t || t.nature !== 'money');
  if ((isRefund || inMerchant) && !second) return false;

  /* 1 自分ルール（返金は、まず同じ明細の中の元の支払いにそろえる） */
  var rm = (isRefund || inMerchant) ? null : TG.ruleMatch(r, ctx);
  if (rm) {
    var e = rm.last, where = (e.file ? e.file + '・' : '') + (e.dateLabel || '');
    if (rm.biz.length && rm.pvt.length) {
      TG.set(r, 'ask', 'rule-mixed', '前回、同じ店を事業・私用の両方で確定しています', '前に読み込んだ明細で、同じ店とみられる明細をあなたが「事業」' + rm.biz.length + '件・「私用」' + rm.pvt.length + '件で確定しています。今回はどちらか確認をお願いします。');
      r.pro.push('前回「事業」で確定：' + rm.biz.length + '件'); r.con.push('前回「私用」で確定：' + rm.pvt.length + '件');
    } else {
      var fin = rm.biz.length ? 'biz' : 'pvt';
      TG.set(r, fin, 'rule', '前回、あなたが「' + TG.CAT[fin].final + '」と確定した店です', '前に読み込んだ明細（' + where + '「' + e.desc + '」）で、あなたが「' + TG.CAT[fin].final + '」と確定しています。同じ店とみられるため、' + TG.CAT[fin].label + 'にしました。');
      (fin === 'biz' ? r.pro : r.con).push('前回の確定：' + where + '「' + e.desc + '」→' + TG.CAT[fin].final);
    }
    return true;
  }

  /* 2 入金・返金 */
  if (row.dir === 'in' || isRefund) {
    var compactDesc = r.forms.compact;
    var strong = pp.payers.filter(function (p) { return p.strength === 'strong' && p.form.length >= 3 && compactDesc.indexOf(p.form) >= 0; })[0];
    if (row.dir === 'in' && strong && !isRefund) {
      TG.set(r, 'biz', 'income-match', '受け取り元「' + strong.word + '」がプロフィールと一致', '入金です。プロフィールの' + TG.Q(strong.src) + 'にある受け取り元「' + strong.word + '」が、摘要の「' + (TG.origSpan(row.raw.desc, strong.form) || strong.word) + '」と一致したため、事業候補にしました。');
      r.pro.push('受け取り元の一致：' + TG.QQ(strong.src)); r.paySig = strong.src; return true;
    }
    if (t && t.id === 'interest') { TG.set(r, 'pvt', 'interest', '預金の利息の入金のようです', '預金の利息の入金のようです。プロフィールに関係する記述はないため、私用候補にしました。'); r.con.push('預金の利息'); return true; }
    if (t && t.id === 'salary') { TG.set(r, 'pvt', 'salary', '給与の入金のようです', '給与の入金のようです。副業の受け取りとは別のものとして、私用候補にしました。副業の受け取りであれば「事業」で確定してください。'); r.con.push('給与の入金'); return true; }
    if (isRefund || inMerchant) {
      var orig = TG.findOriginal(row, r, rows, res);
      if (orig >= 0) {
        var o = rows[orig], or = res[orig];
        r.refOf = orig; or.refundedBy = (or.refundedBy || []).concat([row.idx]);
        or.notes.push({ kind: 'refunded', text: (row.date ? row.date.label : row.raw.date) + 'に ' + TG.yen(row.amount) + '円の返金があります。', short: '返金あり' });
        var ol = o.date ? o.date.label : o.raw.date;
        TG.set(r, or.cat, 'refund', ol + '「' + o.raw.desc + '」の返金のようです', ol + 'の「' + o.raw.desc + '」（' + TG.yen(o.amount) + '円）と同じ店の' + (isRefund ? '返金' : '入金（マイナスの金額）') + 'のようです。元の明細と同じ「' + TG.CAT[or.cat].label + '」にしています。確定するときは、元の明細と同じ区分にそろえると整理が分かりやすくなります。');
        r.pro = or.pro.slice(); r.con = or.con.slice();
        return true;
      }
      if (isRefund) {
        var rm2 = TG.ruleMatch(r, ctx);
        if (rm2 && !(rm2.biz.length && rm2.pvt.length)) {
          var f2 = rm2.biz.length ? 'biz' : 'pvt';
          TG.set(r, f2, 'rule', '返金：前回「' + TG.CAT[f2].final + '」と確定した店です', '返金・取消のようです。元の支払いはこの明細にありませんが、前に読み込んだ明細で同じ店をあなたが「' + TG.CAT[f2].final + '」と確定しているため、' + TG.CAT[f2].label + 'にしました。');
          return true;
        }
        TG.set(r, 'ask', 'refund-orphan', '返金のようですが、元の支払いが見つかりません', '返金・取消のようですが、元の支払いがこの明細の中に見つかりませんでした。どの支払いの返金かを確認してください。');
        return true;
      }
    }
    if (row.dir === 'in') {
      var weak = pp.payers.filter(function (p) { return p.strength === 'weak' && compactDesc.indexOf(p.form) >= 0; })[0];
      if (weak) {
        TG.set(r, 'ask', 'income-partial', '受け取りの言葉は一致、受け取り元は一致しません', '入金です。摘要の「' + (TG.origSpan(row.raw.desc, weak.form) || weak.word) + '」がプロフィールの' + TG.Q(weak.src) + 'と言葉は一致しますが、受け取り元が一致しないため、心当たりを確認してください。');
        r.pro.push('受け取りの言葉の一致：「' + weak.word + '」'); r.con.push('受け取り元が一致しない'); return true;
      }
      if (pp.receive) {
        TG.set(r, 'ask', 'income-unmatched', '入金です。プロフィールの受け取り方と一致しません', '入金です。プロフィールの受け取り方（' + TG.QQ(pp.receive) + '）とは一致しないため、心当たりを確認してください。');
        r.con.push('プロフィールの受け取り方と一致しない');
      } else {
        TG.set(r, 'ask', 'income-unknown', '入金です。受け取り方の記述がありません', '入金です。プロフィールに、お金の受け取り方の記述がないため、どの入金かを確認してください。');
      }
      return true;
    }
  }

  /* 3 ATM・振込・振替 */
  if (t && t.id === 'atm') { TG.set(r, 'ask', 'atm', '現金の引き出しです（使い道は明細から分かりません）', '現金の引き出しです。使い道は明細からは分からないため、確認をお願いします。'); return true; }
  if (t && t.id === 'transfer') { TG.set(r, 'ask', 'transfer', '振込・振替です（相手や目的は明細から分かりません）', '振込・振替です。相手や目的は明細からは分からないため、確認をお願いします。'); return true; }
  if (t && t.id === 'card_bill') { TG.set(r, 'ask', 'card_bill', 'カードの引き落としのようです（中身はカードの明細にあります）', 'クレジットカードの利用代金の引き落としのようです。中身の支払いはカードの明細に1件ずつ載っているため、カードの明細も読み込む場合は、どちらで整理するかを決めておくと二重に数えずに済みます。'); return true; }
  if (t && t.nature === 'money') { TG.set(r, 'ask', 'money', t.label + 'です', t.label + 'のようです。確認をお願いします。'); return true; }

  /* 4 判定表 → 5 摘要の仕事の言葉（区分を「上げる」方向にだけ使い、事業候補を要判断に下げない） */
  TG.decideTable(row, r, pp, desc);
  TG.applyWorkWord(r, pp);
  return true;
};

/* 摘要・備考の「仕事の言葉」（取材用・打ち合わせ など） */
TG.applyWorkWord = function (r, pp) {
  var ww = TG.workWord(r);
  if (!ww) return;
  var act = ww.activity ? pp.activities[ww.activity] : null;
  if (r.cat === 'biz') { r.pro.push('摘要・備考の「' + ww.w + '」'); return; }
  if (act) {
    TG.set(r, 'biz', 'work-word', '摘要に「' + ww.w + '」、プロフィールに' + TG.QS(act), '摘要・備考に「' + ww.w + '」という仕事の言葉があり、プロフィールの' + TG.Q(act) + 'にも関係するため、事業候補にしました。');
    r.pro.unshift(TG.P(act)); r.pro.unshift('摘要・備考の「' + ww.w + '」'); r.actSig = act;
    return;
  }
  TG.set(r, 'ask', 'work-word-only', '摘要に「' + ww.w + '」とありますが、プロフィールに記述なし', '摘要・備考に「' + ww.w + '」という仕事の言葉がありますが、プロフィールに関係する記述がないため、確認をお願いします。');
  r.pro.unshift('摘要・備考の「' + ww.w + '」');
  if (r.con.indexOf('プロフィールに関係する記述がない') < 0) r.con.push('プロフィールに関係する記述がない');
};

/* 判定表（種類の性質 × プロフィールとのつながり） */
TG.decideTable = function (row, r, pp, desc) {
  var t = r.type;
  if (!t) { TG.set(r, 'ask', 'unknown', '店名から種類を読み取れませんでした', '摘要「' + desc + '」から、どんな支払いかを読み取れませんでした。確認をお願いします。'); return true; }
  var L = TG.linkOf(pp, t.id), lbl = r.lbl || t.label, n = t.nature, s = L.sig;
  r.link = L.link; r.linkSig = s;
  if (L.link === 'neg') {
    TG.set(r, 'pvt', 'neg', TG.isAns(s) ? '追加の質問で「' + s.ans + '」と回答しています' : TG.QS(s) + 'とあります', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。プロフィールの' + TG.Q(s) + 'から、仕事では使わないものとして私用候補にしました。');
    r.con.push(TG.P(s)); return true;
  }
  if (n === 'work') {
    if (L.link === 'direct') {
      TG.set(r, 'biz', 'table', TG.isAns(s) ? '追加の質問で「' + s.ans + '」と回答' : TG.QS(s) + '（' + s.fieldName + '）と一致しました', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。プロフィールの' + TG.Q(s) + 'と一致するため、事業候補にしました。');
      r.pro.push(TG.P(s)); r.pro.push(TG.NATURE_LABEL.work + '：' + lbl);
    } else if (L.link === 'related') {
      TG.set(r, 'ask', 'table', TG.QS(s) + 'に関係しそうですが、記述はありません', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。仕事でよく使われる種類で、プロフィールの' + TG.Q(s) + 'に関係する可能性がありますが、' + t.label + 'そのものの記述はないため、確認をお願いします。');
      r.pro.push(TG.NATURE_LABEL.work + '：' + lbl); r.pro.push('関係しそうな記述：' + TG.Q(s)); r.con.push('プロフィールに' + t.label + 'の記述がない');
    } else {
      TG.set(r, 'ask', 'table', '仕事向けの種類ですが、プロフィールに記述がありません', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。仕事でよく使われる種類ですが、プロフィールに関係する記述がないため、確認をお願いします。');
      r.pro.push(TG.NATURE_LABEL.work + '：' + lbl); r.con.push('プロフィールに関係する記述がない');
    }
    return true;
  }
  if (n === 'dual') {
    if (L.link === 'direct') {
      TG.set(r, 'ask', 'table', TG.isAns(s) ? '追加の質問で「' + s.ans + '」と回答。私用の場合もあります' : TG.QS(s) + 'がありますが、私用の場合もあります', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。仕事と生活のどちらにも使われる種類です。プロフィールの' + TG.Q(s) + 'に当たりますが、この明細がどちらかは明細からは分かりません。');
      r.pro.push(TG.P(s)); r.con.push(TG.NATURE_LABEL.dual + '：' + lbl);
    } else if (L.link === 'related') {
      TG.set(r, 'ask', 'table', TG.QS(s) + 'に関係する可能性があります', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。仕事と生活のどちらにも使われる種類で、プロフィールの' + TG.Q(s) + 'に関係する可能性があります。どちらかは明細からは分かりません。');
      r.pro.push('関係しそうな記述：' + TG.Q(s)); r.con.push(TG.NATURE_LABEL.dual + '：' + lbl);
    } else if (row.amount !== null && row.amount >= TG.LARGE_AMOUNT) {
      TG.set(r, 'ask', 'large', '金額が大きいため、念のため確認に回しました', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。プロフィールに関係する記述はありませんが、金額が' + TG.yen(row.amount) + '円と大きく、仕分けを間違えたときの影響が大きいため、確認に回しました。');
      r.con.push('プロフィールに関係する記述がない'); r.pro.push('金額が大きい（' + TG.yen(row.amount) + '円）');
    } else {
      TG.set(r, 'pvt', 'table', 'プロフィールに関係する記述がありません', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。仕事と生活のどちらにも使われる種類ですが、プロフィールに関係する記述がないため、私用候補にしました。仕事で使ったものは「事業」で確定してください。');
      r.con.push('プロフィールに関係する記述がない');
    }
    return true;
  }
  /* 生活 */
  if (L.link === 'direct') {
    TG.set(r, 'ask', 'table', TG.isAns(s) ? '追加の質問で「' + s.ans + '」と回答。仕事の可能性もあります' : TG.QS(s) + 'があるため、仕事の可能性もあります', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。ふだんは生活で使う種類ですが、プロフィールの' + TG.Q(s) + 'があるため、仕事の可能性もあります。確認をお願いします。');
    r.pro.push(TG.P(s)); r.con.push(TG.NATURE_LABEL.life + '：' + lbl);
  } else if (L.link === 'related') {
    TG.set(r, 'pvt', 'table', '生活でよく使う種類です', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。生活でよく使う種類で、プロフィールの' + TG.Q(s) + 'とのつながりは弱いため、私用候補にしました。');
    r.con.push(TG.NATURE_LABEL.life + '：' + lbl); r.pro.push('つながりの弱い記述：' + TG.Q(s));
  } else {
    TG.set(r, 'pvt', 'table', '生活でよく使う種類です（プロフィールに記述なし）', TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。生活でよく使う種類で、プロフィールに関係する記述はないため、私用候補にしました。');
    r.con.push(TG.NATURE_LABEL.life + '：' + lbl); r.con.push('プロフィールに関係する記述がない');
  }
  return true;
};

TG._ww = null;
TG.workWord = function (r) {
  if (!TG._ww) TG._ww = TG.WORK_WORDS.map(function (x) { return { w: x.w, activity: x.activity, c: TG.compact(TG.norm(x.w)) }; });
  var c = r.forms.compact;
  for (var i = 0; i < TG.WORK_WORD_EXCLUDE.length; i++) if (c.indexOf(TG.compact(TG.norm(TG.WORK_WORD_EXCLUDE[i]))) >= 0) return null;
  for (var j = 0; j < TG._ww.length; j++) if (c.indexOf(TG._ww[j].c) >= 0) return TG._ww[j];
  return null;
};

/* 返金の元：逆向きの明細で、同じ店。同じ金額・日付が前のものを優先する */
TG.findOriginal = function (row, r, rows, res) {
  var want = row.dir === 'in' ? 'out' : 'in', best = -1, bestScore = -1;
  rows.forEach(function (o, j) {
    if (j === row.idx || o.dir !== want || !res[j] || res[j].cat === undefined) return;
    if (res[j].type && res[j].type.id === 'refund') return;
    if (!TG.sameShop(res[j].tokens, r.tokens, true)) return;
    var sc = 1;
    if (o.amount === row.amount) sc += 4;
    if (o.date && row.date && o.date.iso <= row.date.iso) sc += 2;
    if (sc > bestScore) { bestScore = sc; best = j; }
  });
  return best;
};

/* 要判断の確認で出す質問 */
TG.questionFor = function (row, r) {
  var id = r.type ? r.type.id : 'unknown';
  if (r.rule === 'refund' || r.rule === 'refund-orphan') id = 'refund';
  var q = TG.REVIEW_Q[id];
  if (!q) q = (r.type && r.type.nature === 'work') ? TG.REVIEW_Q._work : TG.REVIEW_Q._life;
  return q.replace('{type}', r.type ? r.type.label : '支払い').replace('{date}', row.date ? row.date.label : '');
};

/* 全件の仕分け */
TG.classifyAll = function (rows, pp, ctx) {
  TG.compileDict();
  ctx = ctx || {};
  var res = rows.map(function (row) { return TG.prepRow(row); });
  TG.markDuplicates(rows, res);
  TG.markRecurring(rows, res);
  rows.forEach(function (row, i) { TG.decide(row, res[i], pp, ctx, rows, res, false); });
  rows.forEach(function (row, i) { if (res[i].cat === undefined) TG.decide(row, res[i], pp, ctx, rows, res, true); });
  rows.forEach(function (row, i) {
    var r = res[i];
    r.question = TG.questionFor(row, r);
    /* 理由に使ったプロフィールの手がかり（一覧で、手がかりから明細をたどるため） */
    var used = r.rule === 'work-word' ? r.actSig : (r.rule === 'income-match' ? r.paySig : r.linkSig);
    r.sigIds = used ? [used.id || 'receive'] : [];
    r.typeLabel = r.type ? (r.type.id === 'refund' && r.base ? r.base.label + 'の返金' : (r.lbl || r.type.label)) : '種類不明';
    if (row.amountBad !== undefined) r.notes.push({ kind: 'parse', text: '金額「' + row.amountBad + '」を読み取れませんでした（書き出しは元のまま）。', short: '金額を読めません' });
    else if (row.amountDecorated) r.notes.push({ kind: 'format', text: '金額は「' + row.raw.amount + '」と書かれています（' + TG.yen(row.amount) + '円として読み取り、書き出しは元のまま）。', short: '' });
    if (!row.date) r.notes.push({ kind: 'parse', text: '日付「' + row.raw.date + '」を読み取れませんでした（書き出しは元のまま）。', short: '日付を読めません' });
    else if (row.date.assumedYear) r.notes.push({ kind: 'format', text: '日付に年がないため、' + row.date.y + '年として表示しています（書き出しは元のまま）。', short: '' });
  });
  return res;
};

/* -------------------------------------------------------------------------
 * 明細を読んだあとの「追加の質問」
 *   明細にある種類のうち、プロフィールで答えが出ておらず、
 *   答え次第で区分が変わる明細があるものだけを、影響の大きい順に出す
 * ------------------------------------------------------------------------- */
TG.topicQuestions = function (rows, res, profile, answers, ctx, skipped) {
  answers = answers || {}; skipped = skipped || {};
  var out = [], pp = TG.parseProfile(profile, answers);
  TG.TOPICS.forEach(function (tp) {
    if (answers[tp.id] || skipped[tp.id]) return;
    /* プロフィールに答えがすでにあるもの（その手がかりがある・その種類に直接つながる記述がある）は聞かない */
    if (pp.sigs.some(function (s) { return s.id === tp.signal; })) return;
    if (tp.types.some(function (t) { var b = pp.byType[t]; return b && (b.direct.length || b.neg.length); })) return;
    var idx = [];
    rows.forEach(function (row, i) {
      var r = res[i];
      if (!r.type || tp.types.indexOf(r.type.id) < 0) return;
      if (r.rule !== 'table' && r.rule !== 'large' && r.rule !== 'neg') return;
      if (r.link === 'direct' || r.link === 'neg') return;
      idx.push(i);
    });
    if (!idx.length) return;
    var sub = idx.map(function (i) { return rows[i]; });
    var yes = {}, no = {};
    Object.keys(answers).forEach(function (k) { yes[k] = answers[k]; no[k] = answers[k]; });
    yes[tp.id] = 'yes'; no[tp.id] = 'no';
    var ry = TG.classifyAll(sub.map(function (x, k) { var c = Object.assign({}, x); c.idx = k; return c; }), TG.parseProfile(profile, yes), ctx);
    var rn = TG.classifyAll(sub.map(function (x, k) { var c = Object.assign({}, x); c.idx = k; return c; }), TG.parseProfile(profile, no), ctx);
    var changed = [], ifYes = [], ifNo = [], yesTo = {}, noTo = {};
    idx.forEach(function (i, k) {
      var cur = res[i].cat;
      if (ry[k].cat !== cur) { ifYes.push(i); yesTo[ry[k].cat] = (yesTo[ry[k].cat] || 0) + 1; }
      if (rn[k].cat !== cur) { ifNo.push(i); noTo[rn[k].cat] = (noTo[rn[k].cat] || 0) + 1; }
      if (ry[k].cat !== cur || rn[k].cat !== cur) changed.push(i);
    });
    if (!changed.length) return;
    var amount = 0; changed.forEach(function (i) { amount += rows[i].amount || 0; });
    out.push({ topic: tp, rows: idx, changed: changed, ifYes: ifYes, ifNo: ifNo, yesTo: yesTo, noTo: noTo, amount: amount, examples: idx.slice(0, 3).map(function (i) { return rows[i].raw.desc; }) });
  });
  out.sort(function (a, b) { return (b.amount - a.amount) || (b.changed.length - a.changed.length); });
  return out.slice(0, TG.MAX_TOPIC_QUESTIONS);
};

/* 区分ごとの件数・確定の件数 */
TG.tally = function (rows, res, decisions) {
  var t = { biz: { n: 0, done: 0, sum: 0 }, ask: { n: 0, done: 0, sum: 0 }, pvt: { n: 0, done: 0, sum: 0 }, all: rows.length, done: 0, finalBiz: 0, finalPvt: 0 };
  rows.forEach(function (row, i) {
    var c = res[i].cat, d = decisions[row.key];
    t[c].n++; t[c].sum += row.amount || 0;
    if (d && d.final) { t[c].done++; t.done++; if (d.final === 'biz') t.finalBiz++; else t.finalPvt++; }
  });
  return t;
};

/* ---- 50_export.js ---- */
/* =========================================================================
 * 50_export.js  CSVの書き出しと、書き出す前の照合
 *
 * 列：日付,摘要,金額,ツール仕分け,最終区分,理由
 * 日付・摘要・金額は、読み込んだセルの文字列をそのまま書く。
 * 書き出す前に、作ったCSVを自分のパーサーで読み直して、入力と1行ずつ照合する。
 * ========================================================================= */

TG.CSV_HEADER = ['日付', '摘要', '金額', 'ツール仕分け', '最終区分', '理由'];

TG.csvCell = function (s) {
  s = String(s === null || s === undefined ? '' : s);
  return (/[",\r\n]/.test(s) || /^\s|\s$/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s;
};

/* 禁止表現を探す（必須表示の文言は除く）。見つかった言葉の一覧を返す */
TG.findBanned = function (text) {
  var t = String(text || '').split(TG.DISCLAIMER).join('');
  return TG.BANNED.filter(function (w) { return t.indexOf(w) >= 0; });
};

/* 「理由」の列：ツールの理由 ＋ 注意 ＋ 本人の確定（とメモ） */
TG.reasonForCsv = function (row, r, d, withMemo) {
  var parts = [r.long];
  var notes = r.notes.filter(function (n) { return n.kind === 'dup' || n.kind === 'refunded' || n.kind === 'parse'; }).map(function (n) { return n.text; });
  if (notes.length) parts.push('注意：' + notes.join(''));
  if (d && d.final) {
    var changed = (r.cat === 'biz' && d.final === 'pvt') || (r.cat === 'pvt' && d.final === 'biz');
    parts.push('確定：本人が「' + TG.CAT[d.final].final + '」に確定' + (r.cat === 'ask' ? '（要判断を確認）' : (changed ? '（ツールの候補から変更）' : '')) + '。');
    if (d.memo && withMemo !== false) parts.push('本人メモ：' + d.memo);
  }
  return parts.join(' ');
};

TG.buildCsv = function (rows, res, decisions, opts) {
  opts = opts || {};
  var lines = [TG.CSV_HEADER.join(',')];
  rows.forEach(function (row, i) {
    var r = res[i], d = decisions[row.key];
    lines.push([row.raw.date, row.raw.desc, row.raw.amount, TG.CAT[r.cat].label, (d && d.final) ? TG.CAT[d.final].final : '', TG.reasonForCsv(row, r, d, opts.memo)].map(TG.csvCell).join(','));
  });
  return (opts.bom === false ? '' : '﻿') + lines.join('\r\n') + '\r\n';
};

/* 書き出す前の照合 */
TG.verifyCsv = function (csvText, rows, res, decisions) {
  var problems = [];
  var table = TG.parseCSV(csvText.replace(/^﻿/, ''), ',');
  var head = table[0] || [];
  if (head.join(',') !== TG.CSV_HEADER.join(',')) problems.push('見出しの行が「' + TG.CSV_HEADER.join('／') + '」になっていません。');
  var body = table.slice(1);
  if (body.length !== rows.length) problems.push('行数が一致しません（読み込み ' + rows.length + ' 行／書き出し ' + body.length + ' 行）。');
  var finals = { '事業': 1, '私用': 1 }, tools = { '事業候補': 1, '私用候補': 1, '要判断': 1 };
  rows.forEach(function (row, i) {
    var b = body[i];
    if (!b) return;
    var at = (i + 1) + '行目';
    if (b.length !== 6) problems.push(at + '：列の数が6ではありません。');
    if (b[0] !== row.raw.date) problems.push(at + '：日付が元と一致しません。');
    if (b[1] !== row.raw.desc) problems.push(at + '：摘要が元と一致しません。');
    if (b[2] !== row.raw.amount) problems.push(at + '：金額が元と一致しません。');
    if (!tools[b[3]]) problems.push(at + '：ツール仕分けが3区分のどれでもありません。');
    if (!finals[b[4]]) problems.push(at + '：最終区分が確定していません。');
    if (!b[5]) problems.push(at + '：理由が空です。');
  });
  /* 禁止表現の検査は、ツールが作った文だけを対象にする（本人メモは本人の言葉なので除く） */
  var toolText = rows.map(function (row, i) { return TG.reasonForCsv(row, res[i], decisions[row.key], false) + ' ' + TG.CAT[res[i].cat].label; }).join('\n');
  var banned = TG.findBanned(toolText);
  if (banned.length) problems.push('ツールの文に使わない言葉が含まれています：' + banned.join('、'));
  return { ok: problems.length === 0, problems: problems, rowsOut: body.length, rowsIn: rows.length };
};

/* 出力ファイル名：元のファイル名_仕分け結果.csv */
TG.outName = function (name) {
  var base = String(name || '明細').replace(/\.(csv|txt|tsv)$/i, '');
  return base + '_仕分け結果.csv';
};

/* =========================================================================
 * 60_store.js  状態・保存（この端末のブラウザの localStorage だけ）・自分ルール
 * ========================================================================= */

TG.KEY = 'tegakari-shiwake.v1';
TG.defaultState = function () {
  return {
    v: 1,
    profile: { job: '', tools: '', places: '', other: '' },
    answers: {}, skipTopics: {},
    ds: null,          /* 読み込んだ明細 { id, name, encoding, text, opts, includeSummary, loadedAt } */
    dec: {},           /* 本人の確定 { 行のキー: { final: 'biz'|'pvt', memo, at, via } } */
    rules: [],         /* 自分ルール（確定した店の記録） */
    useRules: true,
    view: 'profile', lane: 'ask', bom: true,
    exported: null
  };
};
TG.load = function () {
  try {
    var t = window.localStorage.getItem(TG.KEY);
    if (t) {
      var s = JSON.parse(t);
      if (s && s.v === 1) { var d = TG.defaultState(); Object.keys(s).forEach(function (k) { d[k] = s[k]; }); return d; }
    }
  } catch (e) { TG.storageError = true; }
  return TG.defaultState();
};
TG._saveTimer = null;
TG.save = function (now) {
  var run = function () { try { window.localStorage.setItem(TG.KEY, JSON.stringify(TG.S)); TG.storageError = false; } catch (e) { TG.storageError = true; } };
  clearTimeout(TG._saveTimer);
  if (now) run(); else TG._saveTimer = setTimeout(run, 250);
};
TG.clearAll = function () {
  try { window.localStorage.removeItem(TG.KEY); } catch (e) { /* 消せなくても画面の状態は初期化する */ }
  TG.S = TG.defaultState(); TG.D = {};
};

/* 状態から、読み込み結果・仕分け・質問・件数を作り直す（仕分けは保存せず、毎回同じ規則で作る） */
TG.recompute = function () {
  var S = TG.S, D = TG.D = TG.D || {};
  D.pp = TG.parseProfile(S.profile, S.answers);
  if (!S.ds) { D.st = null; D.rows = []; D.res = []; D.topics = []; D.tally = TG.tally([], [], {}); return D; }
  var stKey = S.ds.id + '|' + JSON.stringify(S.ds.opts || {});
  if (!D.st || D.stKey !== stKey) { D.st = TG.readText(S.ds.text, S.ds.name, S.ds.encoding, S.ds.opts || {}); D.stKey = stKey; }
  var rows = D.st.rows.slice();
  if (S.ds.includeSummary && D.st.summary.length) rows = rows.concat(D.st.summary).sort(function (a, b) { return a.line - b.line; });
  rows.forEach(function (r, i) { r.key = 'r' + r.line; r.idx = i; });
  D.rows = rows;
  var ctx = { datasetId: S.ds.id, rules: S.useRules ? S.rules : [] };
  D.res = TG.classifyAll(rows, D.pp, ctx);
  D.topics = TG.topicQuestions(rows, D.res, S.profile, S.answers, ctx, S.skipTopics);
  D.byKey = {}; rows.forEach(function (r, i) { D.byKey[r.key] = i; });
  D.tally = TG.tally(rows, D.res, S.dec);
  return D;
};

/* 本人の確定（final が null なら未確認に戻す）。自分ルールにも記録する */
TG.decideRow = function (key, final, memo, via) {
  var S = TG.S, prev = S.dec[key];
  if (!final) { delete S.dec[key]; TG.ruleRemove(key); return; }
  S.dec[key] = { final: final, memo: (memo !== undefined && memo !== null) ? memo : ((prev && prev.memo) || ''), at: Date.now(), via: via || 'card' };
  TG.ruleUpsert(key, final);
};
TG.ruleUpsert = function (key, final) {
  var S = TG.S, D = TG.D, i = D.byKey[key];
  if (i === undefined) return;
  var row = D.rows[i], r = D.res[i];
  S.rules = S.rules.filter(function (x) { return !(x.datasetId === S.ds.id && x.key === key); });
  if (!r.tokens || !r.tokens.length) return;
  S.rules.push({ datasetId: S.ds.id, key: key, tokens: r.tokens, type: r.base ? r.base.id : (r.type ? r.type.id : ''), final: final, desc: row.raw.desc, dateLabel: row.date ? row.date.label : row.raw.date, file: S.ds.name, at: Date.now() });
  if (S.rules.length > 5000) S.rules = S.rules.slice(-5000);
};
TG.ruleRemove = function (key) {
  var S = TG.S;
  if (!S.ds) return;
  S.rules = S.rules.filter(function (x) { return !(x.datasetId === S.ds.id && x.key === key); });
};
/* 自分ルールを店ごとにまとめる（一覧の表示用） */
TG.ruleGroups = function () {
  var g = {};
  (TG.S.rules || []).forEach(function (e) {
    var k = (e.tokens && e.tokens[0]) || e.desc;
    var x = g[k] || (g[k] = { key: k, items: [], biz: 0, pvt: 0, files: {} });
    x.items.push(e); x[e.final]++; x.files[e.file] = 1;
  });
  return Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return b.items.length - a.items.length; });
};

/* 同じ明細の中で、同じ店とみられる行（思い出す手がかり・まとめて確定に使う） */
TG.sameShopRows = function (i) {
  var D = TG.D, r = D.res[i], out = [];
  if (!r.tokens || !r.tokens.length) return out;
  var t = r.base ? r.base.id : (r.type ? r.type.id : '');
  D.rows.forEach(function (row, j) {
    if (j === i) return;
    var rj = D.res[j], tj = rj.base ? rj.base.id : (rj.type ? rj.type.id : '');
    if (TG.sameShop(rj.tokens, r.tokens, tj === t)) out.push(j);
  });
  return out;
};

  function handleFile(file) {

          TG.lastError = '「' + file.name + '」から明細の行が見つかりませんでした（' + (st.table.length ? st.table.length + '行を読みましたが、日付・摘要・金額のそろった行がありません' : '中身が空です') + '）。CSVかどうか、中身を確かめてください。';

    var prev = keys.map(function (k) { return { key: k, d: S.dec[k] ? JSON.parse(JSON.stringify(S.dec[k])) : null }; });
    keys.forEach(function (k, n) { TG.decideRow(k, final, n === 0 ? memo : ((S.dec[k] && S.dec[k].memo) || ''), n === 0 ? (R.mode === 'queue' ? 'review' : 'card') : 'same-shop'); });
