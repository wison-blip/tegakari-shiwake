/* 読み込んだ結果を、仕分けの前に確かめる（止めるときは理由の文を返す） */
TG.checkStatement = function (st, name) {
  var n = st.rows.length;
  if (!n) return '「' + name + '」から明細の行が見つかりませんでした（' + (st.table.length ? st.table.length + '行を読みましたが、日付・摘要・金額のそろった行がありません' : '中身が空です') + '）。明細のCSVかどうか、中身を確かめてください。';
  var bad = 0;
  st.rows.forEach(function (r) { if (!r.date && r.amount === null) bad++; });
  if (bad * 2 > n) return '「' + name + '」は、日付と金額をどちらも読み取れない行が大半です（' + TG.yen(n) + '行のうち' + TG.yen(bad) + '行）。明細のCSVではない可能性が高いため、読み込みを止めました。カード会社・銀行のWebサイトからダウンロードした明細のCSVか、確かめてください。';
  if (n > TG.MAX_ROWS) return '明細の行が多すぎます（' + TG.yen(n) + '行）。一度に読み込めるのは ' + TG.yen(TG.MAX_ROWS) + '行までです。期間を分けてダウンロードし、1つずつ読み込んでください。';
  return null;
};

/* ---- 30_profile.js ---- */
/* =========================================================================
 * 30_profile.js  プロフィールの読み取り
 *
 * 4つの欄の文章から「手がかり」を取り出す。手がかりには、理由の中でそのまま
 * 引用できるように、本人が書いた言葉（quote）と欄の名前を必ず持たせる。
 * ========================================================================= */

TG.FIELD_NAME = { job: '副業の内容', tools: '使うもの', places: '作業場所', other: 'その他', answer: '追加の質問' };

TG._compiled = false;
TG.compileDict = function () {
  if (TG._compiled) return;
  TG.TYPES.forEach(function (t) { t.kwc = TG.compileKw(t.kw); });
  TG.TYPE_BY_ID = {}; TG.TYPES.forEach(function (t) { TG.TYPE_BY_ID[t.id] = t; });
  TG.SIGNALS.forEach(function (s) { s.kwc = TG.compileKw(s.kw); });
  TG.SIGNAL_BY_ID = {}; TG.SIGNALS.forEach(function (s) { TG.SIGNAL_BY_ID[s.id] = s; });
  TG.TECH_C = TG.compileKw(TG.TECH_HINTS);
  TG._compiled = true;
};

/* 括弧の外にある区切りだけで分ける */
TG.splitTop = function (s, seps) {
  var out = [], buf = '', depth = 0;
  for (var i = 0; i < s.length; i++) {
    var c = s.charAt(i);
    if ('（(「『【['.indexOf(c) >= 0) depth++;
    if ('）)」』】]'.indexOf(c) >= 0) depth = Math.max(0, depth - 1);
    if (depth === 0 && seps.indexOf(c) >= 0) { if (buf.trim()) out.push(buf.trim()); buf = ''; continue; }
    buf += c;
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
};

/* 欄の文章 → 引用の単位。
 *   箇条の並び（「ノートPC、文章校正ツール、…」）は1項目ずつ、
 *   文（「取材のため、月1〜2回、都内へ電車で移動する」）は1文ずつ（40字まで）。 */
TG.quoteUnits = function (text) {
  var units = [];
  String(text || '').split(/[。\n\r]+/).forEach(function (sentence) {
    sentence = sentence.replace(/^\s*[【\[]?[^：:】\]]{1,12}[】\]]?\s*[：:]\s*/, function (m) { return /(副業|使う|作業|場所|その他|移動|受け取|道具)/.test(m) ? '' : m; }).trim();
    if (!sentence) return;
    var items = TG.splitTop(sentence, '、,，');
    var prose = /[るたすいだ]$|ます$|です$|ない$/.test(sentence.replace(/[）)」]+$/, ''));
    if (items.length >= 2 && !prose) {
      items.forEach(function (it) { units.push(it); });
    } else if (sentence.length <= 40) {
      units.push(sentence);
    } else {
      items.forEach(function (it) { units.push(it); });
    }
  });
  return units;
};

/* 一覧のカードに出す短い引用（20字まで。長い文は、手がかりの言葉を含む区切りだけ） */
TG.quoteShort = function (unit, word) {
  if (unit.length <= 20) return unit;
  var w = TG.compact(TG.norm(word || ''));
  var parts = String(unit).split(/[、,，（）()]/).map(function (p) { return p.trim(); }).filter(Boolean);
  for (var i = 0; i < parts.length; i++) {
    if (w && TG.compact(TG.norm(parts[i])).indexOf(w) >= 0) return parts[i].length <= 20 ? parts[i] : (word || parts[i].slice(0, 18) + '…');
  }
  return unit.slice(0, 18) + '…';
};

/* 手がかりの言葉のあと、同じ区切りの中に否定があるか */
TG.isNegatedAt = function (unit, k) {
  var sp = TG.norm(unit), idx = -1;
  if (k.subs) { for (var i = 0; i < k.subs.length && idx < 0; i++) idx = sp.indexOf(k.subs[i]); }
  else if (k.re) { var m = k.re.exec(sp); if (m) idx = m.index + m[1].length; }
  else if (k.fn) { var r = k.fn(sp, TG.compact(sp)); idx = (typeof r === 'number') ? r : 0; }
  /* 位置は正規化した文字で探し、否定の判定は正規化前（NFKCだけ）の文字で行う（「は」「ない」がカタカナにならないように）。
   * 正規化は1文字ずつの置き換えなので、位置はそのまま使える */
  var rd = TG.readable(unit);
  var tail = idx >= 0 ? rd.slice(idx) : rd;
  /* 同じ区切りの中だけを見る。「車は、あまり使わない」のように「は」で切れていれば次の区切りまで */
  var seg = tail.split(/[、,，。]/), win = seg[0];
  if (/は$/.test(win) && seg.length > 1) win += seg[1];
  return TG.NEGATION.test(win.replace(/\s/g, ''));
};

/* 「XXから（銀行）振込で受け取る」の XX を受け取り元として取り出す */
TG.extractPayers = function (unit) {
  var out = [];
  if (!/(受け取|受取|振込|振り込|入金|支払われ|もらう|貰う|入る)/.test(unit)) return out;
  var re = /([^\s、。,，「」（）()]+?)から/g, m;
  while ((m = re.exec(unit))) {
    var w = m[1].split(/[はをがにでのとも]/).pop();
    if (w && w.length >= 2 && !/^(月|毎月|年|平日|週末|自宅)$/.test(w)) out.push(w);
  }
  return out;
};

/* 「何を仕入れる／何を制作に使う」と書かれた名詞句を読む。職種から材料を推測しない。 */
TG.materialSignals = function (profile) {
  var materials = [], excluded = [];
  var privateUse = /趣味|私用|家庭用|家族用|個人用|自分用|自宅用|仕事以外/;
  var negative = /ない|なかった|なくな|なくて|ません|せず|使わず|仕入れず|不使用|不要|未使用/;
  var hobbyJob = privateUse.test(profile.job || '') && !/副業|仕事|販売|受注|事業/.test(profile.job);
  var makesForSale = /制作|製作|製造|作って|作り|手作り|ハンドメイド/.test(profile.job || '') && /販売|受注|納品|出品/.test(profile.job || '');
  var segmenter = TG._materialSegmenter;
  if (segmenter === undefined) {
    segmenter = TG._materialSegmenter = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('ja', { granularity: 'word' }) : null;
  }
  var splitList = function (text) {
    if (segmenter) text = Array.from(segmenter.segment(text), function (s) { return /^(と|や|および|及び|ならびに)$/.test(s.segment) ? '、' : s.segment; }).join('');
    else text = text.replace(/および|及び|ならびに|[とや](?=[一-龯ァ-ヺA-Za-z])/g, '、');
    return text.split(/[、,，・／/]/);
  };
  ['job', 'tools', 'other'].forEach(function (field) {
    String(profile[field] || '').split(/[。！？!?；;\r\n]+/).forEach(function (line) {
      var quote = line.trim();
      if (!quote) return;
      if (privateUse.test(quote) || negative.test(quote) || /支給|貸与|提供され|提供を受け/.test(quote)) { excluded.push(TG.norm(quote)); return; }
      if (/(?:予定|つもり|検討中|検討して|見込み|計画中|計画して)/.test(quote)) return;
      if (hobbyJob && !/仕事|販売用|業務|事業|受注/.test(quote)) return;
      var phrase = TG.readable(quote);
      var label = phrase.match(/^(?:.*?(?:制作|製作|製造|販売|仕事|業務|作品)(?:用の?|で使う|に使う|の)?)?(?:主な)?(?:制作材料|製作材料|使用材料|材料|素材|原材料|仕入れ品|仕入品|仕入れ材料)\s*(?:[:：]|には|は)\s*(.+)$/);
      var object = phrase.match(/^(.+?)(?:など)?(?:を|は|も)(?:(?:現在[もは]?|今でも|今も|今は|主に|定期的に|毎月|毎回|直接)\s*)?(?:仕入れ|仕入(?:する|します)|(?:[^、,，をは。]{0,20}(?:制作|製作|製造|生産|加工|材料|原料|素材)(?:用|用の材料)?(?:として|に|で|用に))(?:使|使用|利用|購入|買)|(?:材料|原料|素材)にして)/);
      var prefixed = phrase.match(/^(?:.*?(?:制作|製作|製造|加工|作品|仕事|業務)(?:のため|用|用の材料)?(?:には|では|に)|(?:.*?の)?(?:材料|素材|原料)として)\s*(.+?)(?:など)?(?:を|は|も)(?:使|使用|利用|購入|買)/);
      var followed = phrase.match(/^(.+?)(?:など)?を(?:購入し|買っ?て|買い)(?:て)?\s*[、,，]?\s*[^、,，]{0,18}(?:作品|製品|商品)[^、,，]{0,6}(?:作|つく|制作|製作|製造)/);
      var makeWith = phrase.match(/^(.+?)(?:など)?を(?:使って|使用して|用いて)\s*[、,，]?\s*[^をは、,，。]{1,24}を(?:作(?:る|り|って)|つく(?:る|り|って)|制作|製作|製造)/);
      if (makeWith && TG.PERSONAL_MATERIAL_USE.test(quote)) { excluded.push(TG.norm(quote)); return; }
      var materialPhrase = object || prefixed || followed || makeWith || label;
      var list = materialPhrase ? materialPhrase[1] : '';
      var bareList = false;
      if (!list && field === 'tools' && makesForSale && !privateUse.test(profile.job) && !/[を：:。]|です|ます/.test(phrase)) {
        bareList = /[、,，・／/]/.test(phrase);
        if (!bareList && phrase.indexOf('と') >= 0) {
          var parts = splitList(phrase);
          bareList = parts.length > 1 && parts.every(function (part) {
            return /^[一-龯ァ-ヺぁ-ゖー]+$/.test(part.trim()) && !/(?:が必要|に興味|を使用|を検討|のみ|だけ)$/.test(part);
          });
        }
      }
      if (bareList) list = phrase;
      if (!list) return;
      list = list.replace(/^[^、,，。]{1,32}(?:に|で)(?:使う|使っている|用いる|使用する|使用している)\s*/, '')
        .replace(/^.*(?:仕事|業務|副業|制作|製作|製造|加工|販売|材料|原料|仕入れ)(?:では|には|で使う|用に|用の|として|のために|をするために|に|は)\s*/, '')
        .replace(/^.*(?:専門店|問屋|仕入れ先|市場|通販|ホームセンター)(?:から|で)\s*/, '')
        .replace(/^(?:主に|毎回|毎月|定期的に)\s*/, '').replace(/(?:など|等|です|を使用する|を使用します)$/, '');
      splitList(list).forEach(function (part) {
        var name = part.trim().replace(/^[「『"'【]+|[」』"'】]+$/g, '').trim();
        var form = TG.norm(name);
        if (makeWith && !/[一-龯ァ-ヺぁ-ゖ]/.test(form)) return;
        var singleMaterial = !bareList && /^[一-龯]$/.test(form) && !/^[物品店等他用種各個点式分色元私数人]$/.test(form);
        if ((!singleMaterial && form.length < 2) || form.length > 28 || /^[\d\s.,-]+$/.test(form)) return;
        if (/[を。:：]|仕入れ|仕入先|を販売|のため|して|します|制作|製作|(?:使う|使い|作る|です|販売し|購入)$/.test(name)) return;
        if (/^(?:物|モノ|材料|素材|原料|原材料|資材|梱包資材|梱包材|道具|工具|機材|備品|部品|消耗品|商品|製品|作品|生活用品|日用品|事務用品|文房具|各種|イロイロ|PC|スマホ|パソコン|ノートPC|スマートフォン|タブレット|カメラ)$/i.test(form)) return;
        if (/(?:株式会社|合同会社|有限会社)|(?:会社|商会|商社|店|屋|問屋|店舗|工房|通販|ストア|ショップ|マーケット|市場|銀行|決済|カード払イ|振込|電子マネー|ペイ|ペイパル|PAYPAL|PAY|SHOP|STORE|MARKET|\.CO\.JP)$/.test(form)) return;
        var compact = TG.compact(form);
        var retailer = TG.TYPES.some(function (type) {
          var vendorType = /^(ec|convenience|home_center|card_bill)$/.test(type.id);
          if (!vendorType && !((bareList || makeWith) && TG.MATERIAL_RETAIL.has(type.id))) return false;
          return type.kwc.some(function (kw) { return kw.label && (TG.compact(TG.norm(kw.label)) === compact || (kw.subs && kw.subs.indexOf(compact) >= 0)); });
        });
        if (retailer) return;
        if ((bareList || makeWith) && (/(?:用品|用具|工具|機材|機器|ライト|ソフト|ミシン|オーブン|窯|ロクロ|轆轤|プリンタ|作業台|ペンチ|パソコン|カメラ)$/.test(form) || TG.SIGNALS.some(function (sig) {
          return sig.kwc.some(function (kw) { return TG.kwHit(kw, form, TG.compact(form)) >= 0; });
        }))) return;
        if (materials.some(function (s) { return s.form === form; })) return;
        var key = Array.from(form, function (c) { return c.codePointAt(0).toString(36); }).join('_');
        var original = quote.indexOf(name) >= 0 ? name : (TG.origSpan(quote, TG.compact(form)) || name);
        materials.push({ id: 'material_' + key, group: 'tool', label: original, word: original, form: form, via: 'text', neg: false, field: field, fieldName: TG.FIELD_NAME[field], quote: quote, short: TG.quoteShort(quote, original) });
      });
    });
  });
  return materials.filter(function (s) { return !excluded.some(function (clause) { return clause.indexOf(s.form) >= 0; }); });
};

/* 品名以降が数量・色・規格・購入表記・本人が挙げた別の材料だけなら、品名として読める。 */
TG.materialDetailsOnly = function (tail, materials) {
  var quantity = /^(?:約|各|合計|計|容量|内容量|幅|厚サ|長サ|直径|重量)?\s*\d+(?:[.,]\d+)?(?:\s*(?:キログラム|グラム|ミリメートル|センチメートル|メートル|リットル|ミリ|センチ|ヤード|サイズ|セット|パック|ケース|ダース|番手|個|枚|袋|束|玉|巻|反|缶|瓶|箱|組|本|色|号|番|点|円|KG|MG|ML|MM|CM|CC|G|L|M))?(?:入リ?|巻キ)?/;
  var specification = /^(?:(?:サイズ|規格|品番|型番|番手|グレード|NO\.?)[:： ]*[A-Z0-9]+(?:-[A-Z0-9]+)*|(?:XXS|XS|XL|XXL|[SML])サイズ)/;
  var attribute = /^(?:半透明|不透明|透明|無色|生成リ?|薄手|厚手|無地|国産|輸入|クリア|ホワイト|ブラック|グレー|ベージュ|ブラウン|ピンク|ブルー|[白黒赤青黄緑紫橙茶桃金銀](?:色)?|業務用|手芸用|制作用|仕入レ|購入|代金|税込|税別|詰合セ|詰メ合ワセ|セット)/;
  var rest = tail;
  while (rest) {
    var delimiter = rest.match(/^(?:[\s,，、・。/／（()[\]【】「」×:：＆&-]+|(?:及ビ|オヨビ|ト)(?=.+))/);
    if (delimiter) { rest = rest.slice(delimiter[0].length); continue; }
    var spec = quantity.exec(rest) || specification.exec(rest) || attribute.exec(rest);
    if (spec) { rest = rest.slice(spec[0].length); continue; }
    var named = materials.filter(function (s) { return rest.indexOf(s.form) === 0; }).sort(function (a, b) { return b.form.length - a.form.length; })[0];
    if (!named) return false;
    rest = rest.slice(named.form.length);
  }
  return true;
};

/* 同じ品名（色・規格・数量は付いてよい）を探す。英単語の断片や「釉薬風」のような別物は採らない。 */
TG.matchProfileMaterial = function (pp, text) {
  var src = String(text || ''), norm = TG.norm(src);
  var materials = (pp && pp.materials) || [];
  var first = null, segments;
  for (var i = 0; i < materials.length; i++) {
    var s = materials[i], at = norm.indexOf(s.form);
    while (at >= 0) {
      var left = norm.slice(0, at), right = norm.slice(at + s.form.length);
      var insideWord = /[A-Z0-9ァ-ヺー一-龯]$/.test(left);
      var modifier = /(?:不透明|半透明|透明|薄手|厚手|無色|無垢|国産|輸入|高純度|生成リ?|ガラス|クリア|オーガニック|[白黒赤青黄緑紫茶金銀](?:イ|色)?|業務用|制作用|工芸用|手芸用)$/.test(left);
      if (/(?:趣味用|自分用|私用|家庭用|家族用)ノ$/.test(left)) modifier = true;
      /* カタカナの種類名＋漢字の材料名（例：メリノ毛糸）は、実際の単語境界も確かめる。 */
      if (!modifier && /^[一-龯]{2}/.test(s.form) && /(?:^|[\s・、,（(])[ァ-ヺー]{2,}$/.test(left) && TG._materialSegmenter) {
        if (!segments) segments = TG._materialSegmenter.segment(norm);
        var word = segments.containing(at);
        modifier = word && word.index === at;
      }
      var imitation = /(?:偽|模造|疑似|擬似|代用|ニセ|フェイク|イミテーション|モドキ)[ァ-ヺー\s]*$/.test(left);
      var separated = !right || /^[\s・,，、。()（）［\]【】「」/:：×-]/.test(right);
      var endOfName = separated || /^(?:[0-9]|セット|購入|仕入レ|代金|詰合セ|ト|及ビ|オヨビ)/.test(right);
      var matches = s.form.length === 1 ? (!insideWord && separated) : ((!insideWord || modifier) && endOfName);
      if (matches && !imitation && (!first || at < first.at || (at === first.at && s.form.length > first.signal.form.length))) {
        first = { signal: s, at: at, tail: right };
      }
      at = norm.indexOf(s.form, at + 1);
    }
  }
  if (!first || !TG.materialDetailsOnly(first.tail, materials)) return null;
  var matched = TG.origSpan(src, TG.compact(first.signal.form), TG.compact(norm.slice(0, first.at)).length);
  return matched ? { signal: first.signal, matched: matched } : null;
};

/* プロフィール → 手がかりの一覧と、明細の種類ごとのつながり */
TG.parseProfile = function (profile, answers) {
  TG.compileDict();
  profile = profile || {}; answers = answers || {};
  var sigs = [], payers = [], incomeWords = [];
  ['job', 'tools', 'places', 'other'].forEach(function (f) {
    TG.quoteUnits(profile[f]).forEach(function (unit) {
      var forms = TG.textForms(unit), here = [];
      var salesClauses = TG.splitTop(unit, '、,，').filter(function (clause) {
        return /(販売|出品|受注|売上|売り上げ|売って|売る|報酬|収益|収入|受け取|受取|振込|振り込|入金|支払われ|稼ぐ|稼いで)/.test(clause);
      }).map(TG.textForms);
      TG.SIGNALS.forEach(function (s) {
        var first = null;
        for (var i = 0; i < s.kwc.length; i++) {
          var k = s.kwc[i];
          if (TG.kwHit(k, forms.spaced, forms.compact) < 0) continue;
          var word = k.label || s.label, neg = TG.isNegatedAt(unit, k);
          var evidence = { id: s.id, label: s.label, group: s.group, field: f, fieldName: TG.FIELD_NAME[f], quote: unit, short: TG.quoteShort(unit, word), neg: neg, via: 'text', word: word };
          if (!first || (first.neg && !neg)) first = evidence;
          if (!s.payer) break;
          if (!neg && word !== 'アフィリエイト' && salesClauses.some(function (clause) { return TG.kwHit(k, clause.spaced, clause.compact) >= 0; })) payers.push(evidence);
        }
        if (first) here.push(first);
      });
      /* 同じ言葉から、より具体的な手がかりが取れたときは、大まかな手がかりを外す（「電子書籍」の中の「書籍」など） */
      here = here.filter(function (x) { var def = TG.SIGNAL_BY_ID[x.id]; return !(def.suppressedBy && here.some(function (y) { return def.suppressedBy.indexOf(y.id) >= 0; })); });
      here.forEach(function (x) { sigs.push(x); });
      TG.extractPayers(unit).forEach(function (w) {
        if (!TG.isNegatedAt(unit, TG.compileKw([w])[0])) payers.push({ word: w, quote: unit, field: f, fieldName: TG.FIELD_NAME[f] });
      });
      ['報酬', '売上', '原稿料', '謝礼', 'ギャラ'].forEach(function (w) { if (unit.indexOf(w) >= 0) incomeWords.push({ word: w, quote: unit, field: f, fieldName: TG.FIELD_NAME[f] }); });
    });
  });
  /* 追加の質問の答え（本文より優先する） */
  TG.TOPICS.forEach(function (tp) {
    var a = answers[tp.id];
    if (a !== 'yes' && a !== 'no') return;
    var s = TG.SIGNAL_BY_ID[tp.signal];
    sigs = sigs.filter(function (x) { return !(x.id === tp.signal && x.via === 'text'); });
    sigs.push({ id: tp.signal, label: s ? s.label : tp.signal, group: s ? s.group : 'tool', field: 'answer', fieldName: TG.FIELD_NAME.answer, quote: tp.q + '→「' + (a === 'yes' ? tp.yes : tp.no) + '」', q: tp.q, ans: (a === 'yes' ? tp.yes : tp.no), neg: a === 'no', via: 'answer', topic: tp.id, answerTypes: tp.types });
  });
  /* 同じ手がかりは最初のものを使う（肯定があれば肯定を優先） */
  var seen = {}, uniq = [];
  sigs.forEach(function (s) {
    var key = s.id;
    if (seen[key] === undefined) { seen[key] = uniq.length; uniq.push(s); }
    else if (uniq[seen[key]].neg && !s.neg && uniq[seen[key]].via === s.via) uniq[seen[key]] = s;
  });
  sigs = uniq;
  /* 種類ごとのつながり */
  var byType = {};
  var add = function (t, kind, s) { (byType[t] = byType[t] || { direct: [], related: [], neg: [] })[kind].push(s); };
  sigs.forEach(function (s) {
    var def = TG.SIGNAL_BY_ID[s.id] || {};
    var direct = (def.direct || []).slice(), related = (def.related || []).slice();
    if (s.answerTypes) s.answerTypes.forEach(function (t) { if (direct.indexOf(t) < 0) direct.push(t); });
    if (s.neg) { direct.forEach(function (t) { add(t, 'neg', s); }); return; }
    direct.forEach(function (t) { add(t, 'direct', s); });
    related.forEach(function (t) { add(t, 'related', s); });
  });
  /* 受け取り元の照合用の言葉（漢字のほかにカナの読みも） */
  var payerForms = [];
  var addPayer = function (w, src, strength) {
    var names = [w], reading = TG.readingOf(w);
    if (reading) names.push(reading);
    TG.PAYER_ALIASES.forEach(function (group) {
      if (group.indexOf(TG.norm(w)) >= 0) names = names.concat(group);
    });
    names.forEach(function (name) {
      var n = TG.norm(name), form = TG.compact(n);
      var wordRe = /^[A-Z0-9 ]+$/.test(n) ? new RegExp('(^|[^A-Z0-9])' + n.split(' ').join('\\s*') + '(?=[^A-Z0-9]|$)') : null;
      if (form.length < 2 || payerForms.some(function (p) { return p.form === form && String(p.wordRe) === String(wordRe); })) return;
      payerForms.push({ form: form, wordRe: wordRe, word: w, src: src, strength: strength });
    });
  };
  payers.forEach(function (p) { addPayer(p.word, p, 'strong'); });
  incomeWords.forEach(function (p) { addPayer(p.word, p, 'weak'); });
  var activities = {};
  sigs.forEach(function (s) { var def = TG.SIGNAL_BY_ID[s.id]; if (!s.neg && def && def.activity) activities[def.activity] = s; });
  /* 入金の理由で引用する「受け取り方」：受け取りを書いた文 → 受け取り元のある文 → 販売サービスの記述 の順 */
  var pick = function (ids) { return sigs.filter(function (s) { return ids.indexOf(s.id) >= 0 && !s.neg; })[0]; };
  var receive = pick(['receive']) || (payers[0] ? { quote: payers[0].quote, fieldName: payers[0].fieldName } : null) || pick(['app_store', 'platform']);
  var empty = !['job', 'tools', 'places', 'other'].some(function (f) { return String(profile[f] || '').trim(); });
  var materials = TG.materialSignals(profile);
  return { sigs: sigs.concat(materials), materials: materials, byType: byType, payers: payerForms, activities: activities, receive: receive, empty: empty };
};

/* 明細の種類に対する、プロフィールのつながり（直接 > 否定 > 関係しうる > なし） */
TG.linkOf = function (pp, typeId) {
  var b = pp.byType[typeId];
  if (!b) return { link: 'none', sig: null };
  if (b.direct.length) return { link: 'direct', sig: b.direct[0], all: b.direct };
  if (b.neg.length) return { link: 'neg', sig: b.neg[0], all: b.neg };
  if (b.related.length) return { link: 'related', sig: b.related[0], all: b.related };
  return { link: 'none', sig: null };
};

/* 1の欄の職種に合わせた「タップで追加」の候補 */
TG.chipsFor = function (fieldId, profile) {
  var f = TG.FIELDS.filter(function (x) { return x.id === fieldId; })[0];
  var base = f ? f.chips.slice() : [];
  var job = String((profile && profile.job) || '');
  TG.JOB_HINTS.forEach(function (h) {
    if (!h.m.test(job)) return;
    var extra = h[fieldId === 'tools' ? 'tools' : (fieldId === 'other' ? 'other' : '_')] || [];
    base = extra.concat(base.filter(function (c) { return extra.indexOf(c) < 0; }));
  });
  /* 1の欄は、書いたあとは候補を出さない */
  if (fieldId === 'job' && job.trim()) return [];
  /* すでに書いてある言葉と、すでに読み取れている手がかりになる候補は出さない（「AIアシスト」と書いた人に「AIツール」を出さない） */
  var cur = TG.compact(TG.norm((profile && profile[fieldId]) || ''));
  var have = {}; TG.parseProfile(profile, {}).sigs.forEach(function (s) { have[s.id] = 1; });
  return base.filter(function (c) {
    if (cur.indexOf(TG.compact(TG.norm(c))) >= 0) return false;
    var f = TG.textForms(c), ids = [];
    TG.SIGNALS.forEach(function (s) { if (s.kwc.some(function (k) { return TG.kwHit(k, f.spaced, f.compact) >= 0; })) ids.push(s.id); });
    /* プロフィールの読み取りと同じく、大まかな手がかり（ツール・移動など）は具体的な手がかりがあれば外す */
    ids = ids.filter(function (id) { var d = TG.SIGNAL_BY_ID[id]; return !(d.suppressedBy && ids.some(function (y) { return d.suppressedBy.indexOf(y) >= 0; })); });
    return !ids.length || ids.some(function (id) { return !have[id]; });
  }).slice(0, 8);
};

/* 貼り付けたプロフィール文を4つの欄に分ける（ラベルがあれば） */
TG.splitProfileText = function (text) {
  var res = { job: '', tools: '', places: '', other: '' }, cur = null, found = false;
  var map = [
    { re: /^\s*[【\[]?(副業の内容|副業内容|副業|仕事の内容|内容)[】\]]?\s*[：:]/, f: 'job' },
    { re: /^\s*[【\[]?(使うもの|使う物|使っているもの|道具|ツール|使うサービス)[】\]]?\s*[：:]/, f: 'tools' },
    { re: /^\s*[【\[]?(作業場所|場所|作業する場所|働く場所)[】\]]?\s*[：:]/, f: 'places' },
    { re: /^\s*[【\[]?(その他|そのほか|移動|受け取り|備考)[】\]]?\s*[：:]/, f: 'other' }
  ];
  String(text || '').split(/\r?\n/).forEach(function (line) {
    if (/^\s*【[^】]*プロフィール[^】]*】\s*$/.test(line)) return;
    var hit = null;
    for (var i = 0; i < map.length; i++) { if (map[i].re.test(line)) { hit = map[i]; break; } }
    if (hit) { cur = hit.f; found = true; res[cur] += (res[cur] ? '\n' : '') + line.replace(hit.re, '').trim(); return; }
    if (!line.trim()) return;
    var f = cur || 'job';
    res[f] += (res[f] ? '\n' : '') + line.trim();
  });
  return { fields: res, labeled: found };
};

/* ---- 40_classify.js ---- */
/* =========================================================================
 * 40_classify.js  仕分け（判定表と、表より先に見る決まり）と理由の文
 *
 * 使うのは、明細・プロフィール（追加の質問の答えを含む）・前の明細の自分ルールだけ。
 * 今の明細での本人の確定・記入・メモは使わない（ツール仕分けと理由は、確定の前後で変わらない）。
 *
 * 判定の順番（設計指示書 3-4）
 *   0 摘要が空欄 → 要判断
 *     材料を買う人（プロフィールに材料名がある人）の、店名だけの支払い → 要判断（1件ずつ確かめる）
 *   1 自分ルール（前に読み込んだ明細での本人の確定）
 *   2 入金：受け取り元がプロフィールと一致 → 事業候補 ／ 利息・給与 → 私用候補 ／ ほか → 要判断
 *     返金：元の明細と同じ区分（元が見つからなければ要判断）
 *   3 ATM・振込・振替 → 要判断
 *   4 摘要に仕事の言葉（取材用 など）→ プロフィールにその活動があれば事業候補、なければ要判断
 *   5 判定表（種類の性質 × プロフィールとのつながり）
 *   6 金額が大きい「どちらにも使う」明細 → 要判断
 * ========================================================================= */

TG.NATURE_LABEL = { work: '仕事向けの種類', dual: '仕事と生活のどちらにも使う種類', life: '生活でよく使う種類', money: 'お金の動き' };

/* 明細の種類を決める（言葉の重みの合計がいちばん大きいもの。同じ文字列に当たった言葉は1回だけ数える） */
TG.detectType = function (forms, dir, opts) {
  TG.compileDict();
  opts = opts || {};
  var best = null;
  TG.TYPES.forEach(function (t) {
    if (opts.noMoney && t.nature === 'money') return;
    if ((t.id === 'income' || t.id === 'salary' || t.id === 'interest') && dir !== 'in') return;
    if (t.id === 'card_bill' && dir !== 'out') return;
    var got = {}, score = 0, hits = [];
    t.kwc.forEach(function (k) {
      var s = TG.kwMatchStr(k, forms.spaced, forms.compact);
      if (!s) return;
      if (got[s] === undefined) { got[s] = k.w; score += k.w; if (k.label) hits.push(k.label); }
      else if (k.w > got[s]) { score += k.w - got[s]; got[s] = k.w; }
    });
    if (score > 0 && (!best || score > best.score)) best = { type: t, score: score, hits: hits, strs: Object.keys(got).filter(function (x) { return x.indexOf('fn:') !== 0; }) };
  });
  if (best && (best.type.id === 'books' || best.type.id === 'ebooks')) {
    var th = TG.TECH_C.filter(function (k) { return TG.kwHit(k, forms.spaced, forms.compact) >= 0; });
    if (th.length) best = { type: TG.TYPE_BY_ID.tech_books, score: best.score, hits: best.hits.concat(th.map(function (k) { return k.label; })), strs: best.strs.concat(th.map(function (k) { return TG.kwMatchStr(k, forms.spaced, forms.compact); }).filter(function (x) { return x; })), from: best.type };
  }
  return best || { type: null, score: 0, hits: [] };
};

/* 元データと照合用の文字は保持し、理由に引用するときだけ該当箇所を省略する。 */
var omittedInExcerpt = new RegExp(TG.BANNED.slice().sort(function (a, b) { return b.length - a.length; }).map(TG.escRe).join('|'), 'g');
TG.reasonExcerpt = function (value) { return String(value == null ? '' : value).replace(omittedInExcerpt, '…'); };

/* プロフィールの言葉の引用（理由の中で使う） */
TG.Q = function (sig) {
  if (!sig) return '';
  if (sig.via === 'answer') return '追加の質問への答え（' + sig.quote + '）';
  return sig.fieldName + '「' + TG.reasonExcerpt(sig.quote) + '」';
};
TG.QQ = function (sig) { return sig ? (sig.via === 'answer' ? '追加の質問への答え（' + sig.quote + '）' : '「' + TG.reasonExcerpt(sig.quote) + '」') : ''; };
/* 追加の質問の答えか */
TG.isAns = function (sig) { return !!sig && sig.via === 'answer'; };
/* 詳しい理由の中の引用（プロフィールの〜／追加の質問への答え（〜）） */
TG.P = function (sig) { return TG.isAns(sig) ? '追加の質問への答え（' + sig.q + '→「' + sig.ans + '」）' : 'プロフィールの' + TG.Q(sig); };
/* 一覧のカード用の短い引用 */
TG.QS = function (sig) { return sig ? (sig.via === 'answer' ? '追加の質問の答え' : '「' + TG.reasonExcerpt(sig.short || sig.quote) + '」') : ''; };

/* 乗車・残高の追加・買い物は、照合に使える記録が違う。 */
TG.transportUse = function (type, desc) {
  if (!type) return '';
  if (type.id === 'taxi') return 'taxi';
  if (type.id !== 'transit') return '';
  var text = TG.readable(desc);
  if (/チャージ|入金|残高追加/.test(text)) return 'charge';
  if (/物販|買物|買い物|電子マネー決済/.test(text)) return 'purchase';
  if (/乗車|運賃|鉄道|電車|バス|新幹線|定期券|きっぷ|切符|メトロ|地下鉄|JR/i.test(text)) return 'ride';
  return 'ic';
};
TG.TRANSPORT_REVIEW = {
  ride: ['乗車履歴と予定を照合', '乗車履歴の時刻・区間を、その日の予定と照らしてください。', 'この乗車は何のためでしたか？'],
  taxi: ['乗降場所と予定を照合', '領収書の時刻・乗降場所を、その日の予定と照らしてください。', 'この乗車は何のためでしたか？'],
  charge: ['残高に追加した金額', 'これは残高に追加した金額です。使い道はチャージ後の利用履歴で確認できます。', '今回チャージした分は何に使いましたか？'],
  purchase: ['買い物の内容を確認', 'ICでの買い物です。レシートの日付と金額を照らし、買った品を確認してください。', '買ったものは何に使いましたか？'],
  ic: ['ICの利用内容を確認', 'ICの表記だけでは利用内容が分かりません。利用履歴で乗車・買い物などの内訳を確かめてください。', '今回の利用は何のためでしたか？']
};

/* 明細ごとの下ごしらえ */
TG.prepRow = function (row) {
  var noteText = row.itemNotes ? TG.purchaseNotes(row).join(' ') : (row.notesText || '');
  var text = (row.raw.desc || '') + ' ' + noteText;
  var forms = TG.textForms(text);
  var det = TG.detectType(forms, row.dir);
  // 摘要が交通の取引を示していれば、訪問先・用事の備考で別の商品に読み替えない。
  if (noteText && det.type && det.type.nature !== 'money' && det.type.id !== 'transit' && det.type.id !== 'taxi') {
    var fromDesc = TG.detectType(TG.textForms(row.raw.desc), row.dir);
    if (fromDesc.type && (fromDesc.type.id === 'transit' || fromDesc.type.id === 'taxi')) det = fromDesc;
  }
  var base = (det.type && det.type.nature === 'money') ? TG.detectType(forms, row.dir, { noMoney: true }) : det;
  /* 「デジタル書籍 配信 テクノ書院」のように、本の種類＋技術系の言葉から技術書とみたときは、そう読んだことを名前に残す */
  var lbl = det.from ? '技術書・専門書（' + det.from.label + '）' : null;
  var quoted = [], fromNote = false;
  (det.strs || []).map(function (x) { return TG.compact(TG.norm(x)); }).sort(function (a, b) { return b.length - a.length; }).forEach(function (x) {
    if (quoted.length >= 2 || quoted.some(function (q) { return TG.compact(TG.norm(q)).indexOf(x) >= 0; })) return;
    var o = TG.origSpan(row.raw.desc, x); if (!o && noteText) { o = TG.origSpan(noteText, x); if (o) fromNote = true; }
    if (o) quoted.push(o);
  });
  /* 摘要の中に出てくる順に並べる */
  var src = text;
  quoted.sort(function (a, b) { return src.indexOf(a) - src.indexOf(b); });
  return { transport: TG.transportUse(base.type, row.raw.desc), type: det.type, hits: det.hits, quoted: quoted, quotedFromNote: fromNote, base: base.type, lbl: lbl, forms: forms, tokens: TG.shopTokens(row.raw.desc), notes: [], pro: [], con: [], facts: [] };
};

/* 元明細の行番号の並び：「11行目と12行目」「11・12・13行目」 */
TG.lineList = function (lines) { return lines.length === 2 ? lines[0] + '行目と' + lines[1] + '行目' : lines.join('・') + '行目'; };

/* 同じ日・同じ店（空白の違いは無視）・同じ金額。どの行どうしかを、元明細の行番号で示す */
TG.markDuplicates = function (rows, res) {
  var groups = {};
  rows.forEach(function (row, i) {
    var key = (row.date ? row.date.iso : row.raw.date) + '|' + TG.compact(TG.norm(row.raw.desc)) + '|' + row.amount + '|' + row.dir;
    (groups[key] = groups[key] || []).push(i);
  });
  Object.keys(groups).forEach(function (k) {
    var g = groups[k];
    if (g.length < 2) return;
    var lines = g.map(function (i) { return rows[i].line; }).sort(function (a, b) { return a - b; });
    g.forEach(function (i) {
      var others = g.filter(function (j) { return j !== i; });
      var spaceOnly = others.some(function (j) { return rows[j].raw.desc !== rows[i].raw.desc; });
      res[i].dup = others;
      res[i].dupLines = lines;
      res[i].notes.push({ kind: 'dup', text: '元明細の' + TG.lineList(lines) + 'は、同じ日・店・金額です' + (spaceOnly ? '（摘要は空白の違いだけ）' : '') + '。2回の利用か二重の請求かは、カード会社の明細で確かめられます。どちらの行も消さずに残しています。', short: '重複の可能性' });
    });
  });
};

/* 同じ店・同じ金額の支払いが別の月にもある（月額・年額などの定期的な支払い） */
TG.markRecurring = function (rows, res) {
  var groups = {};
  rows.forEach(function (row, i) {
    var r = res[i];
    if (row.dir !== 'out' || !r.tokens.length || !r.type) return;
    var named = /(月額|年額|月会費|年会費|会費|サブスク|定額|プラン|月払)/.test(row.raw.desc);
    if (r.type.nature === 'life' && !named) return;
    var key = r.type.id + '|' + r.tokens.join('|') + '|' + row.amount;
    (groups[key] = groups[key] || []).push(i);
  });
  Object.keys(groups).forEach(function (k) {
    var g = groups[k];
    if (g.length < 2) return;
    var months = {};
    g.forEach(function (i) { if (rows[i].date) months[rows[i].date.ym] = 1; });
    if (Object.keys(months).length < 2) return;
    g.forEach(function (i) {
      var others = g.filter(function (j) { return j !== i; });
      res[i].recurring = others;
      res[i].notes.push({ kind: 'recurring', text: '同じ店・同じ金額の支払いが ' + others.map(function (j) { return rows[j].date ? rows[j].date.label : rows[j].raw.date; }).join('、') + ' にもあります（定期的な支払いのようです）。', short: '定期的な支払い' });
    });
  });
};

/* 屋号だけでは品物が分からない。商品・用途・決済の明記があればそちらを優先する。 */
TG.shopDescriptionOnly = function (description, typeId) {
  var name = TG.norm(description).replace(/\s*[（(]?(?:内訳(?:ナシ|無シ|不明)|店名(?:ノミ|ダケ))[)）]?$/, '').trim();
  if (!name || /手数料|送料|会費|利用料|月額|年額|返金|返品|取消|払戻|振込|振替|引落|引キ落|給料|給与|現金|チャージ|入金|ATM|REFUND|決済手数料|テスウリョウ|ヘンキン/.test(name)) return false;
  if (/取材用|撮影用|仕事用|家庭用|家族用|自宅用|業務用ニ|購入品|商品名|(?:[0-9])\s*(?:個|本|枚|袋|束|玉|巻|点|KG|ML|グラム)|(?:白イ|透明|薄手|生成リ)[ァ-ヺ一-龯]|(?:ヲ|ノタメニ)(?:購入|使用|使)|仕入レタ/.test(name)) return false;
  var type = TG.TYPE_BY_ID[typeId];
  var retail = !type || TG.MATERIAL_RETAIL.has(typeId) || /^(books|cafe|restaurant|izakaya|pet|toys|baby)$/.test(typeId);
  if (!retail) return false;
  var words = name.split(/[\s　]+/);
  var shopEnd = /(?:店|屋|商会|商事|書房|工房|堂|薬局|ストア|ショップ|スーパー|マーケット|ホームセンター|カフェ|ベーカリー|本舗)$/;
  if (/^[A-Z][A-Z0-9 .&'-]+ (?:MARKET|STORE|SHOP)$/.test(name) || /^(?:株式会社|合同会社|有限会社)\s*\S+$/.test(name)) return true;
  if (words.length === 1) {
    if (shopEnd.test(name)) return true;
    if (type) {
      if (typeId === 'ec' && /^(?:AMAZON(?:[.](?:CO[.]JP|COM))?|アマゾン|楽天市場|ヤフーショッピング)$/.test(name)) return true;
      return type.kwc.some(function (kw) { return kw.label && TG.compact(TG.norm(kw.label)) === TG.compact(name); }) &&
        !/ケーブル|イヤホン|レコーダー|充電器|アクセサリー|家電|事務用品|食品|パン|衣料|日用品|書籍|雑誌|コーヒー|珈琲|弁当|ラーメン|シューズ/.test(name);
    }
    /* 辞書にない短い表記は、品物も用途も分からない一般の支払いとして質問できる。 */
    return /^[A-Zァ-ヺー一-龯々0-9・.&'-]{2,32}$/.test(name);
  }
  if (words.slice(1).every(function (word) { return /^(?:(?:注文番号|ORDER|#)?\d{5,}(?:-\d+)*|[A-Zァ-ヺー一-龯々0-9]+(?:支店|本店|営業所))$/.test(word); }) &&
      (shopEnd.test(words[0]) || /^(?:AMAZON(?:[.]CO[.]JP|[.]COM)?|アマゾン|楽天市場|IKEA|イケア)$/.test(words[0]))) return true;
  if (words.length !== 2) return false;
  if (/^(?:.+(?:支店|本店)|.+店)$/.test(words[1]) && (shopEnd.test(words[0]) || type)) return true;
  /* 業態＋屋号（「陶芸店 ひより」「スーパー ワカバ屋」）。屋号＋別の語は広げない。 */
  var format = /^(?:[一-龯ァ-ヺー]{1,12}(?:専門店|雑貨店|書店|陶芸店|用品店|商店)|陶芸店|電器店|書店|スーパー|ネットスーパー|ホームセンター|コンビニ|カフェ|喫茶店|ドラッグストア|ドラッグ|居酒屋|ブックストア|ペットショップ|ベーカリー)$/;
  return format.test(words[0]) && (/^[ァ-ヺー]{2,24}$/.test(words[1]) || shopEnd.test(words[1])) && !TG.detectType(TG.textForms(words[1]), 'out').type;
};

/* 品物を買った支払い。送料込みの購入と、送料だけの取引を区別する。 */
TG.isPurchasePayment = function (row, r) {
  if (row.dir !== 'out' || !(row.amount > 0) || !row.date || (r.type && r.type.nature === 'money')) return false;
  var text = TG.norm([row.raw.desc].concat(row.itemNotes || []).join(' ')).replace(/(?:送料|手数料)(?:込ミ?|ヲ含ム)|送料無料/g, '').trim();
  return !/手数料|送料|返金|返品|取消|払イ?戻|還付|振リ?込|振リ?替|送金|入金|現金引|引キ?落|ヘンキン|テスウリョウ|フリコミ|フリカエ|\b(?:FEES?|REFUND(?:ED)?|TRANSFER|ATM)\b/.test(text);
};

TG.canSpecifyPurchase = function (row, r) {
  return !!String(row.raw.desc || '').trim() && TG.isPurchasePayment(row, r);
};

TG.purchaseNotes = function (row) {
  var administrative = /^(?:一括(?:払イ)?|[0-9]+回(?:払イ)?|カード(?:決済|利用)|支払イ?|決済|本人|不明|内訳(?:ナシ|無シ|不明)|明細ナシ|ナシ|[-ー])$/;
  return (row.itemNotes || []).filter(function (note) { return note.trim() && !administrative.test(TG.norm(note)); });
};

/* 仕事の材料を買う人（プロフィールに材料名がある人）が、品物の分からない店で払った明細か。
 * 材料を買わない人の店名だけの明細は、ふつうの明細として一覧でも確定できる。 */
TG.materialShopOnly = function (pp, desc, typeId) {
  if (!pp || !pp.materials || !pp.materials.length) return false;
  if (typeId && !TG.MATERIAL_RETAIL.has(typeId)) return false;
  if (!TG.shopDescriptionOnly(desc, typeId || '')) return false;
  return !TG.matchProfileMaterial(pp, desc);
};
TG.needsPurchaseDetails = function (row, r, pp) {
  if (typeof r.needsPurchaseDetails === 'boolean') return r.needsPurchaseDetails;
  if (r.transport || !TG.canSpecifyPurchase(row, r) || TG.purchaseNotes(row).length) return false;
  return TG.materialShopOnly(pp, row.raw.desc, r.type ? r.type.id : '');
};

/* 本人が記入した品名が、プロフィールの材料名と同じか（確認画面の案内にだけ使い、ツール仕分けは変えない）。 */
TG.purchaseItemHint = function (pp, item) {
  item = String(item == null ? '' : item).trim();
  if (!item || TG.PERSONAL_MATERIAL_USE.test(item) || TG.OTHER_MATERIAL_PURPOSE.test(item)) return null;
  var hit = TG.matchProfileMaterial(pp, item);
  return hit ? { matched: hit.matched, signal: hit.signal } : null;
};

/* 自分ルール：前に読み込んだ明細（今の明細以外）での本人の確定 */
TG.ruleMatch = function (r, ctx, pp) {
  if (r.transport || !ctx || !ctx.rules || !ctx.rules.length || !r.tokens.length) return null;
  var typeId = r.base ? r.base.id : (r.type ? r.type.id : '');
  var hits = ctx.rules.filter(function (e) {
    if (e.type === 'transit' || e.type === 'taxi' || (e.final !== 'biz' && e.final !== 'pvt')) return false;
    if (e.datasetId === ctx.datasetId || !e.tokens || !TG.sameShop(e.tokens, r.tokens, e.type === typeId)) return false;
    /* 材料を買う店で、品名のない1件の確定は、店全体の区分として使わない。 */
    return !TG.materialShopOnly(pp, e.desc, e.type);
  });
  if (!hits.length) return null;
  hits.sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
  return { biz: hits.filter(function (e) { return e.final === 'biz'; }), pvt: hits.filter(function (e) { return e.final === 'pvt'; }), last: hits[0] };
};

/* どちらにも使う種類（本・通販・家電・通信など）は、同じ店でも、買った物や月によって用途が変わる。
 * 前の明細での確定（覚えた店）では候補を決めず、前回の確定とメモを天秤の手がかりとして出す。 */
TG.dualUse = function (r) { var t = r.base || r.type; return !!(t && t.nature === 'dual'); };
TG.priorLine = function (e) {
  return '前回の確定：' + (e.file ? TG.reasonExcerpt(e.file) + '・' : '') + TG.reasonExcerpt(e.dateLabel) + '「' + TG.reasonExcerpt(e.desc) + '」→' + TG.CAT[e.final].final + (e.memo ? '（メモ：' + TG.reasonExcerpt(e.memo) + '）' : '');
};
TG.applyPrior = function (r) {
  var p = r.prior;
  if (p.biz.length) r.pro.push(TG.priorLine(p.biz[0]) + (p.biz.length > 1 ? ' ほか' + (p.biz.length - 1) + '件' : ''));
  if (p.pvt.length) r.con.push(TG.priorLine(p.pvt[0]) + (p.pvt.length > 1 ? ' ほか' + (p.pvt.length - 1) + '件' : ''));
  /* 「使わない」と答えた種類でも、前の明細で「事業」と確定した店なら、今回の用途を確かめる */
  if (r.cat === 'pvt' && p.biz.length) {
    var e = p.biz[0];
    TG.set(r, 'ask', 'prior-dual', '前回は「事業」で確定した店。今回の用途を確認', r.long + '前に読み込んだ明細（' + (e.file ? TG.reasonExcerpt(e.file) + '・' : '') + TG.reasonExcerpt(e.dateLabel) + '「' + TG.reasonExcerpt(e.desc) + '」）では、同じ店をあなたが「事業」と確定しています。今回の用途を確認してください。');
  }
};

/* 「摘要の「ﾔﾁﾝ」から」のように、摘要（元の表記）のどの言葉から種類を読んだかを書く */
TG.readFrom = function (r) { return r.quoted && r.quoted.length ? (r.quotedFromNote ? '摘要・備考の' : '摘要の') + r.quoted.map(function (q) { return '「' + TG.reasonExcerpt(q) + '」'; }).join('') + 'から' : '摘要から'; };
TG.set = function (r, cat, rule, short, long) { r.cat = cat; r.rule = rule; r.short = short; r.long = long; };

/* 1件の仕分け（返金の元を探す必要があるものは second=true のときに決める） */
TG.decide = function (row, r, pp, ctx, rows, res, second) {
  var t = r.type, desc = row.raw.desc || '';
  if (!row.date || row.amount === null) {
    var missing = !row.date && row.amount === null ? '日付・金額' : (!row.date ? '日付' : '金額');
    TG.set(r, 'ask', 'unreadable', missing + 'を読み取れませんでした', missing + 'を読み取れませんでした。元の明細を確かめて、事業か私用かを選んでください。');
    return true;
  }

  if (!String(desc).trim()) { TG.set(r, 'ask', 'empty', '摘要が空欄です', '摘要が空欄のため、どんな支払いかを読み取れませんでした。確認をお願いします。'); return true; }
  /* 材料を買う人の、店名だけの支払い。同じ店でも買った品で用途が変わるため、1件ずつ確かめる。 */
  if (r.needsPurchaseDetails) {
    var material = pp.materials[0];
    TG.set(r, 'ask', 'shop-only', '店名だけでは購入品が分かりません', '摘要「' + TG.reasonExcerpt(desc) + '」は店名だけで、買った品が分かりません。' + TG.P(material) + 'に仕事の材料の記載があり、この店で材料を買った可能性もあるため、要判断にしました。レシートや注文履歴で、この日に買った品を確かめてください。');
    r.pro.push(TG.P(material));
    r.facts.push('摘要は店名だけ（品名の記載なし）');
    return true;
  }
  var isRefund = t && t.id === 'refund';
  var inMerchant = row.dir === 'in' && (!t || t.nature !== 'money');
  if ((isRefund || inMerchant) && !second) return false;

  /* 1 自分ルール（返金は、まず同じ明細の中の元の支払いにそろえる） */
  var rm = (isRefund || inMerchant) ? null : TG.ruleMatch(r, ctx, pp);
  if (rm && TG.dualUse(r)) { r.prior = rm; rm = null; }
  if (rm) {
    var e = rm.last, where = (e.file ? TG.reasonExcerpt(e.file) + '・' : '') + TG.reasonExcerpt(e.dateLabel);
    if (rm.biz.length && rm.pvt.length) {
      TG.set(r, 'ask', 'rule-mixed', '前回、同じ店を事業・私用の両方で確定しています', '前に読み込んだ明細で、同じ店とみられる明細をあなたが「事業」' + rm.biz.length + '件・「私用」' + rm.pvt.length + '件で確定しています。今回はどちらか確認をお願いします。');
      r.pro.push('前回「事業」で確定：' + rm.biz.length + '件'); r.con.push('前回「私用」で確定：' + rm.pvt.length + '件');
    } else {
      var fin = rm.biz.length ? 'biz' : 'pvt';
      var previousDesc = TG.reasonExcerpt(e.desc);
      TG.set(r, fin, 'rule', '前回、あなたが「' + TG.CAT[fin].final + '」と確定した店です', '前に読み込んだ明細（' + where + '「' + previousDesc + '」）で、あなたが「' + TG.CAT[fin].final + '」と確定しています。同じ店とみられるため、' + TG.CAT[fin].label + 'にしました。');
      (fin === 'biz' ? r.pro : r.con).push('前回の確定：' + where + '「' + previousDesc + '」→' + TG.CAT[fin].final);
    }
    return true;
  }

  /* 2 入金・返金 */
  if (row.dir === 'in' || isRefund) {
    var descForms = TG.textForms(desc);
    var present = function (p) { return p.wordRe ? p.wordRe.test(descForms.spaced) : descForms.compact.indexOf(p.form) >= 0; };
    var strong = pp.payers.filter(function (p) { return p.strength === 'strong' && p.form.length >= 3 && present(p); })[0];
    if (row.dir === 'in' && strong && !isRefund) {
      var payerName = TG.reasonExcerpt(strong.word);
      TG.set(r, 'biz', 'income-match', '受け取り元「' + payerName + '」がプロフィールと一致', '入金です。プロフィールの' + TG.Q(strong.src) + 'にある受け取り元「' + payerName + '」が、摘要の「' + TG.reasonExcerpt(TG.origSpan(row.raw.desc, strong.form) || strong.word) + '」と一致したため、事業候補にしました。');
      r.pro.push('受け取り元の一致：' + TG.QQ(strong.src)); r.paySig = strong.src; return true;
    }
    if (t && t.id === 'interest') { TG.set(r, 'pvt', 'interest', '預金の利息の入金のようです', '預金の利息の入金のようです。プロフィールに関係する記述はないため、私用候補にしました。'); r.con.push('預金の利息'); return true; }
    if (t && t.id === 'salary') { TG.set(r, 'pvt', 'salary', '給与の入金のようです', '給与の入金のようです。副業の受け取りとは別のものとして、私用候補にしました。副業の受け取りであれば「事業」で確定してください。'); r.con.push('給与の入金'); return true; }
    if (isRefund || inMerchant) {
      var orig = TG.findOriginal(row, r, rows, res);
      if (orig === -2) {
        TG.set(r, 'ask', 'refund-ambiguous', '同じ店・同額の支払いが複数あり、区分が異なります', '同じ店・同額の支払いが複数あり、今回の用途によって区分が異なります。どの支払いの返金か確認してください。');
        return true;
      }
      if (orig >= 0) {
        var o = rows[orig], or = res[orig];
        r.refOf = orig; or.refundedBy = (or.refundedBy || []).concat([row.idx]);
        or.notes.push({ kind: 'refunded', text: (row.date ? row.date.label : TG.reasonExcerpt(row.raw.date)) + 'に ' + TG.yen(row.amount) + '円の返金があります。', short: '返金あり' });
        var ol = o.date ? o.date.label : TG.reasonExcerpt(o.raw.date), originalDesc = TG.reasonExcerpt(o.raw.desc);
        TG.set(r, or.cat, 'refund', ol + '「' + originalDesc + '」の返金のようです', ol + 'の「' + originalDesc + '」（' + TG.yen(o.amount) + '円）と同じ店の' + (isRefund ? '返金' : '入金（マイナスの金額）') + 'のようです。元の明細と同じ「' + TG.CAT[or.cat].label + '」にしています。確定するときは、元の明細と同じ区分にそろえると整理が分かりやすくなります。');
        r.pro = or.pro.slice(); r.con = or.con.slice(); r.facts = or.facts.slice();
        return true;
      }
      if (isRefund) {
        var rm2 = TG.ruleMatch(r, ctx, pp);
        if (rm2 && TG.dualUse(r)) { r.prior = rm2; rm2 = null; }
        if (rm2 && !(rm2.biz.length && rm2.pvt.length)) {
          var f2 = rm2.biz.length ? 'biz' : 'pvt';
          TG.set(r, f2, 'rule', '返金：前回「' + TG.CAT[f2].final + '」と確定した店です', '返金・取消のようです。元の支払いはこの明細にありませんが、前に読み込んだ明細で同じ店をあなたが「' + TG.CAT[f2].final + '」と確定しているため、' + TG.CAT[f2].label + 'にしました。');
          return true;
        }
        TG.set(r, 'ask', 'refund-orphan', '返金のようですが、元の支払いが見つかりません', '返金・取消のようですが、元の支払いがこの明細の中に見つかりませんでした。どの支払いの返金かを確認してください。');
        if (r.prior) TG.applyPrior(r);
        return true;
      }
    }
    if (row.dir === 'in') {
      var weak = pp.payers.filter(function (p) { return p.strength === 'weak' && present(p); })[0];
      if (weak) {
        TG.set(r, 'ask', 'income-partial', '受け取りの言葉は一致、受け取り元は一致しません', '入金です。摘要の「' + TG.reasonExcerpt(TG.origSpan(row.raw.desc, weak.form) || weak.word) + '」がプロフィールの' + TG.Q(weak.src) + 'と言葉は一致しますが、受け取り元が一致しないため、心当たりを確認してください。');
        r.pro.push('受け取りの言葉の一致：「' + TG.reasonExcerpt(weak.word) + '」'); r.facts.push('受け取り元が一致しない'); return true;
      }
      if (pp.receive) {
        TG.set(r, 'ask', 'income-unmatched', '入金です。プロフィールの受け取り方と一致しません', '入金です。プロフィールの受け取り方（' + TG.QQ(pp.receive) + '）とは一致しないため、心当たりを確認してください。');
        r.facts.push('プロフィールの受け取り方と一致しない');
      } else {
        TG.set(r, 'ask', 'income-unknown', '振込人と受け取りの記録を確認', '副業の受け取りかを特定できません。入金日・相手・金額を、請求書や受け取りの記録と照らしてください。');
      }
      return true;
    }
  }

  /* 3 ATM・振込・振替 */
  if (t && t.id === 'atm') { TG.set(r, 'ask', 'atm', '現金の引き出しです（使い道は明細から分かりません）', '現金の引き出しです。使い道は明細からは分からないため、確認をお願いします。'); return true; }
  if (t && t.id === 'transfer') { TG.set(r, 'ask', 'transfer', '振込・振替です（相手や目的は明細から分かりません）', '振込・振替です。相手や目的は明細からは分からないため、確認をお願いします。'); return true; }
  if (t && t.id === 'card_bill') { TG.set(r, 'ask', 'card_bill', 'カードの引き落としのようです（中身はカードの明細にあります）', 'クレジットカードの利用代金の引き落としのようです。中身の支払いはカードの明細に1件ずつ載っているため、カードの明細も読み込む場合は、どちらで整理するかを決めておくと二重に数えずに済みます。'); return true; }
  if (t && t.nature === 'money') { TG.set(r, 'ask', 'money', t.label + 'です', t.label + 'のようです。確認をお願いします。'); return true; }

  if (r.transport) {
    var guide = TG.TRANSPORT_REVIEW[r.transport];
    var sig = TG.linkOf(pp, t.id).sig;
    var reason = guide[1];
    if (r.transport === 'ride') {
      reason = r.dup ? '行番号はCSV内の位置です。履歴の並び順だけでは、どちらの乗車か分かりません。元明細の' + row.line +
        '行目に対応する利用番号や利用詳細を確かめ、時刻・区間を予定表と照合してください。' :
        '運賃からは移動の目的が分かりません。' + reason;
    }
    TG.set(r, 'ask', 'transport', guide[0], reason);
    if (sig) { r.linkSig = sig; r.pro.push(TG.P(sig)); }
    return true;
  }
  if (TG.decideMaterial(row, r, pp)) { if (r.prior) TG.applyPrior(r); return true; }

  /* 4 判定表 → 5 摘要の仕事の言葉（区分を「上げる」方向にだけ使い、事業候補を要判断に下げない）
   * → 6 前の明細での確定（どちらにも使う種類だけ。手がかりとして出す） */
  TG.decideTable(row, r, pp, desc);
  TG.applyWorkWord(r, pp);
  if (r.prior) TG.applyPrior(r);
  return true;
};

/* 本人が挙げた材料と、今回支払った品名が一致するときだけ候補に使う。 */
TG.decideMaterial = function (row, r, pp) {
  if (!pp.materials.length || row.dir !== 'out' || !(row.amount > 0)) return false;
  var foodService = r.type && (r.type.id === 'cafe' || r.type.id === 'restaurant');
  if (r.type && !TG.MATERIAL_RETAIL.has(r.type.id) && !foodService) return false;
  if (r.type && TG.linkOf(pp, r.type.id).link === 'neg') return false;
  var notes = row.itemNotes || [];
  var context = TG.readable([row.raw.desc].concat(notes).join(' '));
  if (TG.OTHER_MATERIAL_PURPOSE.test(context)) return false;
  var source = '摘要', hit = TG.matchProfileMaterial(pp, row.raw.desc);
  if (!hit) {
    source = '備考';
    for (var i = 0; i < notes.length && !hit; i++) hit = TG.matchProfileMaterial(pp, notes[i]);
  }
  if (!hit) return false;
  /* 「コーヒー生豆」の「コーヒー」だけで喫茶店と推定された場合は、具体的な品名を使う。 */
  if (foodService && (!r.hits.length || !r.hits.every(function (word) {
    return hit.signal.form.indexOf(TG.norm(word)) >= 0;
  }))) return false;
  var name = TG.reasonExcerpt(hit.matched), evidence = source + 'の「' + name + '」';
  r.linkSig = hit.signal;
  r.pro.push(TG.P(hit.signal), evidence);
  if (TG.PERSONAL_MATERIAL_USE.test(context)) {
    TG.set(r, 'ask', 'material-mixed', '材料名は一致しますが、個人利用を示す記載があります',
      TG.P(hit.signal) + 'の材料名と' + evidence + 'が一致します。今回は個人利用を示す記載もあるため、用途を確認してください。');
    r.con.push('明細に個人利用を示す記載があります');
    return true;
  }
  TG.set(r, 'biz', 'material', evidence + 'が仕事で使う材料と一致',
    TG.P(hit.signal) + 'に書かれた材料名が、' + evidence + 'と一致するため、事業候補にしました。');
  return true;
};

/* 摘要・備考の「仕事の言葉」（取材用・打ち合わせ など） */
TG.applyWorkWord = function (r, pp) {
  var ww = TG.workWord(r);
  if (!ww) return;
  var act = ww.activity ? pp.activities[ww.activity] : null;
  if (r.cat === 'biz') { r.pro.push('摘要・備考の「' + ww.w + '」'); return; }
  if (act) {
    TG.set(r, 'biz', 'work-word', '摘要に「' + ww.w + '」、プロフィールに' + TG.QS(act), '摘要・備考に「' + ww.w + '」という仕事の言葉があり、プロフィールの' + TG.Q(act) + 'にも関係するため、事業候補にしました。');
    r.pro.unshift(TG.P(act)); r.pro.unshift('摘要・備考の「' + ww.w + '」'); r.actSig = act;
    return;
  }
  TG.set(r, 'ask', 'work-word-only', '摘要に「' + ww.w + '」とありますが、プロフィールに記述なし', '摘要・備考に「' + ww.w + '」という仕事の言葉がありますが、プロフィールに関係する記述がないため、確認をお願いします。');
  r.pro.unshift('摘要・備考の「' + ww.w + '」');
  if (r.facts.indexOf('プロフィールに関係する記述がない') < 0) r.facts.push('プロフィールに関係する記述がない');
};

/* 判定表（種類の性質 × プロフィールとのつながり） */
TG.decideTable = function (row, r, pp, desc) {
  var t = r.type;
  if (!t) {
    TG.set(r, 'ask', 'unknown', '今回の利用目的を確認', '摘要「' + TG.reasonExcerpt(desc) + '」からは、仕事用か私用かを特定できません。利用日の予約や領収書を手がかりにしてください。');
    return true;
  }
  var L = TG.linkOf(pp, t.id), lbl = r.lbl || t.label, n = t.nature, s = L.sig;
  r.link = L.link; r.linkSig = s;
  /* 摘要のどの言葉から種類を読んだかは、理由の中で1回だけ書く（CSVで種類名を繰り返さない） */
  var readType = TG.readFrom(r) + '、種類を「' + lbl + '」と読み取りました。';
  var profile = !s ? '' : (TG.isAns(s)
    ? '「' + s.label + '」の質問には「' + s.ans + '」と回答しています。'
    : 'プロフィールには「' + TG.reasonExcerpt(s.quote) + '」とあります。');
  var purposeGap = '今回の支払いが仕事用か私用かは、明細だけでは分かりません。';
  if (t.id === 'books' || t.id === 'ebooks' || t.id === 'magazine') purposeGap = 'この本を仕事の資料として買ったかは、明細だけでは分かりません。';
  if (t.id === 'telecom' || t.id === 'internet') purposeGap = 'この請求がどの回線の分か、利用明細で確かめてください。';
  if (L.link === 'neg') {
    TG.set(r, 'pvt', 'neg', TG.isAns(s) ? '追加の質問で「' + s.ans + '」と回答しています' : TG.QS(s) + 'とあります', profile + readType + '仕事では使わないという' + (TG.isAns(s) ? '回答' : '記述') + 'を当てはめました。');
    r.con.push(TG.P(s)); return true;
  }
  if (n === 'work') {
    if (L.link === 'direct') {
      TG.set(r, 'biz', 'table', TG.isAns(s) ? '追加の質問で「' + s.ans + '」と回答' : TG.QS(s) + 'と一致', profile + TG.readFrom(r) + '読み取った「' + lbl + '」と一致します。');
      r.pro.push(TG.P(s)); r.pro.push(TG.NATURE_LABEL.work + '：' + lbl);
    } else if (L.link === 'related') {
      var gap = r.lbl ? '専門書かどうかは明細の表記からの推定です。仕事の資料として買った本か、確かめてください。' : '仕事で使ったかは、明細だけでは分かりません。';
      TG.set(r, 'ask', 'table', s.label + 'に関連。今回の用途は不明', profile + readType + gap);
      r.pro.push(TG.NATURE_LABEL.work + '：' + lbl); r.pro.push('関係しそうな記述：' + TG.Q(s)); r.facts.push('プロフィールに' + t.label + 'の記述がない');
    } else {
      TG.set(r, 'ask', 'table', '仕事とのつながりを確認', readType + 'プロフィールには、副業で使っているかの記載がありません。');
      r.pro.push(TG.NATURE_LABEL.work + '：' + lbl); r.facts.push('プロフィールに関係する記述がない');
    }
    return true;
  }
  if (n === 'dual') {
    if (L.link === 'direct') {
      TG.set(r, 'ask', 'table', s.label + 'は仕事でも使用。今回の用途を確認', profile + readType + purposeGap);
      r.pro.push(TG.P(s)); r.facts.push(TG.NATURE_LABEL.dual + '：' + lbl);
    } else if (L.link === 'related') {
      TG.set(r, 'ask', 'table', s.label + 'に関連。今回の用途は不明', profile + readType + purposeGap);
      r.pro.push('関係しそうな記述：' + TG.Q(s)); r.facts.push(TG.NATURE_LABEL.dual + '：' + lbl);
    } else if (row.amount !== null && row.amount >= TG.LARGE_AMOUNT) {
      TG.set(r, 'ask', 'large', '金額が大きいため、念のため確認に回しました', readType + 'プロフィールに関係する記述はありませんが、金額が' + TG.yen(row.amount) + '円と大きく、仕分けを間違えたときの影響が大きいため、確認に回しました。');
      r.facts.push('プロフィールに関係する記述がない', '金額が大きい（' + TG.yen(row.amount) + '円）');
    } else {
      /* 記載がないことは私用の証拠にしない。どちらにも使う種類は要判断に置き、追加の質問で「使わない」と答えたときだけ私用候補にする */
      TG.set(r, 'ask', 'table', '仕事にも私用にも使う種類。今回の用途を確認', readType + '仕事にも私用にも使える種類です。プロフィールにこの種類の記載はありませんが、記載がないだけでは私用と決めず、要判断にしました。');
      r.facts.push(TG.NATURE_LABEL.dual + '：' + lbl, 'プロフィールに関係する記述がない');
    }
    return true;
  }
  /* 生活 */
  if (L.link === 'direct') {
    TG.set(r, 'ask', 'table', TG.isAns(s) ? '追加の質問で「' + s.ans + '」と回答。仕事の可能性もあります' : TG.QS(s) + 'があるため、仕事の可能性もあります', readType + 'ふだんは生活で使う種類ですが、プロフィールの' + TG.Q(s) + 'があるため、仕事の可能性もあります。確認をお願いします。');
    r.pro.push(TG.P(s)); r.con.push(TG.NATURE_LABEL.life + '：' + lbl);
  } else if (L.link === 'related') {
    TG.set(r, 'pvt', 'table', '生活でよく使う種類です', readType + '生活でよく使う種類で、プロフィールの' + TG.Q(s) + 'とのつながりは弱いため、私用候補にしました。');
    r.con.push(TG.NATURE_LABEL.life + '：' + lbl); r.pro.push('つながりの弱い記述：' + TG.Q(s));
  } else {
    /* 私用候補にする根拠は「日常の支払いに多い種類」であること（記載がないことではない） */
    TG.set(r, 'pvt', 'table', '日常の支払いに多く、副業とのつながりは未記載', readType + '日常の支払いに多い種類なので、私用候補にしました。プロフィールに、仕事で使うという記載もありません。');
    r.con.push(TG.NATURE_LABEL.life + '：' + lbl); r.facts.push('プロフィールに関係する記述がない');
  }
  return true;
};

TG._ww = null;
TG.workWord = function (r) {
  if (!TG._ww) TG._ww = TG.WORK_WORDS.map(function (x) { return { w: x.w, activity: x.activity, c: TG.compact(TG.norm(x.w)) }; });
  var c = r.forms.compact;
  for (var i = 0; i < TG.WORK_WORD_EXCLUDE.length; i++) if (c.indexOf(TG.compact(TG.norm(TG.WORK_WORD_EXCLUDE[i]))) >= 0) return null;
  for (var j = 0; j < TG._ww.length; j++) if (c.indexOf(TG._ww[j].c) >= 0) return TG._ww[j];
  return null;
};

/* 返金の元：逆向き・同じ店・同じ金額で、返金日までにある明細だけを照合する。
 * 本人の確定は見ない（ツール仕分けは、確定の前後で変わらない）。 */
TG.findOriginal = function (row, r, rows, res) {
  var want = row.dir === 'in' ? 'out' : 'in', best = -1, individual = false, categories = new Set();
  rows.forEach(function (o, j) {
    if (j === row.idx || o.dir !== want || !res[j] || res[j].cat === undefined) return;
    if (!o.date || o.date.iso > row.date.iso || o.amount !== row.amount) return;
    if (res[j].type && res[j].type.id === 'refund') return;
    if (!TG.sameShop(res[j].tokens, r.tokens, true)) return;
    individual = individual || !!res[j].transport || !!res[j].needsPurchaseDetails;
    categories.add(res[j].cat);
    if (best < 0 || o.date.iso > rows[best].date.iso) best = j;
  });
  if (individual && categories.size > 1) return -2;
  return best;
};

/* 要判断の確認で出す質問 */
TG.questionFor = function (row, r) {
  if (r.needsPurchaseDetails) return 'この日にこのお店で買ったものは、仕事で使うためのものでしたか？';
  if (r.rule === 'transport') return TG.TRANSPORT_REVIEW[r.transport][2];
  if (r.rule === 'purpose-conflict') return '今回の支払いは、ご自身の副業のためでしたか？';
  if (r.rule === 'unknown' && TG.purchaseNotes(row).length) return 'この日の利用内容は、副業のためのものでしたか？';
  if (r.rule === 'material' || r.rule === 'material-mixed') return '今回の「' + TG.reasonExcerpt(r.linkSig.word) + '」は、仕事で使うために買いましたか？';
  var id = r.type ? r.type.id : 'unknown';
  if (r.rule === 'refund' || r.rule === 'refund-orphan' || r.rule === 'refund-ambiguous') id = 'refund';
  else if (row.dir === 'in' && id !== 'refund') return TG.REVIEW_Q.income;
  var q = TG.REVIEW_Q[id];
  if (!q) q = (r.type && r.type.nature === 'work') ? TG.REVIEW_Q._work : TG.REVIEW_Q._life;
  return q.replace('{type}', r.type ? r.type.label : '支払い').replace('{date}', row.date ? row.date.label : '');
};

/* 会員名や決済区分を除いたその回の記録を、仕事の一致語や過去の店ルールより重く見る。 */
TG.checkPurposeConflict = function (row, r) {
  if (row.dir !== 'out' || r.cat !== 'biz' || !row.date || !(row.amount > 0) || (r.type && r.type.nature === 'money')) return;
  var fields = TG.purchaseNotes(row).concat([row.raw.desc]);
  var cue = /私用|自分用|趣味用|家庭用|家族用|家族旅行|プライベート用|仕事(?:用)?(?:では|で|に|には)(?:使わない|使いません)/g;
  for (var i = 0; i < fields.length; i++) {
    var value = TG.readable(fields[i]);
    var fragment = Array.from(value.matchAll(cue)).find(function (m) {
      var before = value.slice(0, m.index), after = value.slice(m.index + m[0].length);
      return !/(?:依頼主|お客様|顧客)の$/.test(before) && !/^(?:ではなく|ではない|ではありません|でなく|じゃない|なし|無し)/.test(after);
    });
    if (!fragment) continue;
    var sig = r.actSig || r.linkSig;
    var source = i < fields.length - 1 ? '備考' : '摘要';
    var evidence = source + 'に「' + TG.reasonExcerpt(fragment[0]) + '」とあります。';
    TG.set(r, 'ask', 'purpose-conflict', '仕事の手がかりと今回の用途を照合', evidence + (sig ? '副業の手がかり「' + TG.reasonExcerpt(sig.label) + '」だけでは、' : '店名や仕事で使う種類だけでは、') + 'この支払いが仕事用かは決まりません。');
    r.linkSig = sig;
    r.pro = sig ? [TG.P(sig)] : [];
    r.con = [evidence];
    return;
  }
};

/* 全件の仕分け */
TG.classifyAll = function (rows, pp, ctx) {
  TG.compileDict();
  ctx = ctx || {};
  /* 仕分けに使うのは、明細・プロフィール（追加の質問の答えを含む）・前の明細の自分ルールだけ。
   * 今の明細での本人の確定・記入は使わないので、ツール仕分けと理由は最初の判定のまま残る。 */
  var res = rows.map(function (row) {
    var r = TG.prepRow(row);
    r.needsPurchaseDetails = TG.needsPurchaseDetails(row, r, pp);
    return r;
  });
  TG.markDuplicates(rows, res);
  TG.markRecurring(rows, res);
  rows.forEach(function (row, i) {
    TG.decide(row, res[i], pp, ctx, rows, res, false);
    TG.checkPurposeConflict(row, res[i]);
  });
  rows.forEach(function (row, i) { if (res[i].cat === undefined) TG.decide(row, res[i], pp, ctx, rows, res, true); });
  rows.forEach(function (row, i) {
    var r = res[i];
    r.question = TG.questionFor(row, r);
    /* 理由に使ったプロフィールの手がかり（一覧で、手がかりから明細をたどるため） */
    var used = r.rule === 'work-word' ? r.actSig : (r.rule === 'income-match' ? r.paySig : r.linkSig);
    r.sigIds = used ? [used.id || 'receive'] : [];
    if (r.rule === 'transport' && ['ic','charge','purchase'].indexOf(r.transport) >= 0) r.typeLabel = { ic: 'ICの利用', charge: 'チャージ', purchase: 'ICでの買い物' }[r.transport];
    else if (r.rule === 'purpose-conflict') r.typeLabel = '支払い';
    else if (r.rule === 'material' || r.rule === 'material-mixed') r.typeLabel = '制作材料';
    else r.typeLabel = r.type ? (r.type.id === 'refund' && r.base ? r.base.label + 'の返金' : (r.lbl || r.type.label)) : '種類不明';
    if (row.amountBad !== undefined) r.notes.push({ kind: 'parse', text: '金額「' + TG.reasonExcerpt(row.amountBad) + '」を読み取れませんでした（書き出しは元のまま）。', short: '金額を読めません' });
    else if (row.amountDecorated) r.notes.push({ kind: 'format', text: '元の金額表記は「' + TG.reasonExcerpt(row.raw.amount) + '」です（' + TG.yen(row.amount) + '円として読み取りました）。', short: '' });
    if (!row.date) r.notes.push({ kind: 'parse', text: '日付「' + TG.reasonExcerpt(row.raw.date) + '」を読み取れませんでした（書き出しは元のまま）。', short: '日付を読めません' });
    else if (row.date.assumedYear) r.notes.push({ kind: 'format', text: '日付に年がないため、' + row.date.y + '年として表示しています（書き出しは元のまま）。', short: '' });
  });
  return res;
};

/* -------------------------------------------------------------------------
 * 明細を読んだあとの「追加の質問」
 *   明細にある種類のうち、プロフィールで答えが出ておらず、
 *   答え次第で区分が変わる明細があるものだけを、影響の大きい順に出す
 * ------------------------------------------------------------------------- */
TG.topicQuestions = function (rows, res, profile, answers, ctx, skipped) {
  answers = answers || {}; skipped = skipped || {};
  var out = [], pp = TG.parseProfile(profile, answers);
  TG.TOPICS.forEach(function (tp) {
    if (answers[tp.id] || skipped[tp.id]) return;
    /* プロフィールに答えがすでにあるもの（その手がかりがある・その種類に直接つながる記述がある）は聞かない */
    if (pp.sigs.some(function (s) { return s.id === tp.signal; })) return;
    if (tp.types.some(function (t) { var b = pp.byType[t]; return b && (b.direct.length || b.neg.length); })) return;
    var idx = [];
    rows.forEach(function (row, i) {
      var r = res[i];
      if (!r.type || tp.types.indexOf(r.type.id) < 0) return;
      if (r.rule !== 'table' && r.rule !== 'large' && r.rule !== 'neg') return;
      if (r.link === 'direct' || r.link === 'neg') return;
      idx.push(i);
    });
    if (!idx.length) return;
    var sub = idx.map(function (i) { return rows[i]; });
    var yes = {}, no = {};
    Object.keys(answers).forEach(function (k) { yes[k] = answers[k]; no[k] = answers[k]; });
    yes[tp.id] = 'yes'; no[tp.id] = 'no';
    var ry = TG.classifyAll(sub.map(function (x, k) { var c = Object.assign({}, x); c.idx = k; return c; }), TG.parseProfile(profile, yes), ctx);
    var rn = TG.classifyAll(sub.map(function (x, k) { var c = Object.assign({}, x); c.idx = k; return c; }), TG.parseProfile(profile, no), ctx);
    var changed = [], ifYes = [], ifNo = [], yesTo = {}, noTo = {};
    idx.forEach(function (i, k) {
      var cur = res[i].cat;
      if (ry[k].cat !== cur) { ifYes.push(i); yesTo[ry[k].cat] = (yesTo[ry[k].cat] || 0) + 1; }
      if (rn[k].cat !== cur) { ifNo.push(i); noTo[rn[k].cat] = (noTo[rn[k].cat] || 0) + 1; }
      if (ry[k].cat !== cur || rn[k].cat !== cur) changed.push(i);
    });
    if (!changed.length) return;
    var amount = 0; changed.forEach(function (i) { amount += rows[i].amount || 0; });
    out.push({ topic: tp, rows: idx, changed: changed, ifYes: ifYes, ifNo: ifNo, yesTo: yesTo, noTo: noTo, amount: amount, examples: idx.slice(0, 3).map(function (i) { return rows[i].raw.desc; }) });
  });
  out.sort(function (a, b) { return (b.amount - a.amount) || (b.changed.length - a.changed.length); });
  return out.slice(0, TG.MAX_TOPIC_QUESTIONS);
};

/* 区分ごとの件数・確定の件数 */
TG.tally = function (rows, res, decisions) {
  var t = { biz: { n: 0, done: 0, sum: 0 }, ask: { n: 0, done: 0, sum: 0 }, pvt: { n: 0, done: 0, sum: 0 }, all: rows.length, done: 0, finalBiz: 0, finalPvt: 0 };
  rows.forEach(function (row, i) {
    var c = res[i].cat, d = decisions[row.key];
    t[c].n++; t[c].sum += row.amount || 0;
    if (d && (d.final === 'biz' || d.final === 'pvt')) {
      t[c].done++; t.done++;
      if (d.final === 'biz') t.finalBiz++; else t.finalPvt++;
    }
  });
  return t;
};

/* ---- 50_export.js ---- */
/* =========================================================================
 * 50_export.js  CSVの書き出しと、書き出す前の照合
 *
 * 列は 日付・摘要・金額・ツール仕分け・最終区分・理由 の6列。
 * 日付・摘要・金額は元のセルのまま（銀行の入金も元の表記）。
 * ツール仕分けと理由の前半は、最初の判定のまま。要判断の確定と候補からの変更は理由の「確定：」に、本人の記入・メモは理由の最後に書く。
 * 候補どおりの確定は「最終区分」の列で分かるので、理由には書かない。
 * 書き出す前に、作ったCSVを自分のパーサーで読み直して、入力と1行ずつ照合する。
 * ========================================================================= */

TG.CSV_HEADER = ['日付', '摘要', '金額', 'ツール仕分け', '最終区分', '理由'];

TG.csvFinalLabel = function (d) {
  if (!d || (d.final !== 'biz' && d.final !== 'pvt')) return '';
  return TG.CAT[d.final].final;
};

TG.csvCell = function (s) {
  s = String(s === null || s === undefined ? '' : s);
  return (/[",\r\n]/.test(s) || /^\s|\s$/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s;
};

/* 禁止表現を探す（必須表示の文言は除く）。見つかった言葉の一覧を返す */
TG.findBanned = function (text) {
  var t = String(text || '').split(TG.DISCLAIMER).join('');
  return TG.BANNED.filter(function (w) { return t.indexOf(w) >= 0; });
};

/* 「理由」の列：ツールの理由 ＋ 注意 ＋ 確定（本人の確定・記入した品名・メモ）
 * withPerson === false のときは、ツールが作った部分だけ（禁止表現の検査用） */
TG.reasonForCsv = function (row, r, d, withPerson) {
  var parts = [r.long];
  var sourceNotes = TG.purchaseNotes(row).map(TG.reasonExcerpt).filter(function (text) { return !r.long.includes(text); });
  if (sourceNotes.length) parts.push('元明細の補足：' + sourceNotes.join(' ／ '));
  if ((r.rule === 'table' || r.rule === 'neg') && r.quoted.length && !r.long.includes(TG.readFrom(r))) {
    parts.push(TG.readFrom(r) + '「' + r.typeLabel + '」と推定。');
  }
  var notes = r.notes.filter(function (n) { return n.kind === 'dup' || n.kind === 'refunded' || n.kind === 'parse'; }).map(function (n) { return n.text; });
  if (notes.length) parts.push('注意：' + notes.join(''));
  var finalLabel = TG.csvFinalLabel(d);
  if (finalLabel) {
    var changed = (r.cat === 'biz' && d.final === 'pvt') || (r.cat === 'pvt' && d.final === 'biz');
    /* 候補どおりの確定は「最終区分」の列で分かるので、理由には書かない。要判断の確定と、候補からの変更だけを書く。 */
    if (r.cat === 'ask' || changed) parts.push('確定：本人が「' + finalLabel + '」に確定' + (r.cat === 'ask' ? '（要判断を確認）' : '（ツールの候補から変更）') + '。');
    if (withPerson !== false) {
      if (d.purchase && d.purchase.item) parts.push('本人の記入：購入品「' + d.purchase.item + '」。');
      if (d.memo) parts.push('本人メモ：' + d.memo);
    }
  }
  return parts.join(' ');
};

TG.buildCsv = function (rows, res, decisions, opts) {
  opts = opts || {};
  var lines = [TG.CSV_HEADER.join(',')];
  rows.forEach(function (row, i) {
    var r = res[i], d = decisions[row.key];
    lines.push([row.raw.date, row.raw.desc, row.raw.amount, TG.CAT[r.cat].label, TG.csvFinalLabel(d), TG.reasonForCsv(row, r, d)].map(TG.csvCell).join(','));
  });
  return (opts.bom === false ? '' : '﻿') + lines.join('\r\n') + '\r\n';
};

/* 書き出す前の照合 */
TG.verifyCsv = function (csvText, rows, res, decisions) {
  var problems = [];
  var table = TG.parseCSV(csvText.replace(/^﻿/, ''), ',');
  var head = table[0] || [], expected = TG.CSV_HEADER;
  if (head.length !== expected.length || expected.some(function (name, j) { return head[j] !== name; })) problems.push('見出しの行が「' + expected.join('／') + '」になっていません。');
  var body = table.slice(1);
  if (body.length !== rows.length) problems.push('行数が一致しません（読み込み ' + rows.length + ' 行／書き出し ' + body.length + ' 行）。');
  var candidates = ['事業候補', '私用候補', '要判断'];
  rows.forEach(function (row, i) {
    var b = body[i];
    if (!b) return;
    var at = (i + 1) + '行目';
    if (b.length !== expected.length) problems.push(at + '：列の数が' + expected.length + 'ではありません。');
    if (b[0] !== row.raw.date) problems.push(at + '：日付が元と一致しません。');
    if (b[1] !== row.raw.desc) problems.push(at + '：摘要が元と一致しません。');
    if (b[2] !== row.raw.amount) problems.push(at + '：金額が元の表記と一致しません。');
    if (candidates.indexOf(b[3]) < 0) problems.push(at + '：ツール仕分けが3区分のどれでもありません。');
    else if (b[3] !== TG.CAT[res[i].cat].label) problems.push(at + '：ツール仕分けが画面の候補と一致しません。');
    var decision = decisions[row.key];
    var finalLabel = TG.csvFinalLabel(decision);
    if (!finalLabel || !b[4]) problems.push(at + '：最終区分が確定していません。');
    else if (b[4] !== finalLabel) problems.push(at + '：最終区分が本人の確定と一致しません。');
    if (!b[5]) problems.push(at + '：理由が空です。');
    else if (decision && b[5] !== TG.reasonForCsv(row, res[i], decision)) problems.push(at + '：理由がこの行の仕分け・本人の確定と一致しません。');
  });
  /* 禁止表現はツールが作った文に対して検査する。本人の記入とメモは、そのまま残す。 */
  var toolText = rows.map(function (row, i) { return TG.reasonForCsv(row, res[i], decisions[row.key], false) + ' ' + TG.CAT[res[i].cat].label; }).join('\n');
  var banned = TG.findBanned(toolText);
  if (banned.length) problems.push('ツールの文に使わない言葉が含まれています：' + banned.join('、'));
  return { ok: problems.length === 0, problems: problems, rowsOut: body.length, rowsIn: rows.length };
};

/* 出力ファイル名：元のファイル名_仕分け結果.csv */
TG.outName = function (name) {
  var base = String(name || '明細').replace(/\.(csv|txt|tsv|xlsx|xlsm)$/i, '');
  return base + '_仕分け結果.csv';
};

/* ---- 60_store.js ---- */
/* =========================================================================
 * 60_store.js  状態・保存（この端末のブラウザの localStorage だけ）・自分ルール
 * ========================================================================= */

TG.KEY = 'tegakari-shiwake.v1';
TG.defaultState = function () {
  return {
    v: 1,
    profile: { job: '', tools: '', places: '', other: '' },
    answers: {}, skipTopics: {},
    ds: null,          /* 読み込んだ明細 { id, name, encoding, text, opts, includeSummary, loadedAt } */
    dec: {},           /* 本人の確定 { 行のキー: { final: 'biz'|'pvt', memo, at, via, purchase: { item } } } */
    purchaseDetails: {}, /* 確定前の下書き（店名だけの明細の購入品・メモ）。行番号が同じ別ファイルへ持ち越さない。 */
    purchaseDetailsFor: null,
    rules: [],         /* 自分ルール（確定した店の記録） */
    useRules: true,
    view: 'intro', lane: 'ask', bom: true,   /* 初めて開いたときは、何ができるかの案内から */
    exported: null
  };
};
TG.load = function () {
  try {
    var t = window.localStorage.getItem(TG.KEY);
    if (t) {
      var s = JSON.parse(t);
      if (s && s.v === 1) {
        var d = TG.defaultState();
        Object.keys(s).forEach(function (k) { d[k] = s[k]; });
        TG.migrate(d);
        return d;
      }
    }
  } catch (e) { TG.storageError = true; }
  return TG.defaultState();
};
/* 以前の版で保存した「内訳」「用途の回答」は、事業・私用の確定と、メモ・購入品の記入に読み替える。
 * 最終区分を選んでいない内訳は未確認に戻し、書いた内容は下書きに残す。 */
TG.migrate = function (d) {
  d.dec = d.dec && typeof d.dec === 'object' ? d.dec : {};
  d.purchaseDetails = d.purchaseDetails && typeof d.purchaseDetails === 'object' ? d.purchaseDetails : {};
  Object.keys(d.dec).forEach(function (k) {
    var x = d.dec[k];
    if (!x || typeof x !== 'object') { delete d.dec[k]; return; }
    var item = x.purchase && typeof x.purchase.item === 'string' ? x.purchase.item.trim() : '';
    var memo = typeof x.memo === 'string' ? x.memo : '';
    var final = x.final;
    if (final === 'split') {
      var a = x.split || {};
      var note = '内訳の記録：仕事用 ' + TG.yen(a.biz) + '円・私用 ' + TG.yen(a.pvt) + '円';
      memo = memo ? memo + ' ／ ' + note : note;
      final = x.exportFinal;
      if (final !== 'biz' && final !== 'pvt') {
        delete d.dec[k];

TG.setPurchaseDraft = function (key, item, memo) {

  if (!D.res[i].needsPurchaseDetails && !prev.item) return false;

  if (r.transport || r.needsPurchaseDetails || r.rule === 'purpose-conflict' || !r.tokens || !r.tokens.length) return;

  /* ---------- ② 明細の読み込み ---------- */

  var FILE_ACCEPT = '.csv,.tsv,.txt,.xlsx,.xlsm,text/csv,text/plain,text/tab-separated-values,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel.sheet.macroEnabled.12';

      '<li>期間（月）を選んで、「CSV」や「ダウンロード」のボタンで保存します。PDFしか見当たらないときは、同じ画面に「CSV」の選択肢がないか探してください。</li>' +

      '<p class="lane-d" style="margin:8px 0 0">「摘要（てきよう）」は、明細の「ご利用店名」「お取引内容」のように、どこで何に使ったかが書かれた欄のことです。</p></div></details>' +

  function fileFail(text, guide) {
    TG.lastError = text; TG.lastErrorGuide = !!guide;
    if (S.view !== 'statement') S.view = 'statement';
    render();
    var e = $('#view .err'); if (e) e.scrollIntoView({ block: 'center' });
  }
  var fileRequest = 0;
  var lastExportCsv = null;

  function csvDigest(csv) {
    if (!window.crypto || !window.crypto.subtle) return Promise.resolve(null);
    return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(csv)).then(function (bytes) {
      return Array.from(new Uint8Array(bytes), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    }).catch(function () { return null; });
  }
  function hasCurrentExport() {
    if (!S.exported || D.tally.done !== D.tally.all) return Promise.resolve(false);
    var csv = TG.buildCsv(D.rows, D.res, S.dec, { bom: false });
    if (lastExportCsv !== null) return Promise.resolve(csv === lastExportCsv);
    var digest = S.exported.digest;
    if (!digest) return Promise.resolve(false);
    return csvDigest(csv).then(function (value) { return value === digest; });
  }
  /* force：「サンプルで試す」で、置き換えの確認を済ませてから読み込むとき */
  async function handleFile(file, force) {
    if (!file) return;
    var request = ++fileRequest;
    if (file.size > 15 * 1024 * 1024) { fileFail(TG.FILE_MESSAGES.big, true); return; }
    try {
      var buf = await (file.arrayBuffer ? file.arrayBuffer() : new Promise(function (ok, ng) { var fr = new FileReader(); fr.onload = function () { ok(fr.result); }; fr.onerror = ng; fr.readAsArrayBuffer(file); }));
      if (request !== fileRequest) return;
      /* ファイルの種類を見分ける（PDF・画像などは、ここで案内を出して止める）。Excel は CSV の文字列に直す */
      var dec = await TG.openFile(buf, file.name);
      if (request !== fileRequest) return;
      var st = TG.readText(dec.text, file.name, dec.encoding, {});
      /* 明細の行がない・日付と金額を読めない行が大半・行が多すぎるときは、仕分けの前で止める */
      var stop = TG.checkStatement(st, file.name);
      if (stop) { fileFail(stop, true); return; }
      function replace() {
        if (request !== fileRequest) return;
        lastExportCsv = null;
        TG.lastError = null; TG.lastErrorGuide = false;
        S.ds = { id: 'd' + Date.now().toString(36), name: file.name, encoding: dec.encoding, text: dec.text, source: dec.source || null, opts: {}, includeSummary: false, loadedAt: Date.now() };
        S.dec = {}; S.purchaseDetails = {}; S.skipTopics = {}; S.exported = null; S.lane = 'ask';
        TG.hl = null;
        TG.recompute(); D = TG.D;
        S.view = 'board';
        save(true); render();
        window.scrollTo(0, 0);
        var ruled = D.res.filter(function (r) { return r.rule === 'rule'; }).length;
        toast((S.ds.source && S.ds.source.sheet ? 'Excelのシート「' + S.ds.source.sheet + '」から、' : '') + D.rows.length + '件を読み込み、仕分けました。' + (ruled ? '覚えた店から ' + ruled + '件を候補にしています。' : ''));
        if (D.st.analysis.confidence !== 'high' || D.st.analysis.signNeedsReview) openImport(true);
        else { var h = $('#view h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
      }
      var t = D.tally;
      var hasDetails = Object.keys(S.purchaseDetails || {}).length > 0 || !!(S.ds && Object.keys(S.ds.transitHeld || {}).length);
      if (force || !S.ds || (!t.done && !hasDetails) || await hasCurrentExport()) { replace(); return; }
      if (request !== fileRequest) return;
      confirmDlg('別の明細を読み込みますか？', '今の明細（' + esc(S.ds.name) + '）は ' + t.done + '/' + t.all + '件を確定しています。続けると、この明細の確定区分・記録待ち・メモ・購入品の記入をこの画面から取り出せなくなります。', '読み込む', replace);
    } catch (e) {
      if (request === fileRequest) fileFail(e && e.guide ? e.message : '「' + file.name + '」を読み込めませんでした（' + (e && e.message ? e.message : e) + '）。明細のCSVかどうか、確かめてください。', true);
    }
  }

      '<button type="button" class="btn link" data-act="how">仕分けの決まり</button></span></div>' +

      '<div class="lane-tabs" role="tablist" aria-label="区分">' + ['biz', 'ask', 'pvt'].map(function (c) { return '<button type="button" role="tab" class="' + c + '" aria-selected="' + (S.lane === c) + '" data-act="lane" data-lane="' + c + '">' + TG.CAT[c].label + '<small>' + t[c].n + '件・確定' + t[c].done + '</small></button>'; }).join('') + '</div>' +

  function progressHtml(t) {
