<title>てがかり仕分け｜副業の明細を、事業候補・要判断・私用候補に</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D2026'/%3E%3Crect x='6' y='9' width='5' height='15' rx='2.5' fill='%237FA6F2'/%3E%3Crect x='13.5' y='6' width='5' height='18' rx='2.5' fill='%23F2B53A'/%3E%3Crect x='21' y='12' width='5' height='12' rx='2.5' fill='%2373C69B'/%3E%3C/svg%3E">
<style>
/* =========================================================================
 * てがかり仕分け  style.css
 *   色は3区分（事業＝青／要判断＝琥珀／私用＝緑）だけに使い、
 *   区分は「色・アイコン・ラベル・位置（左・中央・右）」の4つで見分けられるようにする。
 * ========================================================================= */
:root {
  --bg: #F5F4EF; --surface: #FFFFFF; --sunken: #EFEDE6;
  --ink: #1D2026; --ink-2: #434851; --muted: #636975; --line: #E1DED5; --line-2: #CFCBC0;
  --biz: #1F57C3; --biz-ink: #16409A; --biz-bg: #EAF1FD; --biz-line: #A8C2F0;
  --ask: #965700; --ask-ink: #774400; --ask-bg: #FFF4DC; --ask-line: #EFC56C; --ask-strong: #D99A0B;
  --pvt: #1C7650; --pvt-ink: #155C3D; --pvt-bg: #E5F3EB; --pvt-line: #9CCFB3;
  --primary: #1D2026; --primary-ink: #FFFFFF;
  --focus: #1F57C3;
  --r: 12px; --r-sm: 8px;
  --sh: 0 1px 2px rgba(29, 32, 38, .06), 0 6px 16px rgba(29, 32, 38, .05);
  --sh-lg: 0 10px 40px rgba(29, 32, 38, .18);
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, -apple-system, sans-serif;
  --mono: "BIZ UDGothic", "Osaka-Mono", "MS Gothic", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.65; font-feature-settings: "palt" 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- ヘッダー・必須表示・進み具合 ---------- */
.app-header { background: var(--surface); border-bottom: 1px solid var(--line); }
.hd-in { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: .02em; white-space: nowrap; }
.brand-tag { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.hd-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--ink-2); min-height: 32px; }
.chip-btn:hover { background: var(--sunken); }
.chip-btn svg { width: 15px; height: 15px; }
.chip-btn .n { font-weight: 700; color: var(--ink); }

.notice { background: #EDEFF3; border-bottom: 1px solid #DADDE3; }
.notice-in { max-width: 1240px; margin: 0 auto; padding: 8px 20px; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #2F343C; line-height: 1.55; }
.notice svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: #4A5260; }

.steps { max-width: 1240px; margin: 0 auto; padding: 14px 20px 0; display: flex; gap: 6px; list-style: none; flex-wrap: wrap; }
.steps li { flex: 1 1 0; min-width: 120px; }
.steps button { width: 100%; display: flex; align-items: center; gap: 8px; background: none; border: 0; border-top: 3px solid var(--line-2); padding: 8px 2px 4px; text-align: left; color: var(--muted); font-size: 13px; }
.steps .no { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--sunken); color: var(--ink-2); flex: none; }
.steps .no svg { width: 14px; height: 14px; }
.steps li.done button { border-top-color: var(--ink-2); color: var(--ink-2); }
.steps li.done .no { background: var(--ink-2); color: #fff; }
.steps li.cur button { border-top-color: var(--ink); color: var(--ink); font-weight: 700; }
.steps li.cur .no { background: var(--ink); color: #fff; }
.steps button:disabled { cursor: default; opacity: .75; }

main { max-width: 1240px; margin: 0 auto; padding: 18px 20px 60px; }
.view h1 { font-size: 24px; line-height: 1.4; margin: 4px 0 6px; letter-spacing: .01em; }
.lead { color: var(--ink-2); margin: 0 0 14px; max-width: 760px; }

/* ---------- ボタン ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); padding: 8px 14px; min-height: 40px; font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--sunken); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { background: #343944; }
.btn.primary:disabled, .btn:disabled { background: #D8D5CD; border-color: #D8D5CD; color: #5D626B; cursor: not-allowed; }
.btn.big { min-height: 52px; padding: 10px 22px; font-size: 16px; border-radius: 12px; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn.link { border: 0; background: none; padding: 4px 2px; min-height: 32px; color: var(--biz-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.btn.link:hover { background: none; color: var(--ink); }
.btn.biz { background: var(--biz); border-color: var(--biz); color: #fff; }
.btn.biz:hover { background: var(--biz-ink); }
.btn.pvt { background: var(--pvt); border-color: var(--pvt); color: #fff; }
.btn.pvt:hover { background: var(--pvt-ink); }
.btn.ask { background: var(--ask-bg); border-color: var(--ask-line); color: var(--ask-ink); }

/* ---------- 区分の印（色・アイコン・ラベル） ---------- */
.cat { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 10px 1px 7px; font-size: 12.5px; font-weight: 700; border: 1px solid; white-space: nowrap; line-height: 1.6; }
.cat svg { width: 14px; height: 14px; }
.cat.biz { color: var(--biz-ink); background: var(--biz-bg); border-color: var(--biz-line); }
.cat.ask { color: var(--ask-ink); background: var(--ask-bg); border-color: var(--ask-line); }
.cat.pvt { color: var(--pvt-ink); background: var(--pvt-bg); border-color: var(--pvt-line); }
.final { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.final svg { width: 14px; height: 14px; }
.final.biz { color: var(--biz-ink); }
.final.pvt { color: var(--pvt-ink); }
.final.open { color: var(--muted); font-weight: 600; }

/* ---------- 案内（初めて開いたとき）：何ができるか・流れ・出来上がるCSV ---------- */
.view.intro { padding-top: 6px; }
.intro-hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 28px; align-items: center; margin: 6px 0 26px; }
.intro-kicker { margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--ask-ink); letter-spacing: .06em; }
.view.intro h1 { font-size: 30px; line-height: 1.35; margin: 0 0 10px; }
.nw { display: inline-block; }   /* 言葉の途中で折り返さない */
.view.intro .lead { font-size: 16px; max-width: 560px; }
.intro-cta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 8px; }
.intro-sample { margin: 0; font-size: 12.5px; color: var(--muted); }
.intro-safe { display: flex; gap: 8px; align-items: flex-start; margin: 14px 0 0; font-size: 13px; color: var(--ink-2); }
.intro-safe svg { width: 16px; height: 16px; flex: none; margin-top: 3px; }
.intro-demo { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--sh); min-width: 0; }
.intro-demo figcaption { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.intro-demo ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.intro-demo .hint { margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); }
.ix { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 8px 14px; position: relative; background: #FCFCFB; min-width: 0; }
.ix::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 10px 0 0 10px; }
.ix.biz::before { background: var(--biz); } .ix.ask::before { background: var(--ask-strong); } .ix.pvt::before { background: var(--pvt); }
.ix-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.ix .cd { font-size: 12px; color: var(--muted); white-space: nowrap; }
.ix .cn { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ix .ca { font-weight: 700; font-size: 14px; white-space: nowrap; }
.ix-out { display: flex; gap: 8px; align-items: center; margin-top: 4px; min-width: 0; }
.ix-out .cw { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.intro-h2 { font-size: 17px; margin: 0 0 10px; }
.intro-steps { list-style: none; margin: 0 0 18px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.intro-steps li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.intro-steps .no { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--ink); color: #fff; font-weight: 700; font-size: 13px; }
.intro-steps b { font-size: 15px; }
.intro-steps li > span:last-child { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
.intro-out { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.intro-out-l { font-weight: 700; color: var(--ink-2); margin-right: 4px; }
.intro-out .col { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 1px 8px; font-size: 12.5px; }

/* ---------- プロフィール ---------- */
.intro-actions { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: 0 0 18px; }
.intro-actions .sep { color: var(--muted); font-size: 13px; }
.pf-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
.pf-form { display: grid; gap: 14px; }
.pf-more > div { display: grid; gap: 12px; margin-top: 8px; }
.pf-more summary, .rv-evidence summary { width: fit-content; cursor: pointer; font-weight: 700; padding: 7px 2px; color: var(--ink-2); }
.pf-side { display: grid; gap: 14px; position: sticky; top: 14px; }
.pf-side .pf-next { margin: 0; padding: 0; border: 0; }
.pf-next .hint { margin: 0; }
.saved-answers { display: grid; gap: 6px; }
.saved-answers h2 { margin: 0; font-size: 16px; }
.saved-answers .hint { margin: 0; }
.saved-answers label { margin-top: 6px; }
.saved-answers select { justify-self: start; min-height: 36px; font: inherit; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; box-shadow: var(--sh); }
.field label.q { display: flex; gap: 10px; align-items: baseline; font-weight: 700; font-size: 15.5px; margin-bottom: 8px; }
.field .qn { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--ink); color: #fff; font-size: 13px; flex: none; transform: translateY(2px); }
.field textarea { width: 100%; border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 9px 11px; background: #FCFCFA; resize: vertical; min-height: 44px; line-height: 1.6; }
.field textarea:focus { outline: 3px solid rgba(31, 87, 195, .25); border-color: var(--biz); outline-offset: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips .lbl { font-size: 12px; color: var(--muted); align-self: center; margin-right: 2px; }
.add-chip { border: 1px dashed var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--ink-2); min-height: 30px; }
.add-chip:hover { border-style: solid; background: var(--sunken); }
/* 右の欄は画面に収め、手がかりの一覧だけを中でスクロールさせて「次へ」を常に見えるようにする */
.pf-read { position: sticky; top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 16px; display: flex; flex-direction: column; max-height: max(360px, calc(100vh - 380px)); }
#clue-panel { overflow: auto; min-height: 60px; flex: 1 1 auto; margin: 0 -6px; padding: 0 6px; }
.pf-next { flex: none; border-top: 1px solid var(--line); padding-top: 12px; }
.pf-read h2 { font-size: 15px; margin: 0 0 2px; }
.pf-read .sub { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
.clue-group { margin: 10px 0 0; }
.clue-group h3 { font-size: 12px; color: var(--muted); margin: 0 0 4px; font-weight: 700; letter-spacing: .04em; }
.clue-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.clue-list li { display: grid; grid-template-columns: fit-content(50%) minmax(0, 1fr); gap: 2px 8px; align-items: baseline; font-size: 13.5px; padding: 5px 8px; border-radius: 8px; background: #F8F7F3; }
.clue-list .cl { font-weight: 700; overflow-wrap: anywhere; }
.clue-list .cq { color: var(--ink-2); font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
.clue-list li.neg { background: #F3F1EC; }
.clue-list li.neg .cl { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-2); }
.clue-empty { font-size: 13px; color: var(--muted); background: #F8F7F3; border-radius: 8px; padding: 10px 12px; margin: 8px 0 0; }
.pf-next { margin-top: 14px; display: grid; gap: 6px; }
.pf-next .btn { width: 100%; }
.pf-next .hint { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* ---------- 明細の読み込み ---------- */
.drop { display: grid; place-items: center; gap: 8px; text-align: center; border: 2px dashed var(--line-2); border-radius: 16px; background: var(--surface); padding: 44px 20px; transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--biz); background: var(--biz-bg); }
.drop svg { width: 40px; height: 40px; color: var(--ink-2); }
.drop strong { font-size: 17px; }
.drop .or { color: var(--muted); font-size: 13px; }
.fine { color: var(--ink-2); font-size: 13.5px; padding-left: 1.2em; margin: 14px 0; }
.fine li { margin: 2px 0; }
.err { background: #FDECEC; border: 1px solid #F2B8B5; color: #8C1D18; border-radius: 10px; padding: 10px 14px; margin: 12px 0; font-size: 14px; }

/* ---------- 仕分けと確認（ボード） ---------- */
.bd-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 18px; align-items: center; margin-bottom: 12px; }
.bd-title { margin: 0; font-size: 22px; line-height: 1.4; }
.bd-file { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 2px; }
.bd-file .fn { font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.progress { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: flex; align-items: center; gap: 14px; box-shadow: var(--sh); }
.progress .pg-txt { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.progress .pg-txt b { font-size: 20px; color: var(--ink); }
.pg-bar { width: 160px; height: 10px; background: var(--sunken); border-radius: 99px; overflow: hidden; display: flex; }
.pg-bar span { display: block; height: 100%; }
.pg-bar .b { background: var(--biz); } .pg-bar .p { background: var(--pvt); }
.progress .pg-left { margin: 0; font-size: 13px; color: var(--ink-2); }
.progress .pg-left strong { color: var(--ink); font-size: 15px; }

.next { display: flex; align-items: center; gap: 14px; background: var(--ink); color: #fff; border-radius: var(--r); padding: 12px 16px; margin: 0 0 12px; }
.trip-work { margin: 0 0 14px; padding: 14px 16px; border: 1px solid var(--line-2); border-left: 4px solid var(--ask-ink); border-radius: var(--r); background: var(--ask-bg); }
.trip-work h2 { font-size: 17px; margin: 0; }
.trip-work h3 { font-size: 14px; margin: 8px 0 4px; }
.trip-start { padding-bottom: 10px; border-bottom: 1px solid var(--line-2); }
.trip-work p { margin: 4px 0 12px; font-size: 14px; }
.trip-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ride-followup { width: 100%; min-width: 0; }
.ride-followup > div { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line-2); overflow-wrap: anywhere; }
.ride-followup p { margin: 0 0 8px; }
.ride-correction dl { margin: 16px 0 0; border-top: 1px solid var(--line-2); }
.ride-correction dt { margin-top: 12px; font-weight: 700; }
.ride-correction dd { margin: 4px 0 16px; }
.ride-correction textarea { display: block; width: 100%; margin-top: 5px; padding: 8px 10px; font: inherit; border: 1px solid var(--line-2); border-radius: 8px; }
.ride-correction .hint:empty { display: none; }
.trip-actions + .trip-actions, .trip-pick + .trip-actions { margin-top: 10px; }
.trip-pick summary { cursor: pointer; font-weight: 600; }
.trip-actions .btn { min-height: 36px; white-space: normal; }
.next .nx-ic { width: 30px; height: 30px; border-radius: 50%; background: rgba(255, 255, 255, .14); display: grid; place-items: center; flex: none; }
.next .nx-ic svg { width: 18px; height: 18px; }
.next .nx-t { font-weight: 700; font-size: 15.5px; }
.next .nx-s { font-size: 13px; opacity: .86; }
.next .btn { margin-left: auto; background: #fff; color: var(--ink); border-color: #fff; white-space: nowrap; }
.next .btn:hover { background: #ECEAE3; }
.next.done { background: var(--pvt-ink); }

.qcard { background: var(--surface); border: 1px solid var(--ask-line); border-left: 6px solid var(--ask-strong); border-radius: var(--r); padding: 12px 16px; margin: 0 0 12px; box-shadow: var(--sh); }
.qcard .qh { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ask-ink); font-weight: 700; }
.qcard .qh svg { width: 16px; height: 16px; flex: none; }
.qcard .qq { font-size: 16.5px; font-weight: 700; margin: 4px 0 2px; }
.qcard .qi { font-size: 13px; color: var(--ink-2); margin: 0 0 10px; }
.qcard .qb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qcard .qb .btn.link { margin-left: auto; }

.clues { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 14px; font-size: 13px; color: var(--ink-2); }
.clues .ttl { font-weight: 700; color: var(--ink); margin-right: 2px; }
.clue { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; min-height: 28px; display: inline-flex; gap: 5px; align-items: center; }
.clue .k { color: var(--muted); font-weight: 700; }
.clue[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.clue[aria-pressed="true"] .k { color: #fff; }
.clue.neg { text-decoration: line-through; }
.clue.zero { border-style: dashed; color: var(--muted); }
.tool-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin: -4px 0 12px; }
.tool-row .hint { font-size: 12.5px; color: var(--ink-2); }
.bd-more { margin: 0 0 12px; }
.bd-more summary { width: fit-content; cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--ink-2); padding: 4px 2px; }
.bd-more .clues { margin: 6px 0 0; }
.toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 600; min-height: 32px; color: var(--ink-2); }
.toggle[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.toggle svg { width: 14px; height: 14px; }
.rule-tbl { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0 12px; }
.rule-tbl th, .rule-tbl td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.rule-tbl thead th { background: #F4F2EC; }
.rule-tbl td .cat { font-size: 12px; }
.rule-tbl small { display: block; color: var(--ink-2); font-size: 11.5px; margin-top: 2px; }
.ol { padding-left: 1.3em; margin: 4px 0 10px; font-size: 13.5px; }
.ol li { margin: 3px 0; }

.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.lane { background: var(--sunken); border-radius: 14px; padding: 10px; min-width: 0; border-top: 5px solid; }
.lane.biz { border-top-color: var(--biz); }
.lane.ask { border-top-color: var(--ask-strong); background: #F6EFDD; }
.lane.pvt { border-top-color: var(--pvt); }
.lane-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 6px; flex-wrap: wrap; }
.lane-h .li { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.lane-h .li svg { width: 18px; height: 18px; }
.lane.biz .li { background: var(--biz); color: #fff; } .lane.ask .li { background: var(--ask-strong); color: #2B1A00; } .lane.pvt .li { background: var(--pvt); color: #fff; }
.lane-h h2 { margin: 0; font-size: 17px; display: flex; align-items: baseline; gap: 6px; }
.lane-h h2 .n { font-size: 20px; }
.lane-h .ls { font-size: 12.5px; color: var(--ink-2); }
.lane-h .btn { margin-left: auto; }
.lane-d { font-size: 12.5px; color: var(--ink-2); margin: 0 4px 8px; line-height: 1.5; }
.lane-bar { height: 4px; background: rgba(0, 0, 0, .07); border-radius: 9px; margin: 0 4px 10px; overflow: hidden; }
.lane-bar span { display: block; height: 100%; background: var(--ink-2); }
/* button は中身の幅（nowrap の摘要）を最小幅にするため、列からはみ出す。最小幅を 0 にして列の幅に収める */
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; }
.cards > * { min-width: 0; }
.lane-empty { font-size: 13px; color: var(--ink-2); text-align: center; padding: 16px 8px; border: 1px dashed var(--line-2); border-radius: 10px; }

.card { display: block; width: 100%; min-width: 0; max-width: 100%; overflow: hidden; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 8px 12px; position: relative; box-shadow: 0 1px 1px rgba(0, 0, 0, .03); transition: box-shadow .15s, transform .15s, opacity .2s; }
.card:hover { box-shadow: var(--sh); }
.card .c1 { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
.card .cd { font-size: 12px; color: var(--muted); white-space: nowrap; }
.card .cn { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .ca { font-weight: 700; font-size: 14px; white-space: nowrap; }
.card .ca.in::before { content: "入金 "; font-size: 11px; color: var(--muted); font-weight: 600; }
.card .c2 { display: flex; gap: 6px; align-items: center; margin-top: 3px; min-width: 0; }
.card .ct { font-size: 11.5px; color: var(--ink-2); background: var(--sunken); border-radius: 5px; padding: 0 6px; white-space: nowrap; flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
.card .cw { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card .c3 { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.card .note { font-size: 11px; font-weight: 700; border-radius: 5px; padding: 0 6px; background: #FDECEC; color: #8C1D18; }
.card .note.soft { background: #EEF0F3; color: #3B414B; }
.card .st { margin-left: auto; }
.card[data-state="open"] { border-style: dashed; border-color: var(--line-2); }
.card[data-state="open"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 3px 3px 0; background: var(--line-2); }
.card[data-final="biz"]::before, .card[data-final="pvt"]::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 10px 0 0 10px; }
.card[data-final="biz"]::before { background: var(--biz); }
.card[data-final="pvt"]::before { background: var(--pvt); }
.card[data-final] { background: #FCFCFB; }
.card.moved { animation: moved 2.4s ease-out 1; }
@keyframes moved { 0% { box-shadow: 0 0 0 4px var(--ask-strong); } 100% { box-shadow: 0 0 0 0 transparent; } }
.lanes.hl .card { opacity: .38; }
.lanes.hl .card.hit { opacity: 1; box-shadow: 0 0 0 2px var(--ink); }

.lane-tabs { display: none; }

/* ---------- 書き出し ---------- */
.ex-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.ex-grid { grid-template-areas: "preview save"; }
.ex-box { grid-area: save; }
.ex-preview { grid-area: preview; min-width: 0; }
.checks { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.checks li svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.checks li.ok svg { color: var(--pvt); }
.checks li.ng svg { color: #B3261E; }
.checks li b { display: block; }
.checks li span { font-size: 13px; color: var(--ink-2); }
.ex-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--sh); position: sticky; top: 14px; }
.ex-box .btn.big { width: 100%; }
.ex-swaps { margin-top: 14px; border-top: 1px solid var(--line-2); padding-top: 10px; overflow-wrap: anywhere; }
.ex-swaps h2, .swap-preview h3 { margin: 0; font-size: 16px; }
.ex-swaps p { margin: 6px 0; font-size: 14px; }
.ex-swaps ul { list-style: none; margin: 0; padding: 0; max-height: 17rem; overflow-y: auto; }
.ex-swaps li { margin: 6px 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
.pair-line { display: block; }
.ref-label { display: block; font-size: 14px; font-weight: 700; margin: 8px 0 4px; }
.ref-search { display: flex; gap: 6px; }
.ref-search input { min-width: 0; flex: 1; padding: 6px 10px; border: 1px solid var(--line-2); border-radius: 8px; font: inherit; }
#ride-fare, #ride-time, .swap-number input { width: 100%; padding: 6px 10px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; }
.ride-time-field, .swap-number { display: grid; gap: 4px; margin-top: 6px; font-size: 14px; }
.ref-hit { background: var(--ask-bg); }
.ref-match { display: inline-block; font-weight: 700; }
.ex-swaps ul.with-clock { max-height: none; }
.ex-swaps .saved-caption { margin-bottom: 0; color: var(--ink-2); font-size: 13px; }
.ride-origin { min-width: 0; border: 0; border-top: 1px solid var(--line); margin: 10px 0 0; padding: 6px 0 0; }
.ride-origin legend { font-weight: 700; font-size: 14px; padding: 0; }
.ride-origin > div { display: flex; flex-wrap: wrap; gap: 6px; }
.origin-feedback:empty { display: none; }
.swap-origin { padding: 8px; border-left: 3px solid var(--line-2); }
#ride-ref-count { font-weight: 700; }
.ex-pending { padding: 8px 12px; background: var(--ask-bg); border-left: 3px solid var(--ask-ink); }
.swap-preview section { padding: 10px 0; border-top: 1px solid var(--line-2); }
.swap-preview dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 5px 0; }
.swap-preview dt { color: var(--ink-2); }
.swap-preview dd { margin: 0; overflow-wrap: anywhere; }
.ex-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
.ex-sum div { border-radius: 10px; padding: 8px 10px; }
.ex-sum .b { background: var(--biz-bg); color: var(--biz-ink); }
.ex-sum .p { background: var(--pvt-bg); color: var(--pvt-ink); }
.ex-sum b { font-size: 20px; display: block; }
.ex-opt { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; margin: 10px 0; }
.ex-opt input { margin-top: 4px; width: 18px; height: 18px; }
.ex-done { background: var(--pvt-bg); color: var(--pvt-ink); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 10px; }
.tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); max-height: 420px; }
table.pv { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.pv th, table.pv td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.pv th { background: #F4F2EC; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
table.pv td.r { text-align: right; white-space: nowrap; }
table.pv td.why { min-width: 300px; color: var(--ink-2); }
table.pv td.d, table.pv td.c { white-space: nowrap; }
table.pv td.n { min-width: 170px; }

/* ---------- ダイアログ ---------- */
dialog.dlg { border: 0; border-radius: 16px; padding: 0; width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 32px); box-shadow: var(--sh-lg); color: var(--ink); background: var(--surface); }
dialog.dlg::backdrop { background: rgba(20, 22, 26, .45); }
.dlg-in { display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.dlg-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.dlg-h h2 { margin: 0; font-size: 17px; }
.dlg-review .dlg-h h2 small { display: inline-block; white-space: nowrap; }
.dlg-h .x { margin-left: auto; border: 0; background: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
.dlg-h .x:hover { background: var(--sunken); }
.dlg-h .x svg { width: 20px; height: 20px; }
.dlg-b { padding: 16px 18px; overflow: auto; }
.dlg-f { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.dlg-f .grow { flex: 1; }
.kbd { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: #FAFAF8; color: var(--ink-2); }

.rv-meter { display: flex; gap: 3px; flex: 1; max-width: 220px; }
.rv-meter i { flex: 1; height: 6px; border-radius: 4px; background: var(--line); }
.rv-meter i.d { background: var(--ink-2); } .rv-meter i.c { background: var(--ask-strong); }
.rv-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: end; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.rv-date { font-size: 13px; color: var(--ink-2); }
.source-note { margin: 8px 0 0; padding: 7px 10px; border-left: 3px solid var(--line-2); background: var(--sunken); font-size: 13.5px; overflow-wrap: anywhere; }
.source-note b { margin-right: 4px; }
.source-note summary { cursor: pointer; padding: 4px 0; }
.rv-desc { font-size: 21px; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
.rv-read { font-size: 12.5px; color: var(--muted); }
.rv-amt { font-size: 24px; font-weight: 800; text-align: right; white-space: nowrap; grid-row: 1 / span 3; grid-column: 2; align-self: center; }
.rv-amt small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; text-align: right; }
.rv-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; grid-column: 1 / -1; }
.tag { font-size: 12px; border-radius: 6px; padding: 1px 8px; background: var(--sunken); color: var(--ink-2); font-weight: 600; }
.tag.warn { background: #FDECEC; color: #8C1D18; }
.rv-why { margin: 12px 0; }
.rv-why h3, .rv-sec h3 { font-size: 13px; margin: 0 0 4px; color: var(--ink-2); }
.rv-why p { margin: 0; font-size: 14.5px; }
.ride-pair { display: grid; justify-items: start; gap: 6px; margin: 10px 0; padding: 10px 12px; border-left: 3px solid var(--ask-ink); background: var(--ask-bg); font-size: 14px; }
.rv-evidence { margin: 0 0 12px; }
.rv-evidence summary { font-size: 13.5px; cursor: pointer; padding: 2px 0 6px; }
.rv-facts { margin: 0 0 8px; padding: 7px 12px; border-radius: 10px; background: var(--sunken); font-size: 13.5px; overflow-wrap: anywhere; }
.rv-facts b { margin-right: 8px; font-size: 12.5px; color: var(--ink-2); }
.scale { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
.scale .side { border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }
.scale .side h4 { margin: 0 0 4px; font-size: 12.5px; display: flex; gap: 5px; align-items: center; }
.scale .side h4 svg { width: 14px; height: 14px; }
.scale .side.biz { background: var(--biz-bg); } .scale .side.biz h4 { color: var(--biz-ink); }
.scale .side.pvt { background: var(--pvt-bg); } .scale .side.pvt h4 { color: var(--pvt-ink); }
.scale ul { margin: 0; padding-left: 1.1em; }
.scale li { margin: 2px 0; overflow-wrap: anywhere; }
.scale .none { color: var(--muted); font-size: 13px; }
.rv-sec { margin: 0 0 12px; }
.rv-sec ul { margin: 0; padding-left: 1.1em; font-size: 13.5px; color: var(--ink-2); }
/* 本文の最後：確定の前に書ける記入（購入品・メモ）。質問とボタンは下の固定欄（.rv-foot） */
.rv-q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.rv-q > .rv-opts:first-child { margin-top: 0; }
.rv-purchase { display: grid; gap: 6px; margin: 0 0 12px; padding: 0 0 12px; border-bottom: 1px solid var(--ask-line); }
.rv-purchase label { font-size: 14px; font-weight: 700; }
.rv-purchase label small { display: block; font-weight: 400; font-size: 12.5px; color: var(--ink-2); }
.rv-purchase input { width: 100%; min-width: 0; min-height: 44px; padding: 7px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.rv-purchase p { margin: 0; font-size: 13.5px; overflow-wrap: anywhere; }
.rv-purchase p:empty { display: none; }
.rv-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rv-btns .btn { flex-direction: column; gap: 0; min-height: 60px; font-size: 17px; }
.rv-btns .btn small { font-size: 12px; font-weight: 600; opacity: .92; }
.rv-btns .btn[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ink); }
/* 確認画面の下の固定欄：質問・事業／私用・前へ／あとで。本文をスクロールしても、いつでも押せる */
.dlg-f.rv-foot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); grid-template-areas: "q q" "nav btns"; gap: 8px 16px; align-items: center; background: #FBF7EC; }
.rv-foot .q { grid-area: q; margin: 0; font-weight: 800; font-size: 15.5px; line-height: 1.5; }
.rv-foot .rv-btns { grid-area: btns; }
.rv-foot .rv-btns .btn { min-height: 52px; font-size: 16px; }
.rv-nav { grid-area: nav; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rv-nav .grow { flex: 1; }
.btn > .key { margin-left: -6px; }   /* 「あとで（↓）」のように、ボタンの文字とキーの案内を続けて見せる */
.rv-opts { display: grid; gap: 8px; margin-top: 10px; font-size: 13.5px; }
.rv-opts label.same { display: flex; gap: 8px; align-items: flex-start; }
.rv-opts label.same input { width: 18px; height: 18px; margin-top: 3px; flex: none; }
.rv-opts .memo { display: grid; gap: 4px; }
.rv-opts .hint { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.rv-opts .memo input { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; width: 100%; background: #fff; }
.rv-done { text-align: center; padding: 26px 10px; }
.rv-done svg { width: 54px; height: 54px; color: var(--pvt); }
.rv-done h3 { font-size: 20px; margin: 8px 0 4px; }

.bulk-g { margin: 0 0 14px; }
.bulk-g h3 { font-size: 13px; margin: 0 0 6px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
.bulk-why { flex-basis: 100%; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.bulk-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; background: #FCFCFB; }
.bulk-row .bn { font-weight: 700; font-size: 14px; overflow-wrap: anywhere; }
.bulk-row .bm { font-size: 12.5px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 13px; font-weight: 700; min-height: 34px; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-pressed="true"].biz { background: var(--biz); color: #fff; }
.seg button[aria-pressed="true"].pvt { background: var(--pvt); color: #fff; }
.seg button[aria-pressed="true"].hold { background: var(--ink-2); color: #fff; }

.map-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.map-tbl th, .map-tbl td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: top; }
.map-tbl select { border: 1px solid var(--line-2); border-radius: 7px; padding: 4px 6px; min-height: 32px; background: #fff; }
.map-tbl .smp { color: var(--ink-2); max-width: 280px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13.5px; margin: 0 0 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.opt-row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13.5px; margin: 8px 0; }
.opt-row label { display: inline-flex; gap: 6px; align-items: center; }
.issue-list { font-size: 13px; color: var(--ink-2); padding-left: 1.2em; margin: 8px 0; }

/* 読み込み画面：読み込めないファイルの案内・サンプル・CSVの取り出し方 */
.err p { margin: 0; }
.err .err-next { margin-top: 4px; font-weight: 700; }
.st-sample { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 14px 0 0; font-size: 14px; color: var(--ink-2); }
.st-sample .hint { flex-basis: 100%; margin: 0; font-size: 12.5px; color: var(--muted); }
.howto { margin: 14px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 2px 16px; box-shadow: var(--sh); }
.howto[open] { padding-bottom: 14px; }
.howto summary { cursor: pointer; font-weight: 700; padding: 10px 0; }
.howto-b .ol { margin-top: 2px; }
.kind-tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 0; }
.kind-tbl th, .kind-tbl td { border-top: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top; }
.kind-tbl th { white-space: nowrap; color: var(--ink-2); width: 1%; }
/* 読み取り方：先頭の要約 */
.imp-sum { background: var(--biz-bg); border: 1px solid var(--biz-line); border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; }
.imp-sum .imp-h { margin: 0 0 4px; font-weight: 700; color: var(--biz-ink); }
.imp-sum ul { margin: 0; padding-left: 1.2em; font-size: 14px; }
.imp-sum li { margin: 2px 0; overflow-wrap: anywhere; }
.imp-warn { margin: 8px 0 0; padding: 6px 10px; background: var(--ask-bg); border-left: 3px solid var(--ask-ink); color: var(--ask-ink); font-size: 13.5px; }
.imp-act { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.map-tbl th small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
.imp-more { margin: 12px 0 0; }
.imp-more summary { cursor: pointer; font-weight: 700; color: var(--ink-2); padding: 6px 0; }
.imp-more .kv { margin-top: 6px; }
/* 書き出し画面：保存先・引き継ぎ */
.ex-where { font-size: 12.5px; margin: 8px 0 0; color: var(--ink-2); line-height: 1.55; }
.ex-keep { margin-top: 14px; border-top: 1px solid var(--line-2); padding-top: 10px; }
.ex-keep h2 { font-size: 14px; margin: 0 0 4px; }
.ex-keep p { font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px; line-height: 1.6; }

/* =========================================================================
 * 10_text.js  文字の正規化と、辞書の言葉の照合
 * ========================================================================= */

/* ひらがな → カタカナ */
TG.toKatakana = function (s) {
  return s.replace(/[ぁ-ゖ]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) + 0x60); });
};

/* 照合用の正規化：NFKC（半角カナ→全角、全角英数→半角、全角スペース→半角）→ カタカナ → 大文字 → 空白をまとめる */
TG.norm = function (s) {
  if (s === null || s === undefined) return '';
  var t = String(s);
  if (t.normalize) t = t.normalize('NFKC');
  t = TG.toKatakana(t).toUpperCase();
  t = t.replace(/[‐-―−－]/g, '-');
  /* 銀行明細のカナは長音を「-」で書くことがある（ｶ-ﾄﾞ → カード） */
  t = t.replace(/([ァ-ヺ])-(?=[ァ-ヺ])/g, '$1ー');
  return t.replace(/\s+/g, ' ').trim();
};

/* 空白・中点・記号を除いた形（「ドラッグ・ハナミズキ」と「ドラッグハナミズキ」を同じに見る） */
TG.compact = function (s) {
  return s.replace(/[\s・･\-_.,，、。'"’`]/g, '');
};

/* 表示用：半角カナなどを読みやすくしたもの（元の文字列は別に保持する） */
TG.readable = function (s) {
  var t = String(s || '');
  if (t.normalize) t = t.normalize('NFKC');
  return t.replace(/\s+/g, ' ').trim();
};

/* 半角カナを含むか（読みを添えるかどうかの判断に使う） */
TG.hasHalfKana = function (s) { return /[｡-ﾟ]/.test(String(s || '')); };

TG.escRe = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };

/* 漢字の言葉 → READING を使ったカナ表記（長い言葉から置き換える） */
TG._readingKeys = null;
TG.readingOf = function (word) {
  if (!TG._readingKeys) TG._readingKeys = Object.keys(TG.READING).sort(function (a, b) { return b.length - a.length; });
  var out = word, changed = false;
  for (var i = 0; i < TG._readingKeys.length; i++) {
    var k = TG._readingKeys[i];
    if (out.indexOf(k) >= 0) { out = out.split(k).join(TG.READING[k]); changed = true; }
  }
  return changed ? out : null;
};

/* 辞書の言葉を照合できる形にする
 *   文字列     → 正規化した形（＋カナ表記）を compact な本文の中から探す
 *   'word'     → 英字の単語として探す（「AI」が「MAIL」に当たらないように）
 *   関数       → fn(spaced, compact) が true/数値(位置) を返せば一致
 */
TG.compileKw = function (list) {
  var out = [];
  (list || []).forEach(function (k) {
    var p, w, mode;
    if (Array.isArray(k)) { p = k[0]; w = (k[1] === undefined ? 1 : k[1]); mode = k[2]; } else { p = k; w = 1; }
    if (typeof p === 'function') { out.push({ fn: p, w: w || 1, key: 'fn:' + out.length + ':' + String(p).length, label: '' }); return; }
    var n = TG.norm(p);
    if (mode === 'word') {
      out.push({ re: new RegExp('(^|[^A-Z0-9])' + TG.escRe(n) + '(?=[^A-Z0-9]|$)'), w: w, key: 'w:' + n, label: p });
      return;
    }
    var subs = [TG.compact(n)];
    var r = TG.readingOf(p);
    if (r) { var rc = TG.compact(TG.norm(r)); if (rc.length >= 3 && subs.indexOf(rc) < 0) subs.push(rc); }
    out.push({ subs: subs, w: w, key: 's:' + subs[0], label: p });
  });
  return out;
};

/* 一致すれば位置（0以上）、しなければ -1 */
TG.kwHit = function (k, spaced, compact) {
  if (k.fn) { var r = k.fn(spaced, compact); return (r === true) ? 0 : (typeof r === 'number' ? r : -1); }
  if (k.re) { var m = k.re.exec(spaced); return m ? m.index + m[1].length : -1; }
  for (var i = 0; i < k.subs.length; i++) { var j = compact.indexOf(k.subs[i]); if (j >= 0) return j; }
  return -1;
};

/* 一致した文字列そのもの（同じ文字列に複数の言葉が当たったときに二重に数えないため。理由の引用にも使う） */
TG.kwMatchStr = function (k, spaced, compact) {
  if (k.fn) { var r = k.fn(spaced, compact); return (r === true || (typeof r === 'number' && r >= 0)) ? k.key : null; }
  if (k.re) { var m = k.re.exec(spaced); return m ? m[0].slice(m[1].length) : null; }
  for (var i = 0; i < k.subs.length; i++) if (compact.indexOf(k.subs[i]) >= 0) return k.subs[i];
  return null;
};

/* 正規化した形で見つかった文字列を、元の文字列（半角カナのままなど）の該当部分に戻す。
 * 半角カナは「ﾃﾞ」の2文字が「デ」の1文字になるなど長さが変わるので、先頭からの長さの対応で探す */
TG.origSpan = function (raw, target, compactOffset) {
  raw = String(raw || '');
  if (!target || !raw) return null;
  var at = TG.compact(TG.norm(raw)).indexOf(target, compactOffset || 0);
  if (at < 0) return null;
  var lens = [0], i;
  for (i = 1; i <= raw.length; i++) lens.push(TG.compact(TG.norm(raw.slice(0, i))).length);
  var s = -1, e = -1;
  for (i = 1; i <= raw.length; i++) {
    if (s < 0 && lens[i] > at) s = i - 1;
    if (lens[i] >= at + target.length) { e = i; break; }
  }
  if (s < 0 || e < 0) return null;
  while (e < raw.length && /[ﾞﾟ]/.test(raw.charAt(e))) e++;
  return raw.slice(s, e).trim();
};

/* 照合用の本文（正規化した形と、記号を除いた形） */
TG.textForms = function (s) { var sp = TG.norm(s); return { spaced: sp, compact: TG.compact(sp) }; };

/* 2つの店名キーが同じ店を指していそうか。

/* 十進表記のまま計算・表示する。小さい金額を Number が指数表記する場合も展開する。 */
TG.decimalText = function (value) {
  var text = String(value);
  if (typeof value === 'number' && /e/i.test(text)) {

    if (!exp) return null;

    else if (point >= digits.length) text = exp[1] + digits + '0'.repeat(point - digits.length);
    else text = exp[1] + digits.slice(0, point) + '.' + digits.slice(point);

/* 桁を合わせた整数同士で加算し、合計は十進文字列で返す。 */
TG.addAmounts = function (a, b) {
  var left = TG.decimalText(a), right = TG.decimalText(b);

};

/* 金額の表示。元の端数を表示時に四捨五入しない。 */
TG.yen = function (n) {

/* HTMLエスケープ */

/* =========================================================================
 * 20_csv.js  CSVの読み込み（文字コード・CSVの文法・見出しの推定・日付と金額）
 *
 * 書き出しで「日付・摘要・金額は元のとおり」にするため、セルの文字列は
 * 加工せずに raw として持ち続ける。読み取った値（日付・金額）は表示と仕分けにだけ使う。
 * ========================================================================= */

/* 文字コード：BOM → UTF-8（厳密）→ Shift_JIS の順に試す */
TG.decode = function (buf) {
  var b = new Uint8Array(buf);
  if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) return { text: new TextDecoder('utf-8').decode(b.subarray(3)), encoding: 'UTF-8（BOM付き）' };
  if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE) return { text: new TextDecoder('utf-16le').decode(b.subarray(2)), encoding: 'UTF-16' };
  if (b.length >= 2 && b[0] === 0xFE && b[1] === 0xFF) return { text: new TextDecoder('utf-16be').decode(b.subarray(2)), encoding: 'UTF-16' };
  var u16 = TG.utf16Guess ? TG.utf16Guess(b) : null;   /* BOMのない UTF-16（25_files.js） */
  if (u16) return { text: new TextDecoder(u16).decode(b), encoding: 'UTF-16' };
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(b), encoding: 'UTF-8' }; } catch (e) { /* 次を試す */ }
  try { return { text: new TextDecoder('shift_jis').decode(b), encoding: 'Shift_JIS' }; } catch (e) { /* 次を試す */ }
  return { text: new TextDecoder('utf-8').decode(b), encoding: 'UTF-8（読めない文字あり）' };
};

/* CSVの文法（RFC 4180）：引用符、引用符の中のカンマ・改行、"" のエスケープ、CRLF/LF/CR */
TG.parseCSV = function (text, delim) {
  var rows = [], row = [], field = '', i = 0, n = text.length, inQ = false, quoted = false;
  delim = delim || ',';
  while (i < n) {
    var c = text.charAt(i);
    if (inQ) {
      if (c === '"') {
        if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"' && field === '' && !quoted) { inQ = true; quoted = true; i++; continue; }
    if (c === delim) { row.push(field); field = ''; quoted = false; i++; continue; }
    if (c === '\r' || c === '\n') {
      row.push(field); rows.push(row); row = []; field = ''; quoted = false;
      i += (c === '\r' && text.charAt(i + 1) === '\n') ? 2 : 1; continue;
    }
    field += c; i++;

  if (field !== '' || row.length || quoted) { row.push(field); rows.push(row); }
  return rows;
};

/* 区切り文字の推定（カンマ・タブ・セミコロン） */
TG.detectDelim = function (text) {
  var sample = text.slice(0, 20000), best = ',', bestScore = -1;
  [',', '\t', ';'].forEach(function (d) {
    var rows = TG.parseCSV(sample, d).filter(function (r) { return r.join('').trim() !== ''; }).slice(0, 30);
    if (!rows.length) return;
    var counts = {};
    rows.forEach(function (r) { counts[r.length] = (counts[r.length] || 0) + 1; });
    var mode = 0, modeN = 0;
    Object.keys(counts).forEach(function (k) { if (counts[k] > modeN || (counts[k] === modeN && +k > mode)) { mode = +k; modeN = counts[k]; } });
    var score = mode > 1 ? (modeN / rows.length) * mode : 0;

};

/* 日付：2026/9/1、2026-09-01、2026年9月1日、20260901、R8.9.1、令和8年9月1日、26/09/01、9/1（年なし） */
TG.parseDate = function (s) {
  var t = TG.readable(s).replace(/\s+/g, '');
  if (!t) return null;
  var m, y = null, mo, d, noYear = false;
  if ((m = t.match(/^(令和|平成|R|H)(元|\d{1,2})[年.\/\-](\d{1,2})[月.\/\-](\d{1,2})日?/i))) {
    y = (/^(令和|R)$/i.test(m[1]) ? 2018 : 1988) + (m[2] === '元' ? 1 : +m[2]); mo = +m[3]; d = +m[4];
  } else if ((m = t.match(/^(\d{4})[年.\/\-](\d{1,2})[月.\/\-](\d{1,2})日?/))) {
    y = +m[1]; mo = +m[2]; d = +m[3];
  } else if ((m = t.match(/^(\d{4})(\d{2})(\d{2})(?!\d)/))) {
    y = +m[1]; mo = +m[2]; d = +m[3];
  } else if ((m = t.match(/^(\d{2})[.\/\-](\d{1,2})[.\/\-](\d{1,2})(?!\d)/))) {

};
TG.WEEK = ['日', '月', '火', '水', '木', '金', '土'];
TG.dateInfo = function (p, yearHint) {

  var y = p.y === null ? yearHint : p.y;
  var dt = new Date(y, p.m - 1, p.d);
  if (dt.getMonth() !== p.m - 1 || dt.getDate() !== p.d) return null;
  var iso = y + '-' + (p.m < 10 ? '0' : '') + p.m + '-' + (p.d < 10 ? '0' : '') + p.d;
  return { y: y, m: p.m, d: p.d, iso: iso, wd: TG.WEEK[dt.getDay()], ym: y + '-' + (p.m < 10 ? '0' : '') + p.m, assumedYear: p.y === null, label: p.m + '/' + p.d + '（' + TG.WEEK[dt.getDay()] + '）' };
};

/* 金額：「3,300」「2,400円」「¥1,980」「-3,300」「△3,300」「▲3,300」「(3,300)」「1980-」、全角数字 */
TG.parseAmount = function (s) {
  var raw = String(s === null || s === undefined ? '' : s);
  var t = TG.readable(raw).replace(/\s+/g, '');
  if (!t) return null;
  var neg = false;
  if (/^[△▲]/.test(t)) { neg = true; t = t.slice(1); }
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  if (/^[-−‐‑]/.test(t)) { neg = !neg; t = t.slice(1); }
  if (/^\+/.test(t)) t = t.slice(1);
  t = t.replace(/^(¥|\\|JPY)/i, '');
  if (/^[-−]/.test(t)) { neg = !neg; t = t.slice(1); }
  if (/[-−]$/.test(t)) { neg = !neg; t = t.slice(0, -1); }
  t = t.replace(/(円|JPY|YEN)$/i, '').replace(/,/g, '');

  var v = parseFloat(t);
  return { ok: true, value: neg ? -v : v, decorated: !/^-?\d+$/.test(raw.trim().replace(/,/g, '')) };
};

TG.headerKey = function (s) {
  return TG.norm(s).replace(/\s/g, '').replace(/[(（][^)）]*[)）]/g, '').replace(/[・･]/g, '');
};
TG._headerIndex = null;
TG.headerRoleOf = function (cell) {
  if (!TG._headerIndex) {
    TG._headerIndex = {};
    Object.keys(TG.HEADERS).forEach(function (role) { TG.HEADERS[role].forEach(function (h) { var k = TG.headerKey(h); (TG._headerIndex[k] = TG._headerIndex[k] || []).push(role); }); });

    if (h.length >= 2 && k.length <= h.length + 6 && (k.indexOf(h) >= 0)) TG._headerIndex[h].forEach(function (r) { out.push({ role: r, q: (k.indexOf(h) === 0 || k.slice(-h.length) === h) ? 2 : 1, len: h.length }); });
  });
  out.sort(function (a, b) { return (b.q - a.q) || (b.len - a.len); });
  return out;
};

/* 見出し行を探し、列の役割を決める */
TG.analyzeTable = function (rows) {
  var issues = [];
  var best = null;
  for (var i = 0; i < Math.min(rows.length, 15); i++) {
    var cells = rows[i];
    if (!cells || cells.join('').trim() === '') continue;
    var dateLike = cells.some(function (c) { return TG.parseDate(c) && TG.parseDate(c).y !== null; });
    if (dateLike) continue;
    var roles = TG.assignHeaderRoles(cells);
    var core = (roles.date >= 0 ? 1 : 0) + (roles.desc >= 0 ? 1 : 0) + ((roles.amount >= 0 || roles.out >= 0 || roles.in >= 0) ? 1 : 0);
    if (core >= 2 && (!best || core > best.core)) best = { idx: i, roles: roles, core: core };
    if (best && best.core === 3) break;
  }
  var headerIndex = best ? best.idx : -1;
  var roles = best ? best.roles : { date: -1, desc: -1, amount: -1, out: -1, in: -1, balance: -1, dir: -1, notes: [] };
  var data = rows.slice(headerIndex + 1).filter(function (r) { return r && r.join('').trim() !== ''; });
  var byContent = TG.inferByContent(data, roles);
  var via = {};
  ['date', 'desc', 'amount', 'out', 'in'].forEach(function (k) { via[k] = roles[k] >= 0 ? 'header' : (byContent[k] >= 0 ? 'content' : 'none'); if (roles[k] < 0 && byContent[k] >= 0) roles[k] = byContent[k]; });
  var width = 0; rows.forEach(function (r) { if (r.length > width) width = r.length; });
  var header0 = headerIndex >= 0 ? rows[headerIndex] : [];
  /* 摘要らしい列が複数あるとき（「取引内容」＝支払い/返金 と「取引先」＝店名 など）は、中身の種類が多い列を摘要にし、残りは手がかりに回す */
  if (headerIndex >= 0 && roles.desc >= 0) {
    var distinct = function (j) { var s = {}; data.forEach(function (r) { var v = (r[j] || '').trim(); if (v) s[v] = 1; }); return Object.keys(s).length; };
    var cands = (roles.notes || []).filter(function (j) { return TG.headerRoleOf(header0[j]).some(function (c) { return c.role === 'desc' && c.q >= 2; }); });
    var bestJ = roles.desc, bestD = distinct(roles.desc);
    cands.forEach(function (j) { var d = distinct(j); if (d > bestD) { bestD = d; bestJ = j; } });
    if (bestJ !== roles.desc) {
      issues.push('摘要の列は、中身の種類が多い「' + header0[bestJ] + '」にしました（「' + header0[roles.desc] + '」は仕分けの手がかりとして使います）。');
      roles.notes = roles.notes.filter(function (j) { return j !== bestJ; }).concat([roles.desc]);
      roles.desc = bestJ;
    }
  }
  /* 見出しがないとき：日付の読める最初の行より前は、明細の前の説明の行（会員情報など）として読み飛ばす */
  var dataStart = headerIndex + 1;
  if (headerIndex < 0 && roles.date >= 0) {
    for (var k = 0; k < Math.min(rows.length, 15); k++) {
      var c0 = rows[k] && rows[k][roles.date];
      var hasAmountCell = [roles.amount, roles.out, roles['in']].some(function (j) {
        var amount = j >= 0 && TG.parseAmount(rows[k][j]);
        return amount && amount.ok;
      });
      if (hasAmountCell || (c0 && TG.parseDate(c0))) { dataStart = k; break; }
    }
    if (dataStart > 0) issues.push('先頭の' + dataStart + '行は、日付がないため明細の前の説明の行として読み飛ばしました。');
  }

};

TG.assignHeaderRoles = function (cells) {
  var cand = cells.map(function (c) { return TG.headerRoleOf(c); });
  var roles = { date: -1, desc: -1, amount: -1, out: -1, in: -1, balance: -1, dir: -1, notes: [] };
  var used = {};
  var pick = function (role) {

/* 見出しで決まらなかった列を、中身から推定する */
TG.inferByContent = function (data, roles) {

  var width = 0; data.forEach(function (r) { if (r.length > width) width = r.length; });
  var sample = data.slice(0, 200), stats = [];

  }

  ['date', 'desc', 'amount', 'out', 'in', 'balance', 'dir'].forEach(function (k) { if (roles[k] >= 0) taken[roles[k]] = 1; });

  if (roles.date < 0) {

  }

/* カード明細の末尾に「請求額」だけを置く形式。手選択を含め、取引金額の列に値があれば取引として残す。 */
TG.trailingTotal = function (items, table, an) {
  if (an.mode !== 'single' || an.roles.amount < 0 || items.length < 3) return null;
  var last = items[items.length - 1];
  if (last.raw.date.trim() || last.raw.desc.trim() || last.raw.amount.trim()) return null;
  if (table.slice(last.line).some(function (row) { return row.join('').trim() !== ''; })) return null;
  var columns = [];
  last.cells.forEach(function (v, j) { if (v.trim()) columns.push(j); });
  if (columns.length !== 1) return null;
  var j = columns[0], value = TG.parseAmount(last.cells[j]);
  if (!value || !value.ok || j === an.roles.balance || j === an.roles.dir || (an.roles.notes || []).indexOf(j) >= 0) return null;
  var expected = 0;
  var repeatsAmount = items.slice(0, -1).every(function (item) {
    var bill = TG.parseAmount(item.cells[j]);
    if (!item.pd || !bill || !bill.ok || bill.value !== item.amountSigned) return false;
    expected += bill.value;
    return true;
  });
  return repeatsAmount ? { raw: last.cells[j], value: value, expected: expected } : null;
};

TG.directionLabel = function (value) {
  var text = TG.norm(value);
  if (/(入金|預入|ニュウキン|IN|DEPOSIT|CREDIT)/.test(text)) return 'in';
  if (/(出金|引出|支払|シュッキン|OUT|WITHDRAW|DEBIT)/.test(text)) return 'out';
  return null;
};

/* 実際の返金を示す摘要・備考だけを使う。手数料や手続きの説明は符号の根拠にならない。 */
TG.hasRefundMarker = function (row) {
  var text = TG.readable(row.raw.desc + ' ' + row.notesText);
  if (/手数料|違約金|キャンセル料|取消料|予定|申請|保留|依頼|照会|不可|対象外|未返金|返金\s*(?:なし|せず|しない)|未了|見込|待ち|\b(?:FEES?|PENDING|REQUEST(?:ED)?|NO|NON)\b/i.test(text)) return false;
  return /(?:返金|払い?戻し?|ヘンキン|ハライモドシ)(?:済み?)?(?=$|[\s、。・,/／:：()（）「」【】\[\]-])|\bREFUND(?:ED)?\b/i.test(text);
};

/* 表 → 明細の行（元の文字列 raw と、読み取った値） */
TG.buildRows = function (rows, an, opts) {
  opts = opts || {};
  var r = an.roles, out = [], blank = 0, summary = [];
  var start = an.dataStart !== undefined ? an.dataStart : an.headerIndex + 1;
  var cell = function (row, j) { return (j >= 0 && j < row.length) ? row[j] : ''; };
  var noteCols = (r.notes || []).slice();
  /* 利用者名や決済方法を、購入した品名として照合しない。 */
  var itemNoteCols = noteCols.filter(function (j) {
    var header = TG.readable((an.header || [])[j] || '');
    return !/利用者|利用人|会員名|名義|支払区分|支払方法|決済方法|カード番号|CARDHOLDER|PAYMENT METHOD/i.test(header);
  });
  for (var i = start; i < rows.length; i++) {
    var row = rows[i];
    if (!row || row.join('').trim() === '') { blank++; continue; }
    var rawDate = cell(row, r.date), rawDesc = cell(row, r.desc);
    var pd = TG.parseDate(rawDate);
    var isSummary = (!pd) && (TG.SUMMARY_ROW.test(TG.readable(rawDesc)) || TG.SUMMARY_ROW.test(TG.readable(rawDate)));
    var item = { line: i + 1, cells: row.slice(), raw: { date: rawDate, desc: rawDesc, amount: '' }, pd: pd, notesText: noteCols.map(function (j) { return cell(row, j); }).filter(function (v) { return v && !/^[0-9.,\-\s]+$/.test(v); }).join(' ') };
    item.itemNotes = itemNoteCols.map(function (j) { return cell(row, j); }).filter(Boolean);
    if (an.mode === 'split') {
      var o = cell(row, r.out), n = cell(row, r['in']);
      var po = TG.parseAmount(o), pn = TG.parseAmount(n);
      item.rawOut = o; item.rawIn = n;
      if (po && po.ok && po.value !== 0) { item.amount = Math.abs(po.value); item.dir = po.value < 0 ? 'in' : 'out'; item.raw.amount = o; item.amountDecorated = po.decorated; }
      else if (pn && pn.ok) {
        item.amount = Math.abs(pn.value); item.dir = pn.value < 0 ? 'out' : 'in';
        item.raw.amount = n; item.amountDecorated = pn.decorated; item.fromIn = true;
      }
      else if (po && po.ok) { item.amount = 0; item.dir = 'out'; item.raw.amount = o; }
      else { item.amount = null; item.dir = 'out'; item.raw.amount = o || n; item.amountBad = (o || n) ? (o || n) : '(空欄)'; }
    } else {
      var a = cell(row, r.amount), pa = TG.parseAmount(a);
      item.raw.amount = a;
      if (pa && pa.ok) { item.amountSigned = pa.value; item.amount = Math.abs(pa.value); item.amountDecorated = pa.decorated; }
      else { item.amount = null; item.amountBad = a || '(空欄)'; }
    }
    if (r.dir >= 0) item.dirText = cell(row, r.dir);
    if (isSummary) { summary.push(item); continue; }
    out.push(item);
  }
  var total = TG.trailingTotal(out, rows, an);
  if (total) {
    var footer = out.pop();
    footer.raw.amount = total.raw; footer.amountSigned = total.value.value;
    footer.amount = Math.abs(total.value.value); footer.amountDecorated = total.value.decorated;
    footer.dir = footer.amountSigned < 0 ? 'in' : 'out';
    delete footer.amountBad;
    summary.push(footer);
    var note = '末尾の行には、各明細の金額を繰り返す別の列だけに「' + total.raw + '」があるため、集計行として分けました。';
    if (Math.abs(total.value.value - total.expected) > 0.000001) note += ' 明細の合計（' + TG.yen(total.expected) + '円）と一致しません。元の明細を確かめてください。';
    an.issues.push(note);
  }
  /* 単一金額列の符号。明示された区分は各行で優先し、残る行だけに符号の規則を使う。 */
  var posIsOut = true;
  if (an.mode !== 'split') {
    var neg = 0, nz = 0, needsSign = false;
    var directionHints = new Set(), refundHints = new Set();
    out.forEach(function (it) {
      if (typeof it.amountSigned !== 'number' || it.amountSigned === 0) return;
      nz++;
      if (it.amountSigned < 0) neg++;
      var explicit = TG.directionLabel(it.dirText);
      if (explicit) directionHints.add((it.amountSigned > 0) === (explicit === 'out'));
      else {
        needsSign = true;
        if (TG.hasRefundMarker(it)) refundHints.add(it.amountSigned < 0);
      }
    });
    posIsOut = !(nz > 0 && neg / nz >= 0.6);
    an.signNeedsReview = false;
    if (opts.posIsOut !== undefined) {
      posIsOut = opts.posIsOut;
      an.signSource = 'manual';
    } else if (directionHints.size === 1 || (!needsSign && directionHints.size)) {
      if (directionHints.size === 1) posIsOut = directionHints.has(true);
      an.signSource = 'direction';
      an.issues.push('入出金の区分が書かれた行は、その区分を使います。');
    } else if (refundHints.size === 1) {
      posIsOut = refundHints.has(true);
      an.signSource = 'refund';
      an.issues.push('摘要・備考に返金と書かれた行を入金として、金額の向きを推定しました。');
    } else {
      an.signSource = 'count';
      if (nz) an.issues.push('金額の向きはプラス・マイナスの件数から推定しました。元の明細と見比べて変更できます。');
    }
    if (opts.posIsOut === undefined && needsSign) {
      an.signNeedsReview = refundHints.size > 1 || directionHints.size > 1 ||
        (an.signSource === 'direction' && refundHints.size > 0 && !refundHints.has(posIsOut));
      if (an.signNeedsReview) an.issues.push('入出金区分や返金の記載から、すべての行に共通する金額の向きを決められません。支払い・入金の表示を確認してください。');
    }
    out.forEach(function (it) {
      if (typeof it.amountSigned === 'number') it.dir = (it.amountSigned >= 0) === posIsOut ? 'out' : 'in';
      else it.dir = 'out';
    });
  }
  /* 入出金の区分の列があれば、それを優先する */
  out.forEach(function (it) {
    var explicit = TG.directionLabel(it.dirText);
    if (explicit) it.dir = explicit;
  });
  /* 年のない日付は、ほかの行で多い年を使う */
  var years = {};
  out.forEach(function (it) { if (it.pd && it.pd.y !== null) years[it.pd.y] = (years[it.pd.y] || 0) + 1; });
  var yh = new Date().getFullYear(), yn = 0;
  Object.keys(years).forEach(function (y) { if (years[y] > yn) { yn = years[y]; yh = +y; } });
  out.forEach(function (it, k) { it.date = TG.dateInfo(it.pd, yh); it.idx = k; });
  return { rows: out, blank: blank, summary: summary, posIsOut: posIsOut };
};

/* ファイル（ArrayBuffer）→ 読み込み結果 */
TG.readStatement = function (buf, name, opts) {
  var dec = TG.decode(buf);
  return TG.readText(dec.text, name, dec.encoding, opts);
};

/* 文字列 → 読み込み結果（保存しておいた明細を読み直すときにも使う） */
TG.readText = function (rawText, name, encoding, opts) {
  var dec = { encoding: encoding };
  var text = String(rawText || '').replace(/^﻿/, '');
  var delim = TG.detectDelim(text);
  var table = TG.parseCSV(text, delim);
  var an = TG.analyzeTable(table);
  if (opts && opts.roles) {
    an.roles = opts.roles; an.mode = (an.roles.out >= 0 || an.roles['in'] >= 0) && an.roles.amount < 0 ? 'split' : 'single'; an.confidence = 'user';
    if (opts.headerIndex !== undefined) { an.headerIndex = opts.headerIndex; an.dataStart = opts.headerIndex + 1; }
  }
  var built = TG.buildRows(table, an, opts || {});
  return { name: name, encoding: dec.encoding, delim: delim, table: table, analysis: an, rows: built.rows, blank: built.blank, summary: built.summary, posIsOut: built.posIsOut };
};

/* 読み取り方の要約（平易な文の配列）。例：「1列目「利用日」を日付、2列目「利用店名」を摘要（店名・内容）、3列目「利用金額」を金額として読みました。」
 * opt.excel：Excel のファイルなら列を「A列」の形で書く。opt.includeSummary：集計の行を明細に含めているか */
TG.describeReading = function (st, opt) {
  opt = opt || {};
  var an = st.analysis, r = an.roles, lines = [];
  var colName = function (j) {
    var h = an.headerIndex >= 0 ? TG.readable(String((an.header || [])[j] || '')).trim() : '';
    if (h.length > 16) h = h.slice(0, 15) + '…';
    return (opt.excel && TG.colLetter ? TG.colLetter(j) + '列' : (j + 1) + '列目') + (h ? '「' + h + '」' : '');
  };
  var parts = [];
  var push = function (j, label) { if (j >= 0) parts.push({ j: j, text: colName(j) + 'を' + label }); };
  push(r.date, '日付'); push(r.desc, '摘要（店名・内容）');
  if (an.mode === 'split') { push(r.out, '支払い（出金）'); push(r['in'], '入金'); } else push(r.amount, '金額');
  push(r.dir, '支払いか入金かの区分');
  parts.sort(function (a, b) { return a.j - b.j; });
  lines.push(parts.length ? parts.map(function (p) { return p.text; }).join('、') + 'として読みました。' : '日付・摘要・金額の列を見つけられませんでした。下の「列の役割」で選んでください。');
  var notes = (r.notes || []).slice().sort(function (a, b) { return a - b; });
  if (notes.length) lines.push(notes.map(colName).join('、') + 'は、仕分けの手がかりとして読みます。');
  var start = an.dataStart !== undefined ? an.dataStart : an.headerIndex + 1, n = st.rows.length + (opt.includeSummary ? st.summary.length : 0);
  lines.push((an.headerIndex >= 0 ? (an.headerIndex + 1) + '行目を見出しとして、' : '見出しの行がないため、中身から列を決めました。') + (start + 1) + '行目から ' + n + '件を明細として読みました。' +
    (st.summary.length && !opt.includeSummary ? '「合計」などの集計の行（' + st.summary.length + '行）は、明細に含めていません。' : ''));
  if (an.mode !== 'split' && r.amount >= 0) lines.push(r.dir >= 0 ? '支払いか入金かは、区分の列の書き方で見分けました。' : '金額は、' + (st.posIsOut ? 'プラスを支払い、マイナスを返金・入金' : 'マイナスを支払い、プラスを入金') + 'として読みました。');
  var noDate = 0, noAmount = 0;
  st.rows.forEach(function (x) { if (!x.date) noDate++; if (x.amount === null) noAmount++; });
  if (noDate || noAmount) lines.push([noDate ? '日付を読み取れない行が ' + noDate + '件' : '', noAmount ? '金額を読み取れない行が ' + noAmount + '件' : ''].filter(Boolean).join('、') + 'あります。これらは要判断にします。');
  return lines;
};

/* ---- 25_files.js ---- */
/* =========================================================================
 * 25_files.js  ファイルの種類の見分けと、Excel（.xlsx）の読み込み
 *
 * 明細として読むのは、文字で書かれた表（CSV・TSV・テキスト）と、Excel の .xlsx（.xlsm も同じ形）。
 * PDF・画像・古い形式の Excel（.xls）・Word などは読み込まずに、CSV の取り出し方を案内する。
 * 中身を読めない行が大半のファイルと、行が多すぎるファイルも、仕分けの前で止める（画面が固まらないように）。
 *
 * .xlsx は ZIP にまとめた XML なので、ブラウザに備わっている展開（DecompressionStream の deflate-raw）で開き、
 * 最初のシートを CSV の文字列に直してから、CSV と同じ読み込みに渡す。外部の部品は使わない。
 * 行番号は Excel の行番号と同じにする（空の行も空行として残す）。
 * ========================================================================= */

TG.MAX_ROWS = 5000;               /* 一度に読み込む明細の上限（1年分の数倍。超えると画面が重くなる） */
TG.MAX_PART = 40 * 1024 * 1024;   /* 展開した XML 1つの大きさの上限 */

/* 案内の文（どれも「読み込めない理由」と「次にすること」を1つずつ） */
TG.FILE_MESSAGES = {
  pdf: 'PDFのファイルは読み込めません。PDFの明細からは、日付・店名・金額の表を取り出せないためです。カード会社・銀行のWebサイトで、明細を「CSV」の形式でダウンロードしてください。',
  image: '画像（写真・スクリーンショット）からは、明細を読み取れません。カード会社・銀行のWebサイトで、明細を「CSV」の形式でダウンロードしてください。',
  xls: '古い形式のExcel（.xls）と、パスワードを付けたExcelのファイルは読み込めません。Excelで開いて「名前を付けて保存」から「CSV UTF-8（コンマ区切り）」を選んで保存し、そのファイルを読み込んでください。',
  xlsb: 'Excelのバイナリ形式（.xlsb）は読み込めません。Excelで開いて「名前を付けて保存」から「Excel ブック（.xlsx）」か「CSV UTF-8（コンマ区切り）」を選んで保存し、そのファイルを読み込んでください。',
  office: 'Word・PowerPoint などの文書のファイルは読み込めません。明細のCSV（またはExcelの .xlsx）を選んでください。',
  sheet: 'Numbers・LibreOffice などの表のファイルは、そのままでは読み込めません。表のアプリで開いて「CSV」の形式で書き出し、そのファイルを読み込んでください。',
  archive: '圧縮ファイル（.zip など）は読み込めません。展開（解凍）して、中のCSVを読み込んでください。',
  html: 'Webページ（HTML）のファイルは読み込めません。カード会社・銀行のWebサイトで、明細を「CSV」の形式でダウンロードしてください。',
  binary: 'このファイルは、文字で書かれた表（CSV）ではないため読み込めません。カード会社・銀行のWebサイトからダウンロードした、明細のCSVを選んでください。',
  nodeflate: 'このブラウザでは、Excelのファイルを開けません。Excelで開いて「CSV UTF-8（コンマ区切り）」の形式で保存してから読み込むか、新しい版のブラウザ（Chrome・Edge・Safari・Firefox）で開いてください。',
  xlsxbad: 'Excelのファイルを読み取れませんでした。Excelで開いて「名前を付けて保存」から「CSV UTF-8（コンマ区切り）」を選んで保存し、そのファイルを読み込んでください。',
  big: 'ファイルが大きすぎます（15MBまで）。期間を分けてダウンロードし、1つずつ読み込んでください。'
};
TG.fileError = function (code, detail) {
  var e = new Error((TG.FILE_MESSAGES[code] || TG.FILE_MESSAGES.binary) + (detail ? detail : ''));
  e.code = code; e.guide = true;
  return e;
};

/* ---------- バイト列の小さな道具 ---------- */
TG._u16 = function (b, p) { return b[p] | (b[p + 1] << 8); };
TG._u32 = function (b, p) { return (b[p] | (b[p + 1] << 8) | (b[p + 2] << 16) | (b[p + 3] << 24)) >>> 0; };
TG._ascii = function (b, off, len) { var s = ''; for (var i = off; i < Math.min(b.length, off + len); i++) s += String.fromCharCode(b[i]); return s; };

/* 先頭のバイトで、ファイルの種類を見分ける。'text' | 'zip' | 'ole' | 'pdf' | 'image' | 'archive' | 'binary' */
TG.sniffFile = function (buf) {
  var b = new Uint8Array(buf), n = b.length;
  if (!n) return 'text';
  var head = TG._ascii(b, 0, 16), pdfAt = TG._ascii(b, 0, 1024).indexOf('%PDF-');
  /* PDF の目印は先頭1024バイトのどこか（ふつうは先頭）。途中にあるときは、末尾の %%EOF でも確かめる */
  if (pdfAt === 0 || (pdfAt > 0 && TG._ascii(b, Math.max(0, n - 1024), 1024).indexOf('%%EOF') >= 0)) return 'pdf';
  if (/^PK(\x03\x04|\x05\x06|\x07\x08)/.test(head)) return 'zip';
  if (head.slice(0, 8) === '\xD0\xCF\x11\xE0\xA1\xB1\x1A\xE1') return 'ole';
  if (head.slice(0, 4) === '\x89PNG' || head.slice(0, 3) === '\xFF\xD8\xFF' || head.slice(0, 4) === 'GIF8' ||
    (head.slice(0, 4) === 'RIFF' && head.slice(8, 12) === 'WEBP') || head.slice(0, 4) === 'II*\x00' || head.slice(0, 4) === 'MM\x00*' ||
    (head.slice(0, 2) === 'BM' && n > 26 && !b[6] && !b[7] && !b[8] && !b[9]) ||
    (head.slice(4, 8) === 'ftyp' && /^(hei[cxms]|hev[cxms]|mif1|msf1|avif|avis)/.test(head.slice(8, 12)))) return 'image';
  if (head.slice(0, 2) === '\x1F\x8B' || head.slice(0, 6) === '7z\xBC\xAF\x27\x1C' || head.slice(0, 4) === 'Rar!') return 'archive';
  /* BOM付きの UTF-16 は文字のファイル。それ以外で NUL や制御文字が多ければ、文字でないファイル */
  if ((b[0] === 0xFF && b[1] === 0xFE) || (b[0] === 0xFE && b[1] === 0xFF)) return 'text';
  if (TG.utf16Guess(b)) return 'text';
  var len = Math.min(n, 65536), odd = 0;
  for (var i = 0; i < len; i++) { var c = b[i]; if (c < 9 || (c > 13 && c < 32 && c !== 26 && c !== 27)) odd++; }
  return odd > len * 0.01 ? 'binary' : 'text';
};
/* BOMのない UTF-16（英数字の多い表なら、偶数か奇数の位置の半分近くが 0 になる） */
TG.utf16Guess = function (b) {
  var len = Math.min(b.length, 4096) & ~1, even = 0, odd = 0;
  if (len < 8) return null;
  for (var i = 0; i < len; i += 2) { if (!b[i]) even++; if (!b[i + 1]) odd++; }
  var half = len / 2;
  if (odd > half * 0.3 && even < half * 0.02) return 'utf-16le';
  if (even > half * 0.3 && odd < half * 0.02) return 'utf-16be';
  return null;
};
/* 文字に直したあとで見分けるもの（HTML、読めない文字が多いもの） */
TG.textKind = function (text) {
  var head = String(text || '').slice(0, 4000).replace(/^\uFEFF/, '');
  if (/^\s*(?:<!--[\s\S]*?-->\s*)*(?:<!doctype\s+html|<html[\s>]|<\?xml[^>]*\?>\s*<html[\s>])/i.test(head)) return 'html';
  var sample = String(text || '').slice(0, 20000), bad = 0;
  for (var i = 0; i < sample.length; i++) if (sample.charCodeAt(i) === 0xFFFD) bad++;
  return sample.length && bad > sample.length * 0.05 ? 'binary' : null;
};

/* ---------- ZIP（中央ディレクトリを読む。ZIP64 と暗号化には対応しない） ---------- */
TG.zipEntries = function (buf) {
  var b = new Uint8Array(buf), n = b.length, eocd = -1;
  for (var i = n - 22; i >= Math.max(0, n - 22 - 65535); i--) {
    if (b[i] === 0x50 && b[i + 1] === 0x4B && b[i + 2] === 0x05 && b[i + 3] === 0x06) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('ZIPの目次が見つかりません');
  var count = TG._u16(b, eocd + 10), p = TG._u32(b, eocd + 16);
  if (count === 0xFFFF || p === 0xFFFFFFFF) throw new Error('大きなZIP（ZIP64）には対応していません');
  var list = [], dec = new TextDecoder('utf-8');
  for (var k = 0; k < count; k++) {
    if (p + 46 > n || TG._u32(b, p) !== 0x02014b50) throw new Error('ZIPの目次が壊れています');
    var nl = TG._u16(b, p + 28), xl = TG._u16(b, p + 30), cl = TG._u16(b, p + 32);
    list.push({ name: dec.decode(b.subarray(p + 46, p + 46 + nl)), flags: TG._u16(b, p + 8), method: TG._u16(b, p + 10), csize: TG._u32(b, p + 20), usize: TG._u32(b, p + 24), off: TG._u32(b, p + 42) });
    p += 46 + nl + xl + cl;
  }
  return list;
};

/* 表示形式から、日付・時刻のセルかどうかを見分ける */
TG.XLSX_DATE_IDS = { 14: 1, 15: 1, 16: 1, 17: 1, 22: 1, 27: 1, 28: 1, 29: 1, 30: 1, 31: 1, 34: 1, 35: 1, 36: 1, 50: 1, 51: 1, 52: 1, 53: 1, 54: 1, 57: 1, 58: 1 };
TG.XLSX_TIME_IDS = { 18: 1, 19: 1, 20: 1, 21: 1, 32: 1, 33: 1, 45: 1, 46: 1, 47: 1, 55: 1, 56: 1 };
TG.xlsxFmtKind = function (code) {
  var c = String(code || '').replace(/"[^"]*"/g, '').replace(/\\./g, '').replace(/[_*]./g, '').replace(/\[(?:h+|m+|s+)\]/gi, 'h').replace(/\[[^\]]*\]/g, '').replace(/general/gi, '').replace(/E[+-]/gi, '');

TG._pad2 = function (v) { return (v < 10 ? '0' : '') + v; };

TG.xlsxDate = function (serial, date1904) {
  var days = Math.floor(serial), secs = Math.round((serial - days) * 86400);
  if (secs >= 86400) { days++; secs = 0; }

TG.xlsxTime = function (frac) {
  var secs = Math.round((frac - Math.floor(frac)) * 86400), h = Math.floor(secs / 3600), mi = Math.floor((secs % 3600) / 60), se = secs % 60;

/* 表（配列の配列）→ CSV の文字列（RFC 4180） */
TG.tableToCsv = function (rows) {
  return rows.map(function (r) {
    return r.map(function (v) { v = v === null || v === undefined ? '' : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',');

/* シートの XML → 表。数式のセルは保存されている計算結果を使う */
TG.xlsxSheetTable = function (xml, ctx) {
  var sd = /<(?:[\w.-]+:)?sheetData\b[^>]*>([\s\S]*?)<\/(?:[\w.-]+:)?sheetData>/.exec(xml);
  var rows = [], maxRow = 0, rowNo = 0, info = { dates: 0, noValue: 0 };
  if (!sd) return { rows: rows, info: info };
  TG.xmlTags(sd[1], 'row').forEach(function (row) {
    var r = parseInt(TG.xmlAttr(row.attrs, 'r'), 10);
    rowNo = r > 0 ? r : rowNo + 1;
    var cells = [], col = -1;
    TG.xmlTags(row.inner, 'c').forEach(function (c) {
      var ref = TG.xmlAttr(c.attrs, 'r'), j = ref ? TG.colIndex(ref) : col + 1;

/* .xlsx → { text: CSVの文字列, sheet: シート名, notes: [読み込みの説明] } */
TG.readXlsx = function (buf, entries) {

  var part = function (path) { var e = byName[String(path).toLowerCase()]; return e ? TG.zipRead(buf, e).then(function (u) { return dec.decode(u); }) : Promise.resolve(null); };

    var rels = TG.relsOf(rootRels);
    Object.keys(rels).forEach(function (id) { if (/\/officeDocument$/.test(rels[id].type)) wbPath = TG.zipPath('', rels[id].target); });

    }).filter(function (s) { return s.path && !s.hidden; });

    return Promise.all([part(find(/\/sharedStrings$/) || wbDir + 'sharedStrings.xml'), part(find(/\/styles$/) || wbDir + 'styles.xml')]).then(function (p2) {
      ctx.shared = p2[0] ? TG.xmlTags(p2[0], 'si').map(function (si) { return TG.xlsxText(si.inner); }) : [];
      if (p2[1]) {
        TG.xmlTags(p2[1], 'numFmt').forEach(function (f) { ctx.fmts[TG.xmlAttr(f.attrs, 'numFmtId')] = TG.xmlAttr(f.attrs, 'formatCode') || ''; });

        if (k >= sheets.length) return { text: '', sheet: sheets[0].name, notes: [] };
        return part(sheets[k].path).then(function (xml) {
          var t = xml ? TG.xlsxSheetTable(xml, ctx) : { rows: [], info: {} };
          if (!t.rows.length) return tryAt(k + 1);
          others = sheets.slice(k + 1).map(function (s) { return s.name; });
          var notes = ['Excelのファイルの、シート「' + sheets[k].name + '」を読みました。行の番号は、Excelの行番号と同じです。'];
          if (t.info.dates) notes.push('Excelの日付のセル（' + t.info.dates + '個）は、「2026/09/01」の形に直して読みました。書き出すCSVの日付も、この形です。');
          if (t.info.noValue) notes.push('数式のセルのうち、計算の結果が保存されていない ' + t.info.noValue + '個は空欄として読みました。Excelで開いて保存し直すと、読める場合があります。');
          if (t.info.compact) notes.push('離れた行に値があるため、空の行を詰めて読みました（行の番号がExcelと合いません）。');
          if (others.length) notes.push('ほかのシート（「' + others.slice(0, 3).join('」「') + '」' + (others.length > 3 ? 'など' : '') + '）は読んでいません。別のシートの明細は、Excelでそのシートを開いて「CSV UTF-8（コンマ区切り）」で保存してから読み込んでください。');

/* ファイル（ArrayBuffer）→ { text, encoding, source }。読めない種類は、案内の文を持つエラーにする */
TG.openFile = function (buf, name) {
  var kind = TG.sniffFile(buf), ext = (/\.([A-Za-z0-9]+)$/.exec(String(name || '')) || [])[1];
  ext = ext ? ext.toLowerCase() : '';
  if (kind === 'zip') {
    var entries;
    try { entries = TG.zipEntries(buf); } catch (e) { return Promise.reject(TG.fileError(/^xls/.test(ext) ? 'xlsxbad' : 'archive')); }
    var zk = TG.zipKind(buf, entries);
    if (zk.kind !== 'xlsx') return Promise.reject(TG.fileError(zk.kind, zk.detail));
    return TG.readXlsx(buf, entries).then(function (x) {
      return { text: x.text, encoding: 'Excel（.xlsx）', source: { kind: 'xlsx', sheet: x.sheet, notes: x.notes } };
    }, function (e) { throw e && e.guide ? e : TG.fileError('xlsxbad', e && e.message ? '（' + e.message + '）' : ''); });

  if (kind === 'ole') return Promise.reject(TG.fileError(/^(doc|dot|ppt|pps|msg)$/.test(ext) ? 'office' : 'xls'));

  var dec = TG.decode(buf), tk = TG.textKind(dec.text);
  if (tk) return Promise.reject(TG.fileError(tk));
  return Promise.resolve({ text: dec.text, encoding: dec.encoding, source: null });
