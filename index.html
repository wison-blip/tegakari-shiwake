    'example': function (b) {
      var ex = TG.EXAMPLES[b.getAttribute('data-ex')];
      var apply = function () { S.profile = { job: ex.job, tools: ex.tools, places: ex.places, other: ex.other }; save(true); D.pp = TG.parseProfile(S.profile, S.answers); render(); toast('記入例を入れました（配布の架空プロフィール）。'); };
      var filled = ['job', 'tools', 'places', 'other'].some(function (f) { return (S.profile[f] || '').trim(); });
      if (filled) confirmDlg('記入例で置き換えますか？', '今の4つの欄の内容は、記入例で置き換わります。', '置き換える', apply); else apply();
    },
    /* 配布の架空データ（ライターの記入例＋明細A）を読み込み、仕分けの結果まで一度に進む */
    'sample': function () {
      var ex = TG.EXAMPLES[TG.SAMPLE.profile];
      var start = function () {
        S.profile = { job: ex.job, tools: ex.tools, places: ex.places, other: ex.other };
        S.answers = {}; S.skipTopics = {};
        save(true);
        handleFile(new File([TG.SAMPLE.text], TG.SAMPLE.name, { type: 'text/csv' }), true);
      };
      var own = ['job', 'tools', 'places', 'other'].some(function (f) { return (S.profile[f] || '').trim() && S.profile[f] !== ex[f]; });
      var work = S.ds && D.tally && (D.tally.done || Object.keys(S.purchaseDetails || {}).length);
      if (own || work) confirmDlg('サンプルで試しますか？', '副業のプロフィールと明細が、配布の架空データ（ライターの記入例と明細A）に置き換わります。' + (S.ds ? '今の明細（' + esc(S.ds.name) + '）の確定区分・メモは、この画面から取り出せなくなります。' : ''), 'サンプルで試す', start);
      else start();
    },
    'paste-apply': function () {
      var t = $('#paste-ta'); if (!t || !t.value.trim()) { toast('貼り付ける文を入れてください。'); return; }
      var sp = TG.splitProfileText(t.value);
      S.profile = sp.fields; save(true); D.pp = TG.parseProfile(S.profile, S.answers);
      $('#dlg-paste').close(); render();
      toast(sp.labeled ? '見出しに合わせて4つの欄に入れました。' : '1の欄に入れました。');
    },
    'add-chip': function (b) {
      var f = b.getAttribute('data-field'), text = b.getAttribute('data-text'), ta = $('#f-' + f);
      var cur = ta.value.replace(/[、,\s]+$/, '');
      ta.value = cur ? cur + (/[。]$/.test(cur) ? '' : '、') + text : text;
      onProfileInput(ta);
      $('#chips-' + f).innerHTML = chipsHtml(f);
      ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    },
    'back-board': function () {
      var before = snapshot();
      TG.recompute(); D = TG.D;
      var m = diffMoved(before);
      go('board');
      toast('プロフィールを反映して仕分けし直しました。' + movedText(m));
    },
    'edit-profile': function () { go('profile'); },
    'pick': function () { var f = $('#file'); if (f) { f.value = ''; f.click(); } },
    'new-file': function () { go('statement'); },
    'import': function () { openImport(false); },
    'imp-apply': importApply,
    'lane': function (b) { S.lane = b.getAttribute('data-lane'); save(); render(); var t = $('.lane-tabs [aria-selected="true"]'); if (t) t.focus(); },
    'hl': function (b) {
      var id = b.getAttribute('data-sig');
      TG.hl = TG.hl === id ? null : id;
      if (TG.hl && window.matchMedia('(max-width: 860px)').matches) {
        var matches = D.res.filter(function (r, i) {
          return (r.sigIds || []).indexOf(id) >= 0 && !(S.onlyOpen && S.dec[D.rows[i].key]);
        });
        if (matches.length && !matches.some(function (r) { return r.cat === S.lane; })) { S.lane = matches[0].cat; save(); }
      }
      render();
      var button = $$('[data-act="hl"]').find(function (x) { return x.getAttribute('data-sig') === id; });
      if (button) button.focus();
    },
    'topic': function (b) {
      var id = b.getAttribute('data-t'), a = b.getAttribute('data-a');
      var before = snapshot();
      S.answers[id] = a; save(true);
      TG.recompute(); D = TG.D;
      var m = diffMoved(before);
      render();
      toast('答えを反映しました。' + movedText(m));
      var q = $('.qcard .btn'); if (q) q.focus(); else { var n = $('.next .btn'); if (n) n.focus(); }
    },
    'topic-skip': function (b) {
      S.skipTopics[b.getAttribute('data-t')] = true; save(true);
      TG.recompute(); D = TG.D; render();
      var q = $('.qcard .btn'); if (q) q.focus(); else { var n = $('.next .btn'); if (n) n.focus(); }
    },
    'review-other': function () {
      var transport = new Set(transitWork().open);
      var keys = D.rows.filter(function (row,i) { return !transport.has(row.key) && !S.dec[row.key] && D.res[i].cat === 'ask'; }).map(function (row) { return row.key; });
      if (keys.length) openReview(keys,'queue','other');
    },
    'review': function () {
      var keys = []; D.rows.forEach(function (row, i) { if (D.res[i].cat === 'ask' && !S.dec[row.key]) keys.push(row.key); });
      if (!keys.length) { toast('未確認の要判断はありません。'); return; }
      openReview(keys, 'queue');
    },
    'open': function (b) { openReview([b.getAttribute('data-key')], 'single'); },
    'resume-ride': function (b) {
      var key = b.getAttribute('data-key');
      if (heldTransit(key) && !S.dec[key] && D.byKey[key] !== undefined && matchingRide(D.byKey[key])) openReview([key], 'queue', 'one-held');
    },
    'correct-ride': correctRide,
    'swap-rides': function (b) { swapRides(b); },
    'ride-origin': checkRideOrigin,
    'clear-ride-ref': function () { var input = $('#ride-ref'); input.value = ''; filterRidePairs(input); input.focus(); },
    'rv-decide': function (b) { reviewDecide(b.getAttribute('data-final')); },
    'rv-skip': deferReview,
    'rv-hold-pair': deferRidePair,
    'transit-queue': openTransitGroup,
    'rv-prev': function () { var R = TG.RV; if (R.pos > 0) { R.pos--; drawReview(); } },
    'rv-undo': reviewUndo,
    'rv-clear': function () { var R = TG.RV; TG.decideRow(R.queue[R.pos], null); retally(); save(); var d = $('#dlg-review'); if (d) d.close(); say('未確認に戻しました'); },
    'bulk': function (b) { openBulk(b.getAttribute('data-cat')); },
    'bulk-biz': function () { openBulk('biz'); }, 'bulk-pvt': function () { openBulk('pvt'); },
    'bk-purchase': function (b) { openReview([b.getAttribute('data-key')], 'single'); },
    'bk-set': function (b) { TG.BK.sel[b.getAttribute('data-key')] = b.getAttribute('data-v'); drawBulk(); var x = $('[data-act="bk-set"][data-key="' + b.getAttribute('data-key') + '"][data-v="' + b.getAttribute('data-v') + '"]'); if (x) x.focus(); },
    'bk-commit': bulkCommit,
    'to-export': function () { go('export'); },
    'download': function () { download(); },
    'rule-del': function (b) { var k = b.getAttribute('data-k'); S.rules = S.rules.filter(function (e) { return ((e.tokens && e.tokens[0]) || e.desc) !== k; }); save(true); TG.recompute(); D = TG.D; $('#dlg-rules').close(); openRules(); render(); },
    'rule-clear': function () { confirmDlg('覚えた店をすべて削除しますか？', '店ごとの確定の記録をすべて消します。今の明細の確定は残ります。', '削除する', function () { S.rules = []; save(true); TG.recompute(); D = TG.D; render(); toast('覚えた店を削除しました。'); }); },
    'wipe': function () { confirmDlg('この端末の記録をすべて消しますか？', 'プロフィール、読み込んだ明細、確定した区分とメモ、覚えた店を、このブラウザから消します。元に戻せません。', 'すべて消す', function () { TG.clearAll(); S = TG.S; TG.recompute(); D = TG.D; render(); toast('この端末の記録をすべて消しました。'); }); },
    'confirm-ok': function () { var f = TG._confirmOk; TG._confirmOk = null; var d = $('#dlg-confirm'); if (d) d.close(); if (f) f(); },
    'how': openHow,
    'only-open': function () { S.onlyOpen = !S.onlyOpen; save(); render(); var b = $('[data-act="only-open"]'); if (b) b.focus(); },
    'rv-next': function (b) {
      var to = b.getAttribute('data-to');
      TG._afterReview = to === 'export' ? function () { go('export'); } : function () { openBulk(to); };
      var d = $('#dlg-review'); if (d) d.close();
    },
    'backup-save': backupSave,
    'backup-load': function () { var f = $('dialog[open] #backup-file') || $('#backup-file-v') || $('#backup-file'); if (f) { f.value = ''; f.click(); } }
  };
  ACT['rules'] = openRules;

  function bind() {
    window.addEventListener('pagehide', function () { saveDraft(); if (TG._saveTimer !== null) save(true); });
    document.addEventListener('toggle', function (e) { if (e.target && e.target.classList && e.target.classList.contains('bd-more')) boardMoreOpen = e.target.open; }, true);
    document.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-act],[data-go]') : null;
      if (!b || b.disabled) return;
      if (b.closest('#dlg-review') && b.getAttribute('data-act') !== 'rv-decide') saveDraft();
      if (b.hasAttribute('data-go')) {
        var to = b.getAttribute('data-go');
        var dlg = b.closest('dialog'); if (dlg) dlg.close();
        if (to === 'board' && S.view === 'profile' && S.ds) { ACT['back-board'](); return; }
        go(to); return;
      }
      var f = ACT[b.getAttribute('data-act')];
      if (f) f(b, e);
    });
    document.addEventListener('input', function (e) {
      if (e.target.id === 'ride-ref') { $('#ride-fare').value = ''; $('#ride-time').value = ''; filterRidePairs(e.target); return; }
      if (e.target.id === 'ride-time') { filterRidePairs(e.target); return; }
      if (e.target.matches && e.target.matches('textarea[data-field]')) onProfileInput(e.target);
      else if (e.target.id === 'rv-purchase-item' || (e.target.id === 'rv-memo' && $('#rv-purchase-item'))) {
        if (e.target.id === 'rv-purchase-item') itemHint();
        clearTimeout(draftTimer);
        draftTimer = setTimeout(saveDraft, 200);
      }
    });
    document.addEventListener('change', function (e) {
      if (e.target.id === 'ride-fare') { $('#ride-ref').value = ''; $('#ride-time').value = ''; filterRidePairs(e.target); return; }
      if (e.target.id === 'ride-time') { filterRidePairs(e.target); return; }
      var t = e.target;
      if (t.id === 'file') { handleFile(t.files && t.files[0]); }
      else if (t.id === 'rv-purchase-item' || (t.id === 'rv-memo' && $('#rv-purchase-item'))) saveDraft();
      else if (t.hasAttribute('data-answer')) {
        var topicId = t.getAttribute('data-answer');
        if (t.value) S.answers[topicId] = t.value;
        else { delete S.answers[topicId]; delete S.skipTopics[topicId]; }
        save(true); D.pp = TG.parseProfile(S.profile, S.answers);
        render();
        var focus = document.getElementById('answer-' + topicId) || $('.saved-answers select') || $('.pf-next button');
        if (focus) focus.focus();
        say(t.value ? '追加の質問への回答を変更しました。' : '追加の質問への回答を取り消しました。');
      }
      else if (t.id === 'backup-file' || t.id === 'backup-file-v') { backupLoad(t.files && t.files[0]); }
      else if (t.id === 'ex-bom') { S.bom = t.checked; save(true); }
      else if (t.id === 'use-rules') { var before = snapshot(); S.useRules = t.checked; save(true); TG.recompute(); D = TG.D; if (S.ds) { var m = diffMoved(before); toast(movedText(m)); } render(); }
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      document.addEventListener(ev, function (e) { var z = e.target.closest && e.target.closest('#drop'); if (!z) return; e.preventDefault(); z.classList.add('over'); });
    });
    document.addEventListener('dragleave', function (e) { var z = e.target.closest && e.target.closest('#drop'); if (z) z.classList.remove('over'); });
    document.addEventListener('drop', function (e) {
      var z = e.target.closest && e.target.closest('#drop');
      if (!z) { if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) e.preventDefault(); return; }
      e.preventDefault(); z.classList.remove('over');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; handleFile(f);
    });
    window.addEventListener('dragover', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0) e.preventDefault(); });
  }

  function init() {
    TG.S = S = TG.load();
    TG.D = D = {};
    try { TG.recompute(); } catch (e) { S.ds = null; TG.recompute(); }
    D = TG.D;
    render(); bind();
    if (TG.storageError) toast('このブラウザでは保存ができないため、ページを閉じると内容が消えます。');
  }
  TG.ui = { render: render, go: go, act: ACT, handleFile: handleFile, state: function () { return S; }, data: function () { return D; } };
  init();
})();

</script>
</body>
</html>
